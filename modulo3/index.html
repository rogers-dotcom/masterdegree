<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">

<title>Test Módulo 3 — Gestión Financiera y Evaluación de Inversiones</title>
<style>
:root{--bg:#f4f4f4;--card:#fff;--ink:#1a1a1a;--mut:#666;--line:#d5d5d5;--acc:#222;--ok:#2e7d32;--okbg:#e6f3e7;--ko:#b71c1c;--kobg:#fbe9e9;--sel:#e8e8e8}
@media(prefers-color-scheme:dark){:root{--bg:#161616;--card:#222;--ink:#eee;--mut:#aaa;--line:#444;--acc:#eee;--okbg:#1f3a22;--kobg:#4a1f1f;--sel:#333}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.25rem;margin:8px 0 2px}.sub{color:var(--mut);font-size:.9rem;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
button{font:inherit;cursor:pointer}
.mode{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;color:var(--ink)}
.mode.primary{border:2px solid var(--acc)}
.mode-t{display:block;font-weight:600}.mode-d{display:block;color:var(--mut);font-size:.85rem;margin-top:2px}.mode-n{font-weight:700;font-size:1.1rem;margin-left:12px;color:var(--mut)}
.ses{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.ses button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:6px 12px;font-size:.85rem}
.top{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--mut);margin-bottom:8px}
.bar{height:4px;background:var(--line);border-radius:2px;margin-bottom:14px}.bar i{display:block;height:100%;background:var(--acc);border-radius:2px}
.q{font-weight:600;font-size:1.05rem;margin-bottom:12px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;color:var(--ink)}
.opt.sel{background:var(--sel);border-color:var(--acc)}.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.ko{background:var(--kobg);border-color:var(--ko)}.opt:disabled{cursor:default}
.exp{border-left:3px solid var(--line);padding:8px 12px;margin:10px 0;font-size:.95rem}.exp .c{display:block;color:var(--mut);font-size:.8rem;margin-top:4px}
.row{display:flex;gap:8px;margin-top:12px}.btn{flex:1;background:var(--acc);color:var(--bg);border:0;border-radius:10px;padding:12px;font-weight:600}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.nota{font-size:2.2rem;font-weight:700;text-align:center;margin:8px 0}.nota small{font-size:1rem;color:var(--mut);font-weight:400}
.ok-t{color:var(--ok)}.ko-t{color:var(--ko)}
.rev{font-size:.9rem;margin-top:6px}.rev b{display:block}
.warn{font-size:.85rem;color:var(--mut);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;margin-top:14px}
.ses-tag{color:var(--mut);font-size:.8rem}
</style></head><body><div class="wrap" id="app"></div>
<script>
var BANCO=[{"s": 2, "t": "Según el profesor, los estados financieros son:", "o": ["Los ojos de la empresa", "Un trámite legal sin valor de gestión", "Solo el balance de situación", "Un documento para los bancos exclusivamente"], "r": 0, "e": "'La contabilidad son los ojos de la empresa': sirve para saber cómo está la compañía y para tomar decisiones.", "c": "Clase 1 00:25:45", "p": 0}, {"s": 2, "t": "El activo de una empresa es…", "o": ["Cómo se financia la empresa", "Lo que tiene la empresa / dónde invierte (estructura económica)", "El patrimonio neto", "Las deudas a corto plazo"], "r": 1, "e": "Activo = lo que tiene (estructura económica); pasivo = cómo se financia (estructura financiera).", "c": "Clase 2 00:10:31", "p": 0}, {"s": 2, "t": "¿Cuál de estas partidas es activo circulante?", "o": ["Un edificio", "Maquinaria", "Clientes que deben dinero", "Una deuda con proveedores"], "r": 2, "e": "Activo circulante = tesorería y lo que se hace líquido a corto: clientes y existencias. Edificios y maquinaria son activo fijo. Proveedores es pasivo.", "c": "Clase 1 00:28:37", "p": 1}, {"s": 2, "t": "El fondo de maniobra (working capital) es:", "o": ["Activo fijo − pasivo no circulante", "Activo circulante − pasivo circulante", "Equity − deuda", "Ingresos − gastos de explotación"], "r": 1, "e": "'Activo circulante menos pasivo circulante. Esto se llama fondo de maniobra, en inglés working capital.'", "c": "Clase 2 00:08:59", "p": 1}, {"s": 2, "t": "El equity (recursos propios) se compone de:", "o": ["Solo el capital aportado originalmente", "Capital inicial + ampliaciones de capital + beneficios no repartidos", "Deuda a largo plazo + beneficios", "Capital inicial + dividendos pagados"], "r": 1, "e": "Lo que pusieron los accionistas, más ampliaciones de capital, más beneficios no repartidos en forma de dividendo.", "c": "Clase 1 00:30:11", "p": 1}, {"s": 2, "t": "Las deudas a menos de 12 meses se consideran:", "o": ["Pasivo no circulante", "Pasivo circulante", "Activo circulante", "Patrimonio neto"], "r": 1, "e": "Pasivo circulante = deudas a menos de 12 meses (proveedores, Estado, Seguridad Social). Pasivo no circulante = más de 12 meses.", "c": "Clase 2 00:07:26", "p": 1}, {"s": 2, "t": "¿Por qué muchas empresas tecnológicas tienen poca deuda, según el profesor?", "o": ["Porque no pueden acceder a crédito", "Para tener mayor flexibilidad", "Porque la deuda es más cara que el equity", "Porque la ley se lo exige"], "r": 1, "e": "'Tener menos deuda para tener mayor nivel de flexibilidad' (ampliar fábrica, comprar otra empresa).", "c": "Clase 2 00:19:39", "p": 0}, {"s": 2, "t": "La estructura económica (activo) de una empresa depende sobre todo de:", "o": ["Lo que quieran los accionistas", "El sector / negocio de la empresa", "El tipo de interés", "La legislación fiscal"], "r": 1, "e": "Una eléctrica tiene mucho activo fijo; una consultora, poco. El pasivo depende más de lo que quieran los accionistas (salvo sectores como la banca).", "c": "Clase 2 00:10:31", "p": 0}, {"s": 2, "t": "El WACC es:", "o": ["La rentabilidad de los proyectos de la empresa", "El coste medio ponderado de la financiación (equity y deuda), en porcentaje", "El coste de la deuda antes de impuestos", "El beneficio sobre recursos propios"], "r": 1, "e": "'Es lo que te cuesta en media tu financiación, tanto en equity como en deuda. Es un porcentaje, un 7, un 8.'", "c": "Clase 2 00:12:01", "p": 1}, {"s": 2, "t": "Según el profesor, cualquier proyecto que haga la empresa debe tener una rentabilidad…", "o": ["Igual al coste de la deuda", "Superior al WACC", "Superior al risk free", "Igual al ROE"], "r": 1, "e": "'Cualquier proyecto que hagas debería tener una rentabilidad superior al WACC, porque si no no puedes hacerlo.'", "c": "Clase 2 00:13:31", "p": 1}, {"s": 3, "t": "El principio de prudencia contable dice que:", "o": ["Ingresos y gastos se contabilizan cuando se cobran y pagan", "Los ingresos solo cuando son ciertos; los gastos en cuanto se intuyen", "No se puede cambiar de criterio contable", "No se compensan ingresos con gastos"], "r": 1, "e": "'Los ingresos hay que contabilizarlos cuando los tienes y los gastos cuando intuyes que los vas a tener.'", "c": "Clase 2 00:28:49", "p": 0}, {"s": 3, "t": "Una empresa tiene un ingreso de 1.000 y un gasto de 300 y contabiliza un ingreso neto de 700. ¿Qué principio incumple?", "o": ["Homogeneidad", "Prudencia", "No compensación", "Relevancia"], "r": 2, "e": "'No puedes compensar ingresos con gastos ni activo con pasivo. Eso está prohibido en contabilidad.'", "c": "Clase 3 00:06:30", "p": 0}, {"s": 3, "t": "El principio de homogeneidad exige:", "o": ["Que todas las empresas usen el mismo plan contable", "No cambiar de criterio contable para poder comparar periodos", "Que los ingresos sean homogéneos", "Que la memoria sea cualitativa"], "r": 1, "e": "'No se puede cambiar de criterio contable… porque entonces no puedes comparar este año con el año pasado.'", "c": "Clase 2 00:28:49", "p": 0}, {"s": 3, "t": "Comparar las ventas de 2023 con las de 2024 es un análisis:", "o": ["Vertical", "Horizontal", "Dupont", "De escenarios"], "r": 1, "e": "Horizontal = comparar años o trimestres. Vertical = comparar dos cifras del mismo periodo (beneficio sobre ventas).", "c": "Clase 3 00:08:02", "p": 1}, {"s": 3, "t": "Los KPI deben ser SMART. ¿Qué significa la A?", "o": ["Auditables", "Alcanzables", "Anuales", "Absolutos"], "r": 1, "e": "Específicos, medibles, alcanzables, relevantes y en tiempo. 'Poner cosas inalcanzables lo que hace es enfurecer a la gente.'", "c": "Clase 3 00:09:32", "p": 1}, {"s": 3, "t": "¿Cuántos KPI debería tener una empresa, según el profesor?", "o": ["Cuantos más mejor", "Pocos: 'los core'; 200 KPI es como no tener ninguno", "Exactamente diez", "Uno por empleado"], "r": 1, "e": "'No puede haber muchos porque hay dispersión… 200 KPI es como que no haya ninguno.'", "c": "Clase 3 00:09:32", "p": 1}, {"s": 3, "t": "Liquidez y solvencia:", "o": ["Son lo mismo", "Liquidez está en el activo (tesorería); solvencia es tener poca deuda (pasivo)", "Solvencia está en el activo; liquidez en el pasivo", "Ambas se miden con el ROE"], "r": 1, "e": "'La liquidez está en el activo y la solvencia es tener poca deuda.' A corto plazo las empresas mueren por liquidez.", "c": "Clase 4 00:56:19", "p": 1}, {"s": 3, "t": "¿Qué tipo de costes considera el profesor más peligrosos?", "o": ["Los variables", "Los fijos", "Los financieros", "Los de amortización"], "r": 1, "e": "'Los más peligrosos son los costes fijos: los tienes independientemente de que produzcas o vendas (COVID, restaurante cerrado).'", "c": "Clase 3 00:20:31", "p": 0}, {"s": 3, "t": "Variabilizar costes significa:", "o": ["Aumentar los costes fijos", "Convertir costes fijos en variables para reducir el riesgo operativo", "Reducir la deuda", "Subir los precios"], "r": 1, "e": "Intentar que los costes fijos sean lo más variables posible; reduce el riesgo operativo.", "c": "Clase 3 00:20:31; Clase 4 00:53:04", "p": 0}, {"s": 3, "t": "Según el profesor, el objetivo de una empresa es:", "o": ["Ganar mucho dinero", "Ganar mucho invirtiendo poco: un ROE elevado", "Tener mucho activo", "No tener deuda"], "r": 1, "e": "'El objetivo de la compañía no es ganar mucho, es ganar mucho invirtiendo poco, que es lo que te mide el ROE.'", "c": "Clase 3 00:22:02", "p": 1}, {"s": 3, "t": "El ROE se calcula como:", "o": ["Beneficio / activo total", "Beneficio / recursos propios", "Ventas / activo", "Dividendo / precio"], "r": 1, "e": "ROE = beneficio / recursos propios (medios). ROA = beneficio / activo total.", "c": "Clase 3 00:13:00", "p": 1}, {"s": 3, "t": "En el test de Dupont, ROE = margen × rotación × …", "o": ["Liquidez", "Apalancamiento (activo / recursos propios)", "Solvencia", "Dividendo"], "r": 1, "e": "ROE = (beneficio/ventas) × (ventas/activo) × (activo/recursos propios).", "c": "Clase 13 00:34:43", "p": 1}, {"s": 3, "t": "Una tienda de relojes de lujo tendrá, en términos de Dupont:", "o": ["Margen alto y rotación alta", "Margen alto y rotación baja", "Margen bajo y rotación alta", "Margen bajo y rotación baja"], "r": 1, "e": "'Empresas de lujo: margen alto, poca rotación. Supermercado: margen bajo, rotación alta. Ambos altos, casi imposible.'", "c": "Clase 3 00:25:05", "p": 1}, {"s": 3, "t": "¿Qué ratio es el preferido por los inversores minoristas según el profesor?", "o": ["EV/EBITDA", "Rentabilidad por dividendo", "Rotación de activos", "Fondo de maniobra"], "r": 1, "e": "'Los inversionistas minoristas… este ratio les suele gustar mucho: invierten en empresas que pagan buenas rentabilidades por dividendo.'", "c": "Clase 3 00:23:33", "p": 1}, {"s": 3, "t": "La capitalización bursátil es:", "o": ["Beneficio neto / nº acciones", "Nº de acciones × precio", "Activo − pasivo", "Dividendo × nº acciones"], "r": 1, "e": "Capitalización bursátil = número de acciones multiplicado por su precio: lo que vale la compañía en bolsa.", "c": "Clase 3 00:23:33", "p": 0}, {"s": 3, "t": "¿Por qué, según Porter, hay empresas con ROE del 30-40% que nadie imita?", "o": ["Porque son muy grandes", "Porque tienen barreras de entrada y poder sobre clientes y proveedores", "Porque no tienen deuda", "Porque cotizan en bolsa"], "r": 1, "e": "Barreras de entrada, poder con proveedores y clientes, poca rivalidad, pocos sustitutivos (ejemplo: Microsoft, WhatsApp).", "c": "Clase 2 00:15:01", "p": 0}, {"s": 3, "t": "En el acrónimo FRICTO, la C significa:", "o": ["Coste", "Control", "Capital", "Crédito"], "r": 1, "e": "Flexibilidad, Riesgo, Ingreso, Control, Timing, Otros. Control: las ampliaciones de capital pueden hacer perder el control de la empresa.", "c": "Clase 2 00:19:39", "p": 1}, {"s": 3, "t": "En FRICTO, la 'I' de ingreso se refiere a que:", "o": ["La deuda genera ingresos", "El coste de la deuda es menor que el coste del equity", "Los dividendos son ingresos", "El equity no tiene coste"], "r": 1, "e": "'Ingreso: las tasas de interés, el coste de la deuda es menor que lo que tienes que remunerar a los accionistas.'", "c": "Clase 2 00:21:12", "p": 1}, {"s": 3, "t": "El debate sobre cuánta deuda y cuánto equity tener se llama:", "o": ["Estructura económica", "Estructura de capital", "Fondo de maniobra", "Análisis horizontal"], "r": 1, "e": "'Cómo te financias se conoce en la jerga financiera como estructura de capital.'", "c": "Clase 2 00:21:12", "p": 0}, {"s": 4, "t": "La financiación interna o autofinanciación es:", "o": ["Un préstamo bancario", "Los beneficios no repartidos en forma de dividendo", "Una ampliación de capital", "La emisión de bonos"], "r": 1, "e": "Interna = recursos propios que vienen de beneficios no repartidos. La deuda siempre es externa; la ampliación de capital es equity externo.", "c": "Clase 4 00:13:10", "p": 1}, {"s": 4, "t": "¿Cuál de estas es financiación ajena?", "o": ["Beneficios no repartidos", "Ampliación de capital", "Emisión de bonos", "Reservas"], "r": 2, "e": "Financiación ajena = deuda: préstamo bancario, proveedores no pagados, bonos.", "c": "Clase 4 00:11:35", "p": 1}, {"s": 4, "t": "El equity, en cuanto a plazo, es financiación:", "o": ["A corto plazo", "Siempre a largo plazo, porque no hay que devolverlo", "A 12 meses", "Depende del sector"], "r": 1, "e": "'El equity siempre es a largo, no hay que devolverlo, aunque sí hay que dar una cierta rentabilidad.'", "c": "Clase 4 00:14:42", "p": 0}, {"s": 4, "t": "Un edificio debe financiarse con:", "o": ["Préstamos a tres meses", "Financiación a largo plazo", "Proveedores", "Tesorería"], "r": 1, "e": "'Existe cierta correlación entre tu activo y la financiación que necesitas. Un edificio no se puede financiar con préstamos a tres meses.'", "c": "Clase 4 00:16:12", "p": 0}, {"s": 4, "t": "¿Por qué se multiplica el coste de la deuda por (1 − t)?", "o": ["Porque los bancos cobran menos a las grandes empresas", "Porque los intereses son deducibles y reducen los impuestos a pagar", "Porque la deuda es más barata que el equity", "Porque los dividendos son deducibles"], "r": 1, "e": "'Si pagas intereses ganas menos dinero y pagas menos impuestos. La deuda tiene una ventaja fiscal que no tiene el equity.'", "c": "Clase 4 00:20:53", "p": 1}, {"s": 4, "t": "Para calcular el WACC, el coste de la deuda debe tomarse:", "o": ["Al tipo histórico de los préstamos existentes", "A tipos de interés actuales (coste marginal)", "Al tipo medio de los últimos 10 años", "Al risk free"], "r": 1, "e": "'Hay que hacerlo a tasas de interés actuales… es el coste marginal, el de pedir un millón más.'", "c": "Clase 4 00:36:05; 00:42:20", "p": 0}, {"s": 4, "t": "El coste de los recursos propios es…", "o": ["Explícito, como el interés de un préstamo", "Implícito: dividendos y/o subida del precio de la acción", "Cero, porque no hay que devolverlos", "Igual al risk free"], "r": 1, "e": "'Una cosa es que no haya que devolverlos y otra muy diferente que no tengan coste.' La rentabilidad viene por dividendos o por el precio.", "c": "Clase 4 00:22:26", "p": 0}, {"s": 4, "t": "En el modelo CAPM, Ke = Rf + β × (Rm − Rf). ¿Qué es el equity risk premium?", "o": ["La beta", "La rentabilidad del bono a 10 años", "La rentabilidad histórica de la bolsa por encima del activo libre de riesgo", "El dividendo"], "r": 2, "e": "'La rentabilidad de la bolsa por encima del activo libre de riesgo.'", "c": "Clase 2 00:24:15", "p": 1}, {"s": 4, "t": "¿Qué se usa como activo libre de riesgo en el CAPM?", "o": ["El Euribor a 3 meses", "La rentabilidad del bono del gobierno a 10 años del país de la empresa", "El dividendo de la empresa", "El WACC"], "r": 1, "e": "'Lo que pagan los bonos del gobierno a 10 años… por consenso de mercado.'", "c": "Clase 4 00:45:24", "p": 1}, {"s": 4, "t": "Dos empresas con los mismos Rf y prima de mercado; A tiene beta 0,8 y B beta 1,6. ¿Cuál tiene mayor coste del equity?", "o": ["A", "B", "Igual", "Depende del dividendo"], "r": 1, "e": "'A más beta, más rentabilidad exigida', porque tiene más riesgo (ejemplo de clase: 8,40% vs 11,60%).", "c": "Clase 4 00:46:55", "p": 1}, {"s": 4, "t": "El CAPM es un modelo:", "o": ["Basado en dividendos reales", "Normativo: dice qué rentabilidad debería exigir un inversor", "Contable", "De valoración de bonos"], "r": 1, "e": "'El modelo CAPM es un modelo normativo. Gordon-Shapiro no es normativo, es la rentabilidad real que estás teniendo vía dividendo.'", "c": "Clase 4 00:22:26; 00:43:51", "p": 1}, {"s": 4, "t": "En Gordon-Shapiro, Ke = D1/P + g. ¿Qué es g?", "o": ["La beta", "La tasa a la que crees que crecerán los dividendos desde hoy hasta el infinito", "El tipo impositivo", "La inflación"], "r": 1, "e": "'G viene de growth: la tasa que tú crees que van a crecer los dividendos desde hoy hasta el infinito.'", "c": "Clase 4 00:30:02", "p": 1}, {"s": 4, "t": "¿Por qué Gordon-Shapiro es imperfecto según el profesor?", "o": ["Porque usa la beta", "Porque empresas como Amazon crean mucho valor sin pagar dividendos", "Porque ignora los impuestos", "Porque solo vale para bancos"], "r": 1, "e": "'Hay empresas que han generado muchísimo valor para los accionistas pero no han repartido nunca un dividendo.' Se utiliza poco; el CAPM es el más usado.", "c": "Clase 4 00:30:02; 00:45:24", "p": 1}, {"s": 4, "t": "¿Cuál es el modelo más utilizado para estimar el coste del equity?", "o": ["Gordon-Shapiro", "CAPM", "Black-Scholes", "Dupont"], "r": 1, "e": "'El modelo CAPM es el modelo que más se utiliza.'", "c": "Clase 4 00:45:24", "p": 1}, {"s": 4, "t": "El riesgo sistemático:", "o": ["Es específico de cada empresa y se diversifica", "Es el del mercado (recesión, guerra, COVID), se mide con la beta y no es diversificable", "No debe remunerarse al accionista", "Se elimina con más empresas en cartera"], "r": 1, "e": "Sistemático = mercado, beta, no diversificable, se remunera. No sistemático = específico, se diversifica, no se remunera.", "c": "Clase 4 00:25:29", "p": 1}, {"s": 4, "t": "Los accionistas deben ser remunerados por:", "o": ["El riesgo específico", "El riesgo sistemático", "Ambos", "Ninguno"], "r": 1, "e": "'Los accionistas no deben ser remunerados por el riesgo no sistemático, sino solo por el riesgo sistemático.'", "c": "Clase 4 00:26:59", "p": 1}, {"s": 4, "t": "Ordena de mayor a menor coste: risk free, coste del equity, coste de la deuda.", "o": ["Rf > deuda > equity", "Equity > deuda > Rf", "Deuda > equity > Rf", "Equity > Rf > deuda"], "r": 1, "e": "'El coste del equity es mayor que el de la deuda y el de la deuda mayor que el risk free, que por definición es el que menos paga.'", "c": "Clase 4 00:34:33", "p": 1}, {"s": 4, "t": "En el gráfico TIR vs. WACC, la línea del WACC sube a medida que se hacen más proyectos porque:", "o": ["Los proyectos son peores", "Al endeudarse más, bancos e inversores exigen mayores retornos", "Sube la inflación", "Baja la beta"], "r": 1, "e": "'A medida que hago más proyectos me voy endeudando y los bancos y los inversionistas me pedirán mayores rentabilidades.'", "c": "Clase 4 00:17:44", "p": 0}, {"s": 4, "t": "Una empresa tiene ROE del 5% y un coste del equity (CAPM) del 10%. La empresa está:", "o": ["Creando valor", "Destruyendo valor", "Ganando lo que debe", "En equilibrio"], "r": 1, "e": "'Si el coste del equity es 10 y solo está ganando un 5, la empresa está destruyendo valor.' ROE > Ke crea valor.", "c": "Clase 4 00:37:39", "p": 1}, {"s": 4, "t": "Tener más equity en la estructura de capital implica:", "o": ["Más riesgo y menor coste", "Menos riesgo pero mayor coste", "Menos riesgo y menor coste", "Más riesgo y mayor coste"], "r": 1, "e": "'Cuanto más equity, menos riesgo pero mayor coste. La deuda tiene más riesgo pero menor coste.' Es un trade-off.", "c": "Clase 4 00:51:32", "p": 0}, {"s": 4, "t": "El riesgo operativo está ligado a:", "o": ["La deuda", "Los costes fijos", "El tipo de cambio", "La beta"], "r": 1, "e": "'Riesgo operativo: tener mucho coste fijo. Si tus ventas caen, pierdes dinero.' El riesgo financiero es tener más deuda.", "c": "Clase 4 00:51:32", "p": 0}, {"s": 4, "t": "Las NOF (necesidades operativas de fondos) aumentan cuando:", "o": ["Se cobra a los clientes antes", "Los clientes pagan tarde, hay mucho stock y se paga pronto a proveedores", "Se reduce el stock", "Baja el WACC"], "r": 1, "e": "'Cuanto más tarde cobres de los clientes, peor; cuanto más tarde pagues a proveedores, mejor; días de stock hay que financiarlos.'", "c": "Clase 4 00:54:37", "p": 0}, {"s": 4, "t": "Al aplicar el CAPM, los datos (Rf, prima, etc.) deben estar:", "o": ["En dólares siempre", "En la misma divisa", "En la divisa del inversor", "En euros"], "r": 1, "e": "'Todo esto tiene que estar en la misma divisa, no puedes mezclar diferentes divisas.'", "c": "Clase 4 00:34:33", "p": 0}, {"s": 5, "t": "¿Por qué el análisis de inversiones se hace con flujos de caja y no con beneficio?", "o": ["Porque el beneficio siempre es mayor", "Porque el beneficio es contable y opinable; la caja es un hecho", "Porque la caja incluye las amortizaciones", "Porque lo exige Hacienda"], "r": 1, "e": "'El beneficio es una opinión, la caja es un hecho.' El beneficio depende de amortizaciones y es manipulable.", "c": "Clase 5 00:05:31", "p": 1}, {"s": 5, "t": "El método indirecto de cálculo del flujo de caja:", "o": ["Suma caja que entra menos caja que sale", "Parte de la contabilidad (EBIT, impuestos, amortizaciones, CAPEX, fondo de maniobra) y es el más utilizado", "Es el más fácil y el más usado", "Solo lo usan los particulares"], "r": 1, "e": "'El indirecto es más complejo, pero la mayoría de los analistas lo hacen así porque lo que tienes es la contabilidad.'", "c": "Clase 5 00:07:05", "p": 0}, {"s": 5, "t": "Al pasar del beneficio al flujo de caja por el método indirecto, las amortizaciones se…", "o": ["Restan, porque son salida de caja", "Suman, porque reducen el beneficio pero no son salida de caja", "Ignoran", "Multiplican por (1 − t)"], "r": 1, "e": "'Las amortizaciones es menor beneficio, pero no es salida de caja', por eso se suman. El CAPEX se resta: es caja pero no beneficio.", "c": "Clase 5 00:10:11", "p": 0}, {"s": 5, "t": "El VAN mide:", "o": ["La rentabilidad en porcentaje", "Cuánto ganas en dinero con un proyecto, en valor presente", "El plazo de recuperación", "El coste de financiación"], "r": 1, "e": "'El VAN es en dinero, cuánto ganas; la TIR sería en porcentaje.'", "c": "Clase 5 00:10:11", "p": 1}, {"s": 5, "t": "La tasa de descuento del VAN es:", "o": ["Siempre exactamente el WACC", "La rentabilidad mínima exigida al proyecto según su riesgo, que como mínimo es el WACC", "El tipo de interés del banco", "La inflación"], "r": 1, "e": "'Mucha gente pone directamente el WACC, pero no es el WACC: es la tasa mínima que tú exiges, que como mínimo debe ser el WACC.'", "c": "Clase 5 00:14:46", "p": 1}, {"s": 5, "t": "Si el VAN de un proyecto es cero:", "o": ["Hay que hacerlo", "Ni ganas ni pierdes; el profesor diría no hacerlo", "Pierdes dinero", "La TIR es negativa"], "r": 1, "e": "'Si VAN igual a cero no ganas ni pierdes. Yo diría no hacerlo: las empresas están para ganar dinero, no para estar en break even.'", "c": "Clase 5 00:17:48", "p": 1}, {"s": 5, "t": "¿Cuántos años de flujos hay que incluir en el VAN?", "o": ["Siempre 5 años", "Siempre 10 años", "Todos los de la vida útil del proyecto; si es infinito, con valor residual", "Hasta que el acumulado sea positivo"], "r": 2, "e": "'Una maquinaria a 10 años, los 10. Toda la vida útil. Si es infinito, 10-15 años y luego un valor residual.'", "c": "Clase 5 00:19:22", "p": 0}, {"s": 5, "t": "En Excel, el VAN se calcula con:", "o": ["=VAN(tasa; flujos)", "=VNA(tasa; flujos) y restando aparte la inversión inicial", "=TIR(flujos)", "=VF(tasa; n; pago)"], "r": 1, "e": "'En Excel el VAN no es VAN, es VNA… y le resto la inversión inicial.'", "c": "Clase 4 02:11:32; Clase 5 00:24:06", "p": 0}, {"s": 5, "t": "La TIR es:", "o": ["La tasa que hace el VAN igual a cero", "La tasa de descuento del WACC", "El dinero que gana un proyecto", "El periodo de recuperación"], "r": 0, "e": "'Lo igualas a cero y lo que despejas es el tipo de interés.' Se hace en Excel porque a mano es por iteración.", "c": "Clase 5 00:27:08", "p": 1}, {"s": 5, "t": "¿Qué problema técnico tiene la TIR según el profesor?", "o": ["No se puede calcular en Excel", "Con flujos negativos y positivos mezclados puede haber varias TIR, y supone reinversión a la misma TIR", "Siempre es menor que el WACC", "No tiene en cuenta el valor del dinero en el tiempo"], "r": 1, "e": "'Cuando se mezclan flujos negativos y positivos hay varias TIRES. Se supone que los flujos se reinvierten a la misma tasa, y eso no ocurre en la práctica.'", "c": "Clase 5 00:31:52", "p": 0}, {"s": 5, "t": "Entre VAN y TIR, el profesor dice que…", "o": ["La TIR es mejor porque es un porcentaje", "Casi es mejor el VAN, porque te ahorras los problemas técnicos de la TIR", "Son equivalentes siempre", "Hay que usar solo el payback"], "r": 1, "e": "'Casi es mejor el VAN que la TIR. El VAN es cuánto ganas.' Normalmente se analizan ambos.", "c": "Clase 5 00:47:13", "p": 0}, {"s": 5, "t": "Dos proyectos con la misma inversión y mismo riesgo; A tiene mayor VAN y mayor TIR. ¿Cuál se elige?", "o": ["B", "A, siempre que su TIR supere la tasa mínima exigida", "Ninguno", "Depende del payback"], "r": 1, "e": "'Para un mismo nivel de riesgo, el proyecto A, siempre que sea superior a la tasa mínima requerida, que como mínimo es el WACC.'", "c": "Clase 5 00:30:18", "p": 0}, {"s": 5, "t": "El payback descontado respecto al payback simple:", "o": ["Es menor", "Es mayor, porque los flujos descontados son más pequeños", "Es igual", "No se puede calcular"], "r": 1, "e": "'Me sale más años porque los flujos de caja los aminoro al tener en cuenta que dinero hoy no es igual a dinero mañana.'", "c": "Clase 5 01:01:05", "p": 1}, {"s": 5, "t": "¿Qué limitación tiene el payback?", "o": ["No tiene en cuenta la inversión inicial", "No dice cuánto ganas una vez recuperada la inversión", "Solo sirve para bonos", "Es muy difícil de calcular"], "r": 1, "e": "'Te dice cuánto tardas en recuperar, pero no cuánto ganas una vez recuperado.' Gusta a particulares y en países de alto riesgo.", "c": "Clase 5 00:37:56", "p": 1}, {"s": 5, "t": "El valor residual de un proyecto se calcula como:", "o": ["Último flujo × (1 + g) / (k − g)", "Inversión inicial × (1 + g)", "Σ de todos los flujos", "Último flujo / k"], "r": 0, "e": "'El último flujo por G… dividido entre la tasa mínima exigida (como mínimo el WACC) menos la tasa de crecimiento.' Representa el valor del año n al infinito.", "c": "Clase 5 01:08:45", "p": 1}, {"s": 5, "t": "¿Cuántos escenarios suelen presentarse, según el profesor?", "o": ["Uno", "Dos", "Tres: pesimista, neutral y optimista", "Diez"], "r": 2, "e": "'Normalmente 3: positivo, neutral y negativo.' A mayor incertidumbre, más habitual su uso.", "c": "Clase 5 01:10:20", "p": 1}, {"s": 6, "t": "La valoración por opciones reales es, respecto al VAN:", "o": ["Un sustituto", "Un método complementario: VAN + valor de la opcionalidad del proyecto", "Lo mismo", "Solo aplicable a finanzas"], "r": 1, "e": "'Es un método no sustitutivo sino complementario al VAN: a la valoración por VAN le sumas la capacidad del proyecto de generar otras opciones.'", "c": "Clase 6 00:26:27", "p": 1}, {"s": 6, "t": "En una opción, ¿quién tiene derechos y quién obligaciones?", "o": ["Ambos tienen derechos", "El comprador tiene derechos; el vendedor, obligaciones", "El vendedor tiene derechos; el comprador, obligaciones", "Ninguno: es un contrato simétrico"], "r": 1, "e": "'Hay asimetría: el comprador tiene derechos y el vendedor obligaciones. Por eso el comprador paga al vendedor la prima.'", "c": "Clase 6 00:06:26", "p": 1}, {"s": 6, "t": "Una put es:", "o": ["El derecho a comprar", "El derecho a vender", "La obligación de comprar", "Un bono"], "r": 1, "e": "Call = derecho a comprar; put = derecho a vender.", "c": "Clase 6 00:06:26", "p": 1}, {"s": 6, "t": "¿Cuáles son los tres elementos que siempre aparecen en una opción, según el profesor?", "o": ["Prima, beta y WACC", "Strike, fecha de vencimiento e importe nominal", "Dividendo, precio y g", "Cupón, rating y duración"], "r": 1, "e": "'Siempre tiene que haber un strike o precio de ejercicio, una fecha de vencimiento y un importe nominal.'", "c": "Clase 6 00:08:03", "p": 0}, {"s": 6, "t": "Una opción europea:", "o": ["Se negocia solo en Europa", "Solo puede ejercitarse en la fecha de vencimiento", "Puede ejercitarse en cualquier momento", "No tiene vencimiento"], "r": 1, "e": "'Las europeas solo las puedes ejercitar a vencimiento; las americanas en cualquier momento hasta el vencimiento. Son nombres.'", "c": "Clase 6 00:11:04", "p": 0}, {"s": 6, "t": "Para el comprador de una call, la pérdida máxima y el beneficio máximo son:", "o": ["Ilimitada / la prima", "La prima / ilimitado", "El strike / el strike", "Cero / cero"], "r": 1, "e": "'La pérdida máxima es la prima que has pagado; el máximo beneficio es infinito.'", "c": "Clase 6 00:12:36", "p": 1}, {"s": 6, "t": "La prima de una opción es igual a:", "o": ["Strike − precio del subyacente", "Valor intrínseco + valor temporal", "Volatilidad × tiempo", "Dividendo + g"], "r": 1, "e": "'Prima = valor intrínseco más valor temporal.'", "c": "Clase 6 00:15:39", "p": 1}, {"s": 6, "t": "El valor intrínseco de una opción es:", "o": ["Lo que sobrepagas por el tiempo que queda", "Lo que valdría la opción si expirase hoy; cero o positivo", "Siempre negativo si está fuera de dinero", "La prima"], "r": 1, "e": "'Es lo que valdría una opción si hoy expirase. Puede ser cero o positivo', nunca negativo.", "c": "Clase 6 00:15:39; 00:17:10", "p": 1}, {"s": 6, "t": "El valor temporal de una opción crece cuando:", "o": ["Baja la volatilidad", "Queda más tiempo hasta el vencimiento y hay más volatilidad", "Se acerca el vencimiento", "Baja el precio del subyacente"], "r": 1, "e": "'Cuanto más tiempo quede y cuanto más volátil sea el subyacente, mayor valor temporal.' El último día solo queda valor intrínseco.", "c": "Clase 6 00:17:10", "p": 1}, {"s": 6, "t": "Sobre el modelo Black-Scholes, el profesor dijo:", "o": ["Hay que saber la fórmula de memoria", "Explica el porqué (prima, valor temporal, volatilidad), pero la fórmula no hay que saberla", "Es inferior al modelo binomial", "No sirve para opciones reales"], "r": 1, "e": "'Esta fórmula no la tenéis que saber. Lo que sí tiene sentido es saber por qué las cosas ocurren.' Prefiere Black-Scholes al binomial.", "c": "Clase 6 00:29:31", "p": 0}, {"s": 6, "t": "¿Puede una prima o un valor temporal ser negativo?", "o": ["Sí, cuando la opción está muy fuera de dinero", "No: 'no puedes cobrar por tener un derecho'", "Solo en opciones americanas", "Solo en puts"], "r": 1, "e": "'El valor temporal no puede ser negativo y las primas tampoco. No puedes cobrar por tener un derecho, por muy malo que sea.'", "c": "Clase 6 00:18:43", "p": 0}, {"s": 6, "t": "Si suben los tipos de interés, el precio de un bono ya emitido:", "o": ["Sube", "Baja", "No cambia", "Sube solo si es high yield"], "r": 1, "e": "'Si los tipos de interés suben, el precio del bono baja, y viceversa.' Nadie compra el bono A de cupón 5 a 100 si existe el bono B de cupón 10.", "c": "Clase 6 00:33:27", "p": 1}, {"s": 6, "t": "Los bonos habitualmente cotizan / se habla de ellos en términos de:", "o": ["Precio", "TIR (yield)", "Duración", "Rating"], "r": 1, "e": "'Lo habitual no es hablar de precio sino de TIR. En Bloomberg lo que más interesa es la columna yield.'", "c": "Clase 6 00:36:32", "p": 1}, {"s": 6, "t": "¿Qué es el spread de crédito?", "o": ["La diferencia entre cupón y precio", "Lo que un emisor paga por encima del activo libre de riesgo por su mayor riesgo", "La comisión del banco", "La diferencia entre duración y vencimiento"], "r": 1, "e": "'Lo que tú sobre una empresa (o España) pagas sobre el activo libre de riesgo.' Alemania es el risk free en la eurozona; España ≈ +50 pb.", "c": "Clase 6 00:34:58; 00:41:20", "p": 0}, {"s": 6, "t": "Un bono con más vencimiento, ante movimientos de tipos de interés, es:", "o": ["Menos sensible", "Más sensible", "Igual de sensible", "Insensible"], "r": 1, "e": "'Bonos a más vencimiento son más sensibles a subidas y bajadas de tasas de interés.'", "c": "Clase 6 00:34:58", "p": 0}, {"s": 6, "t": "¿Qué significa que un bono pase de investment grade a high yield?", "o": ["Que paga menos interés", "Que muchos inversores no pueden comprarlo por normativa, así que paga más y es más difícil financiarse", "Que entra en default", "Que lo califica solo Fitch"], "r": 1, "e": "'Hay muchos inversionistas que no pueden por normativa invertir contigo… tienes que pagar muchos más tipos de interés.' Antes se llamaban bonos basura.", "c": "Clase 6 00:44:23", "p": 0}, {"s": 6, "t": "¿Cuáles son las agencias de rating más conocidas que citó el profesor?", "o": ["Bloomberg, Reuters y FT", "Moody's, Standard & Poor's y Fitch", "BCE, Fed y BoE", "DBRS, JCR y Scope"], "r": 1, "e": "'Las más populares: Moody's, Standard & Poor's y Fitch. Existen más: DBRS (canadiense), alguna en Japón.'", "c": "Clase 6 00:45:57", "p": 1}, {"s": 6, "t": "Una curva de tipos invertida suele anticipar:", "o": ["Subidas de tipos", "Bajadas de tipos y, normalmente, recesión", "Inflación alta", "Subidas de la bolsa"], "r": 1, "e": "'Se producen cuando hay perspectiva de bajadas inminentes de tipos… predicen recesión económica' (antes del COVID).", "c": "Clase 6 00:47:27", "p": 1}, {"s": 6, "t": "La duración de un bono con cupones, respecto a su vencimiento, es:", "o": ["Mayor", "Ligeramente inferior", "Igual", "Cero"], "r": 1, "e": "'La duración es siempre ligeramente inferior al vencimiento, excepto en un bono cupón cero', donde coinciden.", "c": "Clase 6 00:56:43", "p": 0}, {"s": 6, "t": "En caso de quiebra, ¿quién cobra primero?", "o": ["El accionista", "Los bonos senior", "Los bonos subordinados", "Los híbridos"], "r": 1, "e": "Orden: senior (y senior secured con colateral) > subordinados > híbridos/preferentes > accionista, que cobra el último.", "c": "Clase 6 00:59:45", "p": 1}, {"s": 6, "t": "Un bono híbrido o preferente es:", "o": ["Un bono del Estado", "Un bono con rasgos de acción: cupón condicionado a beneficios o perpetuo", "Un bono cupón cero", "Un bono senior secured"], "r": 1, "e": "'Los híbridos son bonos pero tienen alguna cosa parecida a una acción: no pagan cupón si la empresa no gana dinero, o son eternos.'", "c": "Clase 6 01:01:17", "p": 0}, {"s": 6, "t": "Según el profesor, ¿qué dos cosas son las más importantes al construir una cartera de renta fija?", "o": ["Divisa y zona geográfica", "Vencimiento/duración y calidad crediticia", "Cupón y precio", "Rating y divisa"], "r": 1, "e": "'Las dos cosas más importantes a elegir son vencimiento (duración) y calidad crediticia'; también divisa, zona geográfica y tipo de bono.", "c": "Clase 6 00:53:40; 00:55:11", "p": 0}, {"s": 6, "t": "¿Qué riesgo es 'raro, no imposible' en bonos según el profesor?", "o": ["Tipo de interés", "Default / impago", "Liquidez", "Divisa"], "r": 1, "e": "'Que no te paguen no es normal; es raro un impago, no imposible, pero no es lo más frecuente.'", "c": "Clase 6 00:39:48", "p": 0}, {"s": 7, "t": "Para el profesor, la valoración de una empresa es…", "o": ["Lo primero que hay que hacer", "Lo cuarto: antes macroeconomía, sector y posicionamiento", "Irrelevante", "Solo por múltiplos"], "r": 1, "e": "'La valoración para mí no es lo primero, sino lo cuarto', como un piso: primero localización, metros y calidades.", "c": "Clase 13 00:13:12", "p": 0}, {"s": 7, "t": "En el DCF, enterprise value menos deuda es igual a:", "o": ["El WACC", "El equity value (valor de los recursos propios)", "El EBITDA", "El valor residual"], "r": 1, "e": "'Te sale el enterprise value, le restas la deuda y te sale el equity value; lo divides entre el número de acciones y te sale el precio objetivo.'", "c": "Clase 13 00:11:41", "p": 1}, {"s": 7, "t": "Los flujos de caja en un DCF se descuentan a:", "o": ["La TIR", "El WACC", "El risk free", "La inflación"], "r": 1, "e": "'Calculas los flujos de caja futuros y los descuentas a una tasa que se llama el WACC.'", "c": "Clase 13 00:23:56", "p": 1}, {"s": 7, "t": "¿Qué método de valoración es 'teóricamente mejor' según el profesor, y por qué?", "o": ["Múltiplos, por ser más fácil", "DCF, porque mira hacia el futuro", "Valor contable, por objetivo", "Gordon-Shapiro, por los dividendos"], "r": 1, "e": "'El DCF es más complicado, pero teóricamente es mejor porque miras hacia futuro.' Normalmente se valora por ambos.", "c": "Clase 13 00:19:14", "p": 0}, {"s": 7, "t": "El valor de liquidación de una empresa como Coca-Cola es:", "o": ["Su valor real", "Como mucho un valor mínimo: se paga por la capacidad de generar caja, no por los inmuebles", "Igual al enterprise value", "Mayor que el DCF"], "r": 1, "e": "'Tú pagas por la capacidad de generar flujo de caja. El valor de liquidación lo veo como un valor mínimo', con sentido en inmobiliarias.", "c": "Clase 13 00:20:49", "p": 0}, {"s": 7, "t": "Valorar por múltiplos exige:", "o": ["Comparar con cualquier empresa cotizada", "Comparar 'peras con peras': mismo sector, riesgo, tamaño, liquidez", "Usar siempre el PER", "Descontar flujos"], "r": 1, "e": "'Solamente tienes que comparar cosas comparables: no puedes comparar un apartamento en Manhattan con uno en un pueblo.'", "c": "Clase 13 00:19:14; 00:37:47", "p": 0}, {"s": 7, "t": "El PER es:", "o": ["Precio / valor contable", "Precio / beneficio por acción", "EV / EBITDA", "Dividendo / precio"], "r": 1, "e": "'PER: precio partido beneficio por acción. Tal vez el ratio más usado para valorar.' Precio = BPA × PER.", "c": "Clase 13 00:40:50", "p": 1}, {"s": 7, "t": "¿Cuál de estos ratios sirve para VALORAR y no para ver cómo está la empresa?", "o": ["ROE", "ROA", "EV/EBITDA", "Deuda / pasivo"], "r": 2, "e": "'Hay dos tipos de ratios: unos para valorar (PER, EV/EBITDA) y otros para ver la rentabilidad o la deuda (ROE, ROA, apalancamiento).'", "c": "Clase 13 00:30:05", "p": 0}, {"s": 7, "t": "Si bajan los tipos de interés, el PER tiende a:", "o": ["Bajar", "Subir, porque los inversores se van a la bolsa", "No cambiar", "Igualarse al ROE"], "r": 1, "e": "'Cuando las tasas de interés están bajas la gente tiende a irse a bolsa y el PER tiende a subir; al 8-10% vende acciones y se va a bonos.'", "c": "Clase 13 00:43:53", "p": 0}, {"s": 7, "t": "La 'trampa de valor' consiste en:", "o": ["Pagar múltiplos muy altos", "Comprar algo porque está muy barato, cuando está barato por ser de mala calidad", "Valorar sin DCF", "Comprar empresas familiares"], "r": 1, "e": "'Lo que está muy barato normalmente está barato porque tiene problemas' (los tres pisos más baratos de Madrid).", "c": "Clase 13 00:30:05", "p": 0}, {"s": 7, "t": "La creación de valor para el accionista es:", "o": ["Ganar dinero", "Ganar más de lo que el accionista exige (ROE > coste del equity)", "Pagar dividendos", "Tener un PER alto"], "r": 1, "e": "'Creación de valor no es ganar dinero, es ganar más dinero de lo que el inversionista espera.' Beneficio − recursos propios × Ke.", "c": "Clase 13 00:43:53", "p": 1}, {"s": 7, "t": "¿Por qué el precio de Coca-Cola es mucho más volátil que su beneficio por acción?", "o": ["Porque el BPA es manipulable", "Porque el PER sube y baja mucho según el ánimo de los inversores", "Porque paga dividendos", "Porque tiene mucha deuda"], "r": 1, "e": "'El beneficio por acción es muy estable; el PER sube y baja mucho: cuando los inversionistas están contentos pagan PER altos.'", "c": "Clase 13 00:42:22", "p": 0}, {"s": 7, "t": "¿De qué depende que un múltiplo sea alto o bajo? (señala la opción INCORRECTA)", "o": ["Del sector y las perspectivas de crecimiento", "Del tamaño y la liquidez", "Del timing y la prima de control", "Del número de empleados"], "r": 3, "e": "Depende del sector, tamaño, perspectivas, timing, prima de control y calidad. El número de empleados no se mencionó.", "c": "Clase 13 00:37:47", "p": 0}, {"s": 7, "t": "En el esquema de análisis de una empresa, ¿qué significa ESG?", "o": ["Earnings, Sales, Growth", "Environmental, Social and Governance", "Equity, Spread, Gordon", "European Stock Guide"], "r": 1, "e": "'Ambiental, social y gobierno corporativo: medio ambiente, minorías, información al accionista.'", "c": "Clase 13 00:17:42", "p": 0}, {"s": 7, "t": "Según el profesor, las empresas familiares suelen ser:", "o": ["Menos transparentes", "Más amigables con el accionista", "Más endeudadas", "Más caras"], "r": 1, "e": "'Normalmente las empresas familiares suelen ser más amigables con los accionistas; no siempre se cumple.'", "c": "Clase 13 00:16:12", "p": 0}, {"s": 8, "t": "Todo activo financiero es una combinación de:", "o": ["Precio, cupón y rating", "Liquidez, rentabilidad y riesgo", "Beta, alfa y sigma", "Activo, pasivo y equity"], "r": 1, "e": "'Liquidez, rentabilidad y riesgo están íntimamente relacionadas' (el triángulo de la inversión).", "c": "Clase 13 00:54:40", "p": 1}, {"s": 8, "t": "Un depósito bancario en una entidad solvente es:", "o": ["Muy rentable y muy líquido", "Muy líquido, poco arriesgado y por tanto poco rentable", "Muy arriesgado", "Ilíquido"], "r": 1, "e": "'Si quiero una cosa muy líquida y poco arriesgada, deberá ser poco rentable.'", "c": "Clase 13 00:54:40", "p": 1}, {"s": 8, "t": "La volatilidad es:", "o": ["La varianza", "La raíz cuadrada de la varianza (= desviación típica = desviación estándar)", "El cuadrado de la varianza", "La covarianza"], "r": 1, "e": "'Desviación típica, desviación estándar y volatilidad: la misma medida con diferentes nombres. Es la raíz cuadrada de la varianza.'", "c": "Clase 13 01:05:26", "p": 1}, {"s": 8, "t": "En teoría de carteras, el riesgo se mide por:", "o": ["El beneficio", "La dispersión (varianza, volatilidad)", "El PER", "La deuda"], "r": 1, "e": "'A más dispersión asumimos que hay más riesgo.'", "c": "Clase 13 01:02:24", "p": 1}, {"s": 8, "t": "La volatilidad de una cartera:", "o": ["Es la suma de las volatilidades de sus activos", "Depende también de cómo se comporten los activos entre sí (covarianza/correlación)", "Es siempre cero", "Es la media de las volatilidades"], "r": 1, "e": "'No depende solo de lo volátiles que sean los activos, sino de cómo se comporten unos versus otros': rojo y verde desacompasados → cartera plana.", "c": "Clase 13 01:08:30", "p": 1}, {"s": 8, "t": "La correlación se calcula como:", "o": ["Covarianza × σx × σy", "Covarianza / (σx × σy)", "Varianza / n", "σx − σy"], "r": 1, "e": "'La correlación es la covarianza dividido entre la multiplicación de las volatilidades.' Va de −1 a +1.", "c": "Clase 13 01:18:16", "p": 1}, {"s": 8, "t": "Para diversificar, ¿qué correlación entre dos activos es mejor?", "o": ["+1", "0", "−1", "0,5"], "r": 2, "e": "'Cuanto más baja mejor: mejor −1 que 0 y mejor 0 que +1.' Con −1, la cartera es 'una línea recta'.", "c": "Clase 13 01:18:16; 02:08:37", "p": 1}, {"s": 8, "t": "La covarianza entre edad y salario suele ser:", "o": ["Negativa", "Positiva: a más edad, más salario", "Cero", "Infinita"], "r": 1, "e": "Ejemplo del profesor: edad y salario, positiva; edad y horas de PlayStation, negativa.", "c": "Clase 13 01:13:05", "p": 0}, {"s": 8, "t": "La covarianza y la correlación se diferencian en que:", "o": ["La correlación es en unidades y la covarianza en porcentaje", "La covarianza es 'en unidades' y la correlación va de −1 a +1 (sentido y fuerza)", "Son lo mismo", "La covarianza siempre es positiva"], "r": 1, "e": "'La covarianza sería como en unidades; la correlación, como en porcentaje, de −1 a +1, indica el sentido y la fuerza.'", "c": "Clase 13 01:11:34; 01:18:16", "p": 0}, {"s": 8, "t": "La frontera eficiente es:", "o": ["La cartera con menos riesgo", "El conjunto de carteras que maximizan la rentabilidad para cada nivel de riesgo", "La línea del risk free", "El PER del S&P"], "r": 1, "e": "'Al conjunto de portafolios que maximiza la rentabilidad versus el riesgo. Solo los puntitos de la frontera son carteras eficientes.'", "c": "Clase 13 02:01:03", "p": 1}, {"s": 8, "t": "Dentro de la frontera eficiente, ¿qué cartera debe elegir un inversor?", "o": ["Siempre la de mayor rentabilidad", "Depende de su perfil de riesgo (edad, conocimientos, objetivos)", "La de menor volatilidad", "La cartera de mercado"], "r": 1, "e": "'Todas son eficientes; qué portafolio elegir va a depender del perfil de riesgo del inversionista.'", "c": "Clase 13 02:04:06", "p": 1}, {"s": 8, "t": "En Europa, antes de vender un producto financiero es obligatorio:", "o": ["Cobrar una comisión", "Perfilar al cliente (conocer su riesgo y necesidades de liquidez)", "Ofrecer solo bonos", "Firmar ante notario"], "r": 1, "e": "'En Europa es obligatorio hacer una perfilación del cliente. No puedes vender un producto sin conocer primero al cliente.'", "c": "Clase 13 02:08:37", "p": 0}, {"s": 8, "t": "¿Qué significa que el cliente 'va con espejo retrovisor'?", "o": ["Que invierte a largo plazo", "Que declara su perfil de riesgo según lo que ha hecho el mercado recientemente", "Que no lee los contratos", "Que prefiere bonos"], "r": 1, "e": "'Cuando las bolsas han subido es muy agresivo; cuando ha habido un batacazo, muy conservador.'", "c": "Clase 13 02:10:07", "p": 0}, {"s": 8, "t": "¿Cuál es un condicionante ECONÓMICO del perfil de riesgo?", "o": ["Tolerancia a las pérdidas a corto plazo", "Expectativas de rentabilidad", "Situación ahorradora, horizonte temporal y estabilidad laboral", "Nerviosismo ante caídas del 0,7%"], "r": 2, "e": "Psicológicos: tolerancia a pérdidas y expectativas. Económicos: horizonte, cuantía vs. patrimonio, situación ahorradora, estabilidad económica.", "c": "Clase 13 02:13:25", "p": 0}, {"s": 8, "t": "Históricamente en EE. UU., el orden de rentabilidad de mayor a menor es:", "o": ["Bonos corto > bonos largo > acciones", "Acciones > bonos a largo plazo > bonos a corto plazo > inflación", "Inflación > acciones > bonos", "Bonos largo > acciones > bonos corto"], "r": 1, "e": "'Lo más rentable son las acciones, luego los bonos a largo plazo, a corto plazo y la inflación', en nominal y en real.", "c": "Clase 13 02:21:04", "p": 0}, {"s": 8, "t": "Rentabilidad real es:", "o": ["Nominal + inflación", "Nominal − inflación", "Nominal × inflación", "La TIR"], "r": 1, "e": "'Si la renta variable ha hecho un 10% y la inflación es 2, en términos reales es un 8.'", "c": "Clase 13 02:21:04", "p": 0}, {"s": 8, "t": "Una cartera para un cliente más arriesgado tendrá:", "o": ["Más liquidez", "Más peso en renta variable", "Más bonos del Estado", "Menos volatilidad"], "r": 1, "e": "'A más riesgo, más peso en renta variable; la liquidez siempre ~10%. Más agresiva: más rendimiento y más volatilidad.'", "c": "Clase 13 02:24:17", "p": 1}, {"s": 9, "t": "La cartera óptima de un inversor cumple:", "o": ["Tiene la máxima rentabilidad posible", "Está sobre la frontera eficiente y es tangente a su curva de indiferencia", "Tiene beta cero", "Es la cartera de mercado siempre"], "r": 1, "e": "'La cartera óptima cumple dos cosas: está sobre la frontera eficiente y es tangente a la curva de indiferencia.' (Última sesión, audio parcial.)", "c": "Última sesión 01:00:44; 01:32:51", "p": 1}, {"s": 9, "t": "Según el CAPM, si la beta de un activo es cero, su rentabilidad esperada es:", "o": ["Cero", "El risk free", "La del mercado", "Infinita"], "r": 1, "e": "'Rentabilidad esperada = Rf + β × (Rm − Rf); si la beta es cero, solo tienes el risk free.' (Última sesión, audio parcial.)", "c": "Última sesión 01:03:47", "p": 1}, {"s": 9, "t": "Al añadir más títulos a una cartera (Google, Coca-Cola, Amazon…):", "o": ["Baja el riesgo sistemático", "Baja el riesgo específico; el sistemático permanece", "Baja la beta a cero", "Sube la volatilidad"], "r": 1, "e": "'El riesgo sistemático siempre es el mismo; el no sistemático va bajando a medida que inviertes en más empresas.'", "c": "Clase 4 00:26:59; Última sesión 00:54:29", "p": 1}, {"s": 9, "t": "Con 100 acciones disponibles, ¿cuántas carteras se pueden formar según el profesor?", "o": ["100", "Miles, casi infinitas", "Una", "Diez"], "r": 1, "e": "'Miles de portafolios… casi infinitas carteras; solo las de la frontera eficiente maximizan rentabilidad-riesgo.'", "c": "Clase 13 01:59:32; Última sesión 00:57:37", "p": 0}, {"s": 4, "t": "Según Modigliani-Miller, si NO hay impuestos, al aumentar la deuda el WACC…", "o": ["Baja", "Sube", "Se mantiene constante: da igual tener poca o mucha deuda", "Se hace cero"], "r": 2, "e": "'Si no hay impuestos da igual tener poca deuda que mucha: el WACC se mantiene constante. Si hay impuestos, a más deuda más te baja el WACC.'", "c": "Última sesión 01:19:24", "p": 1}, {"s": 4, "t": "Según Modigliani-Miller con impuestos, ¿por qué más deuda baja el WACC?", "o": ["Porque los bancos cobran menos", "Porque los intereses reducen el beneficio y por tanto los impuestos (escudo fiscal)", "Porque sube la beta", "Porque baja el coste del equity"], "r": 1, "e": "'Los impuestos te bajan el coste de la deuda: si pagas intereses ganas menos y pagas menos impuestos.'", "c": "Última sesión 01:20:00", "p": 1}, {"s": 4, "t": "En el enfoque tradicional de la estructura de capital, el valor de la empresa se maximiza en:", "o": ["El punto de máxima deuda", "El punto de WACC mínimo", "El punto de equity 100%", "El punto donde ROE = 0"], "r": 1, "e": "'El coste del equity y el de la deuda suben poco al principio y luego se disparan; el WACC baja y luego sube. El punto de mínimo WACC es el que teóricamente maximiza el valor de la empresa.'", "c": "Última sesión 01:20:33", "p": 1}, {"s": 5, "t": "Pista literal del profesor: si la tasa de descuento sube, el VAN de un proyecto es…", "o": ["Mayor", "Menor", "Igual", "Cero"], "r": 1, "e": "'Si la tasa de descuento sube, ¿el VAN es mayor o menor? Menor.' Se descuentan los flujos a un divisor más grande.", "c": "Última sesión 01:35:58", "p": 1}, {"s": 5, "t": "La TIR se expresa en:", "o": ["Euros", "Años", "Porcentaje", "Puntos básicos sobre el WACC"], "r": 2, "e": "Pista literal: 'La TIR se expresa en porcentaje.' El VAN en dinero y el payback en años.", "c": "Última sesión 01:36:12", "p": 1}, {"s": 6, "t": "La curva de tipos de interés está relacionada con…", "o": ["La renta variable", "La renta fija", "Las materias primas", "Ninguna de ellas"], "r": 1, "e": "Ejemplo literal de pregunta que puso el profesor: 'está relacionada con la renta fija'. Es un gráfico de tipo de interés frente a plazo.", "c": "Última sesión 01:28:20", "p": 1}, {"s": 6, "t": "Una curva de tipos invertida significa que:", "o": ["Los bonos a largo plazo pagan más que los de corto", "Los bonos a corto plazo pagan más que los de largo", "Todos los bonos pagan lo mismo", "El rating es high yield"], "r": 1, "e": "'Si es inversa significa que los bonos a corto plazo pagan más que los bonos a largo plazo.' Lo normal es que sea creciente.", "c": "Última sesión 01:27:39", "p": 1}, {"s": 3, "t": "Según el profesor, un KPI es:", "o": ["Un impuesto sobre beneficios", "Una métrica a la que la empresa presta mucha atención para ver si lo está haciendo bien o mal", "Un tipo de bono", "El coste de financiación"], "r": 1, "e": "Ejemplo literal de pregunta: 'un KPI es una métrica que se utiliza para ver si una empresa lo está haciendo bien o mal' (p. ej. el ROE o la evolución de las ventas).", "c": "Última sesión 01:16:22; 01:17:05", "p": 1}, {"s": 2, "t": "¿Por qué es importante que el fondo de maniobra sea grande, según el profesor?", "o": ["Porque aumenta el ROE", "Porque si no es grande la empresa puede tener un problema de liquidez a corto plazo", "Porque reduce el WACC", "Porque sube la beta"], "r": 1, "e": "'Es importante que el fondo de maniobra sea grande; si no, la empresa puede tener un problema.'", "c": "Última sesión 01:10:08", "p": 1}, {"s": 9, "t": "La curva de indiferencia de un inversor muy averso al riesgo es:", "o": ["Plana", "Muy empinada: por un poco más de volatilidad exige mucha más rentabilidad", "Decreciente", "Igual a la frontera eficiente"], "r": 1, "e": "'Es muy empinada porque para asumir un poco más de volatilidad el cliente va a necesitar mucha más rentabilidad.' En la práctica nadie la calcula: se usan cuestionarios.", "c": "Última sesión 01:00:37", "p": 1}, {"s": 9, "t": "En la Capital Market Line, ¿qué cartera está más allá de la cartera de mercado?", "o": ["Una cartera 100% risk free", "Una cartera apalancada: pides prestado e inviertes más que tu patrimonio en mercado", "Una cartera 50% risk free / 50% mercado", "No existe"], "r": 1, "e": "'Tienes un millón, pides prestado otro millón y lo inviertes todo en mercado: una cartera apalancada', más rentable y más volátil que el mercado.", "c": "Última sesión 01:03:10", "p": 1}, {"s": 9, "t": "En la SML, un activo que queda por encima de la recta del CAPM:", "o": ["Ha rendido más de lo que predice el modelo (estaba infravalorado)", "Ha rendido menos", "Tiene beta cero", "Es el activo libre de riesgo"], "r": 0, "e": "'Algunas acciones han tenido más rentabilidad de lo que el modelo predice porque estaban más baratas, infravaloradas; otras menos, porque estaban sobrevaloradas.'", "c": "Última sesión 01:06:41", "p": 1}, {"s": 9, "t": "CML y SML se diferencian en que:", "o": ["Una mide volatilidad en el eje horizontal y la otra beta", "Una es para bonos y otra para acciones", "Una es decreciente", "No se diferencian"], "r": 0, "e": "'Dos líneas: una mide rentabilidad frente a volatilidad y otra rentabilidad frente a beta; en ambas a más riesgo más rentabilidad.'", "c": "Última sesión 01:34:06", "p": 1}, {"s": 9, "t": "¿Qué se entiende por represión financiera, según el profesor?", "o": ["Prohibir invertir en bolsa", "Con tipos cero o negativos, los inversores conservadores se ven obligados a asumir más riesgo para obtener rentabilidad", "Subir impuestos a los dividendos", "Limitar el apalancamiento de los bancos"], "r": 1, "e": "'Tipos de interés cero o negativos en la eurozona hicieron que los inversores conservadores tuvieran que invertir en activos más arriesgados.'", "c": "Última sesión 00:42:11", "p": 0}, {"s": 9, "t": "¿Quién es el 'padre de la gestión de carteras' según el profesor?", "o": ["Black y Scholes", "Markowitz", "Gordon y Shapiro", "Modigliani y Miller"], "r": 1, "e": "'Markowitz es el padre de la gestión de carteras: el que empezó con la teoría, pero no es el único.'", "c": "Última sesión 00:41:50", "p": 0}, {"s": 2, "t": "Dos empresas idénticas: A financiada 100% con equity gana 10; B con 50 equity y 50 deuda gana 9. ¿Qué ROE tiene cada una?", "o": ["A 10%, B 9%", "A 10%, B 18%", "A 9%, B 10%", "Ambas 10%"], "r": 1, "e": "ROE = beneficio / recursos propios: A = 10/100 = 10%; B = 9/50 = 18%.", "c": "Clase 2 00:18:08", "p": 0, "calc": 1}, {"s": 4, "t": "Si una empresa paga un 9% por su deuda y la tasa impositiva es 30%, el coste de la deuda es:", "o": ["9%", "6,3%", "11,7%", "2,7%"], "r": 1, "e": "9% × (1 − 0,30) = 6,3%. En el repaso usó 10% × (1 − 0,25) = 7,5%.", "c": "Clase 4 00:20:53; Última sesión 01:17:32", "p": 0, "calc": 1}, {"s": 4, "t": "Ke = 10%, Kd = 5%, t = 25%, deuda 100, equity 200. El WACC es:", "o": ["7,5%", "7,9%", "8,3%", "6,7%"], "r": 1, "e": "10% × 200/300 + 5% × 0,75 × 100/300 = 6,67% + 1,25% = 7,9%. Ejemplo literal de clase.", "c": "Clase 4 00:48:29", "p": 0, "calc": 1}, {"s": 5, "t": "El valor final de 1.000 invertidos 10 años al 5% es:", "o": ["1.500", "1.628", "1.050", "614"], "r": 1, "e": "1.000 × 1,05^10 = 1.628.", "c": "Clase 5 00:34:53", "p": 0, "calc": 1}, {"s": 5, "t": "Inversión de 1.000.000 con flujos constantes de 250.000 al año. Payback:", "o": ["2,5 años", "4 años", "3 años", "5 años"], "r": 1, "e": "1.000.000 / 250.000 = 4 años.", "c": "Clase 5 00:37:56", "p": 0, "calc": 1}, {"s": 5, "t": "Flujos no constantes: acumulado del año 2 = −400.000; flujo del año 3 = 450.000. Payback:", "o": ["2,5 años", "2,89 años", "3 años", "3,2 años"], "r": 1, "e": "2 + 400/450 = 2,89 años.", "c": "Clase 5 00:50:15", "p": 0, "calc": 1}, {"s": 5, "t": "Un piso cuesta 350.000, genera 12.000 de ingresos y 3.000 de gastos al año. La yield neta es:", "o": ["3,4%", "2,6%", "4,3%", "1,2%"], "r": 1, "e": "(12.000 − 3.000) / 350.000 = 2,57%. Bruta = 3,4%.", "c": "Clase 5 00:41:02", "p": 0, "calc": 1}, {"s": 5, "t": "Escenarios con probabilidades 30/50/20% y rentabilidades 3/8/10%: rentabilidad esperada:", "o": ["7%", "6,9%", "8%", "21%"], "r": 1, "e": "0,3×3 + 0,5×8 + 0,2×10 = 6,9%.", "c": "Clase 5 01:11:52", "p": 0, "calc": 1}, {"s": 6, "t": "Compras una call con strike 100 pagando 3 de prima. ¿A qué precio del subyacente empatas?", "o": ["100", "103", "97", "Nunca"], "r": 1, "e": "Break-even = strike + prima = 103.", "c": "Clase 6 00:12:36", "p": 0, "calc": 1}, {"s": 6, "t": "Acción a 100, call con strike 120 y prima 42. ¿Cuánto es valor intrínseco y cuánto temporal?", "o": ["Intrínseco 20, temporal 22", "Intrínseco 0, temporal 42", "Intrínseco 42, temporal 0", "Intrínseco −20, temporal 62"], "r": 1, "e": "Comprar por 120 algo que vale 100 no tiene valor intrínseco (0): toda la prima es valor temporal.", "c": "Clase 6 00:23:21", "p": 0, "calc": 1}, {"s": 8, "t": "Compras una acción a 14, cobras 2 de dividendo y la vendes a 15. Rentabilidad:", "o": ["7,1%", "21,4%", "14,3%", "13,3%"], "r": 1, "e": "(15 − 14 + 2) / 14 = 21,4%.", "c": "Clase 13 00:57:46", "p": 0, "calc": 1}, {"s": 8, "t": "Un activo: 30% de probabilidad de rentar 5%, 20% de rentar 2% y 50% de rentar −1%. Rentabilidad esperada:", "o": ["2%", "1,4%", "6%", "1,9%"], "r": 1, "e": "1,5 + 0,4 − 0,5 = 1,4%.", "c": "Clase 13 00:57:46", "p": 0, "calc": 1}, {"s": 8, "t": "Cartera con 25% en A (3%), 25% en B (7%) y 50% en C (1%). Rentabilidad de la cartera:", "o": ["3,67%", "3%", "3,5%", "11%"], "r": 1, "e": "0,75 + 1,75 + 0,5 = 3%.", "c": "Clase 13 01:00:51", "p": 0, "calc": 1}, {"s": 8, "t": "Dos activos con volatilidad 10% y 20%, pesos 50/50 y correlación 0. ¿Cómo queda la varianza de la cartera?", "o": ["0,5²×10² + 0,5²×20²", "10 + 20", "(10 + 20)/2", "0"], "r": 0, "e": "Con correlación 0 el término cruzado desaparece: w1²σ1² + w2²σ2² = 25 + 100 = 125 → volatilidad ≈ 11,2%.", "c": "Clase 13 01:58:01", "p": 0, "calc": 1}, {"s": 2, "t": "Un banco presta 100 financiado con 20 de equity y 80 de depósitos; cobra 5% y paga 3%. ¿ROE aproximado?", "o": ["2%", "13%", "5%", "26%"], "r": 1, "e": "Gana 5 − 2,4 = 2,6 sobre 20 de equity ≈ 13%: el apalancamiento multiplica el ROE.", "c": "Clase 1 00:34:45", "p": 0, "calc": 1}];
var SES={2:'S2 Estructura económica y financiera',3:'S3 Ratios, KPIs y Dupont',4:'S4 Financiación, CAPM y WACC',5:'S5 VAN, TIR, payback, escenarios',6:'S6 Opciones y bonos',7:'S7 Valoración de empresas',8:'S8 Teoría de carteras',9:'S9 Markowitz, CML y SML'};
var app=document.getElementById('app');var st={};
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function home(){
 var h='<h1>Módulo 3 · Gestión Financiera y Evaluación de Inversiones</h1><div class="sub">'+BANCO.length+' preguntas tipo test construidas solo con lo explicado en clase, con cita a la grabación.</div>';
 h+='<button class="mode primary" onclick="start(\'exam\')"><span><span class="mode-t">Simulacro de examen</span><span class="mode-d">20 preguntas, 0,5 puntos cada una, corrección al final; 16 de lo más probable, 3 del resto y 1 cálculo sencillo</span></span><span class="mode-n">20</span></button>';
 h+='<button class="mode primary" onclick="start(\'prio\')"><span><span class="mode-t">Solo lo más probable</span><span class="mode-d">Las preguntas sobre conceptos que el profesor nombró en el repaso del examen, con corrección inmediata</span></span><span class="mode-n">'+BANCO.filter(function(q){return q.p}).length+'</span></button>';
 h+='<button class="mode" onclick="start(\'calc\')"><span><span class="mode-t">Cálculos sencillos (por si acaso)</span><span class="mode-d">Los ejemplos numéricos que puso en clase; se permite calculadora no programable, aunque no anunció cálculos</span></span><span class="mode-n">'+BANCO.filter(function(q){return q.calc}).length+'</span></button>';
 h+='<button class="mode" onclick="start(\'all\')"><span><span class="mode-t">Repasar todo el banco</span><span class="mode-d">Todas las preguntas seguidas, con corrección inmediata</span></span><span class="mode-n">'+BANCO.length+'</span></button>';
 h+='<button class="mode" onclick="start(\'fail\')"><span><span class="mode-t">Repetir las que fallé</span><span class="mode-d">Las preguntas falladas en esta sesión de estudio</span></span><span class="mode-n">'+(st.failed?st.failed.length:0)+'</span></button>';
 h+='<div class="card"><div style="font-weight:600">Practicar por sesión</div><div class="ses">';
 Object.keys(SES).forEach(function(k){var n=BANCO.filter(function(q){return q.s==k}).length;h+='<button onclick="start(\'ses\','+k+')">'+esc(SES[k])+' · '+n+'</button>'});
 h+='</div></div>';
 h+='<div class="warn">Formato confirmado por el profesor en la sesión de repaso (15 jul, 01:07:55): 20 preguntas tipo test, 0,5 puntos cada una, una sola respuesta correcta, las incorrectas NO restan, sin apuntes ni internet, solo calculadora no programable. 60% de la nota. Sus ejemplos de pregunta fueron todos conceptuales.</div>';
 app.innerHTML=h;
}
function start(mode,k){
 var pool;
 if(mode==='exam'){var bys={};BANCO.filter(function(q){return q.p}).forEach(function(q){(bys[q.s]=bys[q.s]||[]).push(q)});pool=[];var per={2:2,3:2,4:3,5:3,6:2,7:1,8:2,9:1};Object.keys(bys).forEach(function(s){pool=pool.concat(shuffle(bys[s]).slice(0,per[s]||0))});pool=pool.concat(shuffle(BANCO.filter(function(q){return !q.p&&!q.calc})).slice(0,3)).concat(shuffle(BANCO.filter(function(q){return q.calc})).slice(0,1));pool=shuffle(pool).slice(0,20);}
 else if(mode==='prio')pool=shuffle(BANCO.filter(function(q){return q.p}));
 else if(mode==='calc')pool=shuffle(BANCO.filter(function(q){return q.calc}));
 else if(mode==='all')pool=shuffle(BANCO);
 else if(mode==='ses')pool=shuffle(BANCO.filter(function(q){return q.s==k}));
 else if(mode==='fail'){pool=shuffle(st.failed||[]);if(!pool.length){home();return}}
 st.mode=mode;st.pool=pool;st.i=0;st.ans=[];st.sel=null;st.shown=false;st.failed=st.failed||[];
 question();
}
function question(){
 var q=st.pool[st.i];var inst=st.mode!=='exam';
 var h='<div class="top"><span>'+(st.i+1)+' / '+st.pool.length+'</span><span class="ses-tag">'+esc(SES[q.s])+'</span><button class="btn ghost" style="flex:0;padding:4px 10px" onclick="home()">Salir</button></div>';
 h+='<div class="bar"><i style="width:'+((st.i)/st.pool.length*100)+'%"></i></div>';
 h+='<div class="card"><div class="q">'+esc(q.t)+'</div>';
 var order=st.order||shuffle(q.o.map(function(_,i){return i}));st.order=order;
 order.forEach(function(oi){var cls='opt';if(st.shown){if(oi===q.r)cls+=' ok';else if(oi===st.sel)cls+=' ko'}else if(oi===st.sel)cls+=' sel';
  h+='<button class="'+cls+'" '+(st.shown?'disabled':'')+' onclick="pick('+oi+')">'+esc(q.o[oi])+'</button>'});
 if(st.shown){h+='<div class="exp"><b class="'+(st.sel===q.r?'ok-t':'ko-t')+'">'+(st.sel===q.r?'Correcto.':'Incorrecto.')+'</b> '+esc(q.e)+'<span class="c">'+esc(q.c)+'</span></div>'}
 h+='<div class="row">';
 if(inst&&!st.shown)h+='<button class="btn" '+(st.sel===null?'disabled':'')+' onclick="check()">Comprobar</button>';
 else h+='<button class="btn" '+(st.sel===null?'disabled':'')+' onclick="next()">'+(st.i+1<st.pool.length?'Siguiente':'Terminar')+'</button>';
 h+='</div></div>';
 app.innerHTML=h;window.scrollTo(0,0);
}
function pick(i){if(st.shown)return;st.sel=i;question()}
function check(){st.shown=true;var q=st.pool[st.i];st.ans.push(st.sel);if(st.sel!==q.r&&st.failed.indexOf(q)<0)st.failed.push(q);if(st.sel===q.r)st.failed=st.failed.filter(function(x){return x!==q});question()}
function next(){if(st.mode==='exam'){var q=st.pool[st.i];st.ans.push(st.sel);if(st.sel!==q.r&&st.failed.indexOf(q)<0)st.failed.push(q)}
 st.i++;st.sel=null;st.shown=false;st.order=null;if(st.i<st.pool.length)question();else result()}
function result(){
 var ok=0;st.pool.forEach(function(q,i){if(st.ans[i]===q.r)ok++});
 var h='<div class="card">';
 if(st.mode==='exam'){var nota=ok*0.5;h+='<div class="nota '+(nota>=5?'ok-t':'ko-t')+'">'+nota.toLocaleString('es-ES')+' <small>/ 10 · '+ok+' de 20 correctas</small></div><div style="text-align:center;color:var(--mut);font-size:.9rem">Como el examen real: 0,5 puntos por pregunta, las incorrectas no restan</div>'}
 else h+='<div class="nota">'+ok+' <small>/ '+st.pool.length+' correctas</small></div>';
 h+='<div class="row"><button class="btn" onclick="start(\''+st.mode+'\','+(st.k||0)+')">Otra vez</button><button class="btn ghost" onclick="home()">Inicio</button></div></div>';
 if(st.mode==='exam'){h+='<div class="card"><div style="font-weight:600;margin-bottom:8px">Revisión</div>';
  st.pool.forEach(function(q,i){var good=st.ans[i]===q.r;h+='<div class="rev"><b class="'+(good?'ok-t':'ko-t')+'">'+(i+1)+'. '+esc(q.t)+'</b>'+(good?'':'Tu respuesta: '+esc(q.o[st.ans[i]]||'—')+'<br>')+'Correcta: '+esc(q.o[q.r])+'<br><span style="color:var(--mut)">'+esc(q.e)+' ['+esc(q.c)+']</span></div><hr style="border:0;border-top:1px solid var(--line)">'});
  h+='</div>'}
 app.innerHTML=h;window.scrollTo(0,0);
}
home();
</script></body></html>
