<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fiscalidad Financiera Corporativa — test V/F</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7F6F2; --card:#FFFFFF; --ink:#1A1A1A; --ink-2:#555; --line:#D9D6CE;
  --v:#1F4E79; --v-soft:#E3ECF5; --f:#8B2E2E; --f-soft:#F4E3E3; --ok:#2E6B3A; --ok-soft:#E1F0E4; --bad:#8B2E2E; --bad-soft:#F4E3E3;
  --amber:#8A6D1D; --amber-soft:#F5EBCF;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark;
  --paper:#17181A; --card:#222326; --ink:#ECEAE4; --ink-2:#A9A6A0; --line:#3A3B3F;
  --v:#8FB5DE; --v-soft:#1E2E40; --f:#E09090; --f-soft:#3E2323; --ok:#8CCB97; --ok-soft:#1F3524; --bad:#E09090; --bad-soft:#3E2323; --amber:#E2C06A; --amber-soft:#3B3220; } }
:root[data-theme="dark"]{ color-scheme:dark; --paper:#17181A; --card:#222326; --ink:#ECEAE4; --ink-2:#A9A6A0; --line:#3A3B3F; --v:#8FB5DE; --v-soft:#1E2E40; --f:#E09090; --f-soft:#3E2323; --ok:#8CCB97; --ok-soft:#1F3524; --bad:#E09090; --bad-soft:#3E2323; --amber:#E2C06A; --amber-soft:#3B3220; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:17px;line-height:1.45}
.wrap{max-width:640px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:22px;font-weight:600;margin:6px 0 2px;letter-spacing:-.01em}
.sub{color:var(--ink-2);font-size:14.5px;margin:0 0 18px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:12px 14px;text-align:left;width:100%}
button:focus-visible{outline:3px solid var(--v);outline-offset:2px}
.modes{display:grid;gap:10px}
.mode{display:flex;align-items:center;gap:12px}
.mode .n{font-size:26px;font-weight:600;min-width:52px;text-align:right;color:var(--v)}
.mode-t{display:block;font-weight:600;font-size:16px}
.mode-d{display:block;font-size:13.5px;color:var(--ink-2);margin-top:2px}
.blocks{display:grid;gap:8px;margin-top:8px}
.blk{display:flex;align-items:center;gap:10px;padding:10px 12px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.dot.r{background:#B4413F}.dot.a{background:#D8A631}.dot.g{background:#4C9A5C}
.blk .t{flex:1}.blk .pct{color:var(--ink-2);font-size:13.5px}
.stats{display:flex;gap:16px;margin:14px 0 6px;font-size:14px;color:var(--ink-2)}
.stats b{color:var(--ink);font-weight:600}
.link{background:none;border:none;color:var(--v);padding:4px 0;width:auto;text-decoration:underline;font-size:14px}
/* quiz */
.top{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--ink-2);margin-bottom:8px}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--v);width:0;transition:width .25s}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 20px}
.qnum{font-size:13px;color:var(--ink-2);margin-bottom:8px}
.qtext{font-size:20px;line-height:1.4;font-weight:500;margin:0 0 20px}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ans button{text-align:center;font-size:18px;font-weight:600;padding:18px 10px;border-width:2px}
.ans .bv{border-color:var(--v);color:var(--v);background:var(--v-soft)}
.ans .bf{border-color:var(--f);color:var(--f);background:var(--f-soft)}
.ans button:disabled{opacity:.55;cursor:default}
.ans button.chosen{opacity:1;box-shadow:inset 0 0 0 2px currentColor}
.skip{margin-top:10px;background:none;border:1px dashed var(--line);color:var(--ink-2);text-align:center;font-size:14px;padding:9px}
.fb{margin-top:16px;padding:14px 16px;border-radius:10px;font-size:15.5px;line-height:1.45}
.fb.ok{background:var(--ok-soft);color:var(--ink)}.fb.bad{background:var(--bad-soft);color:var(--ink)}.fb.skip{background:var(--amber-soft)}
.fb .v{font-weight:600}
.fb .ref{display:block;margin-top:10px;font-size:13px;color:var(--ink-2)}
.next{margin-top:14px;text-align:center;font-weight:600;background:var(--ink);color:var(--paper);border-color:var(--ink)}
/* result */
.score{font-size:54px;font-weight:600;letter-spacing:-.02em;line-height:1;margin:6px 0 2px}
.score small{font-size:18px;font-weight:400;color:var(--ink-2)}
.res-line{color:var(--ink-2);margin:0 0 14px}
.tbl{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0 16px}
.tbl td{padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl td:last-child{text-align:right;color:var(--ink-2)}
.rev{margin-top:18px;display:grid;gap:10px}
.rev .it{text-align:left;padding:12px 14px;border-radius:10px;font-size:14.5px;background:var(--card);border:1px solid var(--line)}
.rev .it.bad{border-left:4px solid var(--bad)}.rev .it.skip{border-left:4px solid var(--amber)}
.rev .it .q{font-weight:500}.rev .it .e{color:var(--ink-2);margin-top:4px}
.row{display:grid;gap:10px;margin-top:14px}
.ghost{text-align:center}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const BANK={"blocks": ["Tributos y elementos del tributo", "Mapa de impuestos", "IRPF", "Actividades económicas (EDN/EDS/EOM)", "Impuesto sobre Sociedades", "IVA", "Fiscalidad internacional"], "q": [{"id": "K1", "q": "Las Administraciones Públicas producen bienes y prestan servicios no destinados a la venta", "a": true, "e": "Es la definición de producción no de mercado del sector público.", "b": 0, "src": "Kahoot del profesor, repaso 10/09 min 31:30", "prof": true}, {"id": "K2", "q": "Las Administraciones Públicas no llevan a cabo operaciones de redistribución de la renta y de la riqueza", "a": false, "e": "Redistribuir renta y riqueza es una de las funciones básicas del sector público.", "b": 0, "src": "Kahoot del profesor, repaso 10/09 min 31:51", "prof": true}, {"id": "K3", "q": "La principal fuente de ingresos de las Administraciones Públicas son los tributos", "a": true, "e": "Los tributos (y dentro de ellos los impuestos) son la principal fuente de financiación.", "b": 0, "src": "Kahoot del profesor, repaso 10/09 min 32:09", "prof": true}, {"id": "K4", "q": "Los tributos son los impuestos, las tasas y los precios públicos", "a": false, "e": "Los tres tributos son impuestos, tasas y contribuciones especiales; los precios públicos no son tributos.", "b": 0, "src": "Kahoot del profesor, repaso 10/09 min 32:24", "prof": true}, {"id": "K5", "q": "Los tributos son ingresos públicos que se derivan de la aplicación del Principio de Autoridad", "a": true, "e": "PENDIENTE: el profesor no llegó a mostrar la pantalla de resultados. Lo coherente con la teoría (ingresos coactivos frente a ingresos voluntarios como los precios) es VERDADERO.", "b": 0, "src": "Kahoot del profesor, repaso 10/09 min 32:45", "prof": true}, {"id": "K6", "q": "El sector público puede expropiar la propiedad privada atendiendo al interés general", "a": true, "e": "Potestad expropiatoria por causa de utilidad pública o interés social (art. 33 CE).", "b": 0, "src": "Kahoot del profesor, repaso 10/09 min 33:15", "prof": true}, {"id": "K7", "q": "En las tasas no existe contraprestación", "a": false, "e": "La tasa se paga precisamente por un servicio o por el uso del dominio público.", "b": 0, "src": "Kahoot del profesor, repaso 10/09 min 33:30", "prof": true}, {"id": "K8", "q": "Las tasas financian servicios que son de solicitud obligatoria por parte de los administrados", "a": true, "e": "Requisito de la tasa: servicio de solicitud o recepción obligatoria y no prestado por el sector privado.", "b": 0, "src": "Kahoot del profesor, repaso 10/09 min 33:54", "prof": true}, {"id": "K9", "q": "La cuantía de los impuestos no guarda relación con las prestaciones públicas que pueda recibir el contribuyente", "a": true, "e": "El impuesto se exige sin contraprestación directa, según capacidad de pago.", "b": 0, "src": "Kahoot del profesor, repaso 10/09 min 34:12", "prof": true}, {"id": "K10", "q": "El sujeto activo es la entidad con capacidad y competencia para exigir el cumplimiento de las obligaciones tributarias", "a": true, "e": "Definición de sujeto activo (la Administración acreedora).", "b": 0, "src": "Kahoot del profesor, repaso 10/09 min 36:06", "prof": true}, {"id": "K11", "q": "El sujeto pasivo es la persona física o jurídica que está obligada al cumplimiento de las obligaciones tributarias", "a": true, "e": "Definición de sujeto pasivo (contribuyente o sustituto).", "b": 0, "src": "Kahoot del profesor, repaso 10/09 min 36:33", "prof": true}, {"id": "K12", "q": "El objeto imponible es aquella circunstancia que de acuerdo con la Ley origina el nacimiento de la obligación tributaria", "a": false, "e": "Esa es la definición del HECHO imponible; el objeto imponible es la capacidad económica gravada.", "b": 0, "src": "Kahoot del profesor, repaso 10/09 min 36:51", "prof": true}, {"id": "K13", "q": "Las operaciones sujetas exentas (gravadas a tipo cero) forman parte del hecho imponible", "a": true, "e": "La exención presupone sujeción; lo que no forma parte del hecho imponible es la no sujeción.", "b": 0, "src": "Kahoot del profesor, repaso 10/09 min 37:27", "prof": true}, {"id": "K14", "q": "Los métodos de estimación de la base imponible son tres: directo, objetivo y módulos", "a": false, "e": "Son directa, objetiva e indirecta (art. 50 LGT); 'módulos' es la modalidad habitual de la objetiva.", "b": 0, "src": "Kahoot del profesor, repaso 10/09 min 38:03", "prof": true}, {"id": "K15", "q": "La base liquidable es la cuantificación del hecho imponible", "a": false, "e": "Eso es la base imponible; la liquidable es la imponible menos reducciones.", "b": 0, "src": "Kahoot del profesor, repaso 10/09 min 38:24", "prof": true}, {"id": "K16", "q": "Las tarifas por escalones generan el denominado \"error de salto\" o \"progresividad en frío\"", "a": false, "e": "El error de salto lo generan las tarifas por clases; la tarifa por escalones lo evita. Progresividad en frío es otro concepto (efecto de la inflación).", "b": 0, "src": "Kahoot del profesor, repaso 10/09 min 38:54", "prof": true}, {"id": "K17", "q": "La cuota líquida es la carga efectiva soportada por el contribuyente", "a": true, "e": "Cuota íntegra menos deducciones y bonificaciones.", "b": 0, "src": "Kahoot del profesor, repaso 10/09 min 39:21", "prof": true}, {"id": "K18", "q": "En los impuestos directos es posible trasladar la carga fiscal a un tercero", "a": false, "e": "La traslación es propia de los impuestos indirectos.", "b": 0, "src": "Kahoot del profesor, repaso 10/09 min 39:39", "prof": true}, {"id": "K19", "q": "La cuota diferencial es la cuota líquida menos los pagos a cuenta (retenciones, ingresos a cuenta y pagos fraccionados)", "a": true, "e": "Definición de cuota diferencial.", "b": 0, "src": "Kahoot del profesor, repaso 10/09 min 40:12", "prof": true}, {"id": "K20", "q": "El IRPF es un impuesto directo que grava la renta de las personas físicas (residentes y no residentes) en España", "a": false, "e": "Solo residentes; los no residentes tributan por el IRNR.", "b": 1, "src": "Kahoot del profesor, repaso 10/09 min 42:15", "prof": true}, {"id": "K21", "q": "El IS es un impuesto directo que grava la renta de las personas jurídicas residentes fiscales en España", "a": false, "e": "Respuesta mostrada en pantalla: FALSO. Motivo probable [Inferido]: el IS grava también entidades sin personalidad jurídica (fondos de inversión, UTE, fondos de pensiones), por lo que 'personas jurídicas' es incompleto.", "b": 1, "src": "Kahoot del profesor, repaso 10/09 min 42:45", "prof": true}, {"id": "K22", "q": "El IVA es un impuesto indirecto armonizado a nivel comunitario y por tanto no está cedido a las CCAA", "a": false, "e": "Aunque armonizado, está cedido al 50 % a las CCAA (sin capacidad normativa).", "b": 1, "src": "Kahoot del profesor, repaso 10/09 min 43:00", "prof": true}, {"id": "K23", "q": "El ITP y AJD es un impuesto indirecto que grava las transmisiones patrimoniales onerosas (con contraprestación)", "a": true, "e": "Transmisiones onerosas, operaciones societarias y AJD.", "b": 1, "src": "Kahoot del profesor, repaso 10/09 min 43:30", "prof": true}, {"id": "K24", "q": "El ISD es un impuesto indirecto que grava las transmisiones patrimoniales lucrativas (sin contraprestación)", "a": false, "e": "El ISD es un impuesto DIRECTO (grava la adquisición gratuita como manifestación de capacidad económica).", "b": 1, "src": "Kahoot del profesor, repaso 10/09 min 44:00", "prof": true}, {"id": "K25", "q": "El IRPF es un impuesto estatal cedido parcialmente (50%) a las CCAA", "a": true, "e": "Cesión del 50 % con capacidad normativa sobre la escala autonómica y deducciones.", "b": 1, "src": "Kahoot del profesor, repaso 10/09 min 44:24", "prof": true}, {"id": "K26", "q": "Las CCAA participan del 50% de la recaudación de los impuestos que gravan el tabaco y las bebidas alcohólicas", "a": false, "e": "Los impuestos especiales de fabricación están cedidos al 58 %.", "b": 1, "src": "Kahoot del profesor, repaso 10/09 min 44:45", "prof": true}, {"id": "K27", "q": "Todos los impuestos de las Haciendas Locales son obligatorios para los sujetos pasivos", "a": true, "e": "Para el contribuyente, una vez establecidos, todos son exigibles; lo potestativo es para el ayuntamiento (ICIO, IIVTNU).", "b": 1, "src": "Kahoot del profesor, repaso 10/09 min 45:09", "prof": true}, {"id": "K28", "q": "Todos los impuestos de las Haciendas Locales son directos", "a": false, "e": "El ICIO es un impuesto indirecto.", "b": 1, "src": "Kahoot del profesor, repaso 10/09 min 46:06", "prof": true}, {"id": "K29", "q": "El impuesto sobre construcciones, instalaciones y obras es potestativo para el sujeto activo", "a": true, "e": "ICIO e IIVTNU son potestativos; IBI, IAE e IVTM, obligatorios.", "b": 1, "src": "Kahoot del profesor, repaso 10/09 min 46:36", "prof": true}, {"id": "K30", "q": "El IRPF es un impuesto directo, personal, objetivo y periódico", "a": false, "e": "Es SUBJETIVO: tiene en cuenta las circunstancias personales y familiares.", "b": 2, "src": "Kahoot del profesor, repaso 10/09 min 48:09", "prof": true}, {"id": "K31", "q": "El IRPF es un tributo dual: la base liquidable general tributa entre el 19 y el 47% y la del ahorro entre el 19 y el 30%", "a": true, "e": "Dos bases con escalas distintas (general progresiva y ahorro).", "b": 2, "src": "Kahoot del profesor, repaso 10/09 min 48:45", "prof": true}, {"id": "K32", "q": "En el IRPF el criterio principal para determinar la residencia fiscal en el territorio español es la permanencia", "a": true, "e": "Más de 183 días en el año natural (art. 9 LIRPF).", "b": 2, "src": "Kahoot del profesor, repaso 10/09 min 49:03", "prof": true}, {"id": "K33", "q": "El IRPF se devenga con carácter general el 1 de enero", "a": false, "e": "Se devenga el 31 de diciembre (último día del período impositivo).", "b": 2, "src": "Kahoot del profesor, repaso 10/09 min 49:15", "prof": true}, {"id": "K34", "q": "Forman parte de la BIG: los rendimientos del trabajo y de actividades económicas", "a": true, "e": "Ambos integran la base imponible general.", "b": 2, "src": "Kahoot del profesor, repaso 10/09 min 49:45", "prof": true}, {"id": "K35", "q": "Forman parte de la BIA: las ganancias patrimoniales no derivadas de transmisión", "a": false, "e": "Las no derivadas de transmisión (premios, subvenciones) van a la base GENERAL.", "b": 2, "src": "Kahoot del profesor, repaso 10/09 min 50:03", "prof": true}, {"id": "K36", "q": "Forman parte de la BIA: las ganancias y pérdidas patrimoniales derivadas de transmisión", "a": true, "e": "Las derivadas de transmisión integran la base del ahorro.", "b": 2, "src": "Kahoot del profesor, repaso 10/09 min 50:36", "prof": true}, {"id": "K37", "q": "Forman parte de la BIA: los rendimientos del capital inmobiliario", "a": false, "e": "El capital inmobiliario (alquileres) va a la base general.", "b": 2, "src": "Kahoot del profesor, repaso 10/09 min 50:51", "prof": true}, {"id": "K38", "q": "Forman parte de la BIG: las imputaciones de rentas de carácter inmobiliario", "a": true, "e": "Las imputaciones de renta (inmuebles no arrendados) integran la base general.", "b": 2, "src": "Kahoot del profesor, repaso 10/09 min 51:36", "prof": true}, {"id": "K39", "q": "Son gastos fiscalmente deducibles en el RNTP los gastos de defensa jurídica con el límite de 500 €", "a": false, "e": "El límite de defensa jurídica es 300 €; los 500 € son para Colegios profesionales.", "b": 2, "src": "Kahoot del profesor, repaso 10/09 min 53:06", "prof": true}, {"id": "K40", "q": "Las primas de seguros de enfermedad por debajo de 500 € por persona / año son rentas en especie exentas", "a": true, "e": "Exención hasta 500 €/persona/año (1.500 € con discapacidad).", "b": 2, "src": "Kahoot del profesor, repaso 10/09 min 53:51", "prof": true}, {"id": "K41", "q": "Son gastos fiscalmente deducibles en el RNTP las cuotas obligatorias a Colegios Profesionales con el límite de 300 €", "a": false, "e": "El límite para Colegios profesionales es 500 €.", "b": 2, "src": "Kahoot del profesor, repaso 10/09 min 54:12", "prof": true}, {"id": "K42", "q": "En caso de utilización de una vivienda propiedad del pagador, la valoración de la renta en especie será el 10% del VC", "a": true, "e": "10 % del valor catastral (5 % si está revisado), con tope del 10 % del resto de contraprestaciones.", "b": 2, "src": "Kahoot del profesor, repaso 10/09 min 54:51", "prof": true}, {"id": "K43", "q": "En préstamos con un tipo de interés < al legal del dinero, la valoración será la diferencia entre los tipos", "a": true, "e": "Diferencia entre el interés pagado y el interés legal del dinero.", "b": 2, "src": "Kahoot del profesor, repaso 10/09 min 55:12", "prof": true}, {"id": "K44", "q": "En el caso de entrega de vehículos automóviles, la valoración será el 20% del valor del mercado incluido impuestos", "a": false, "e": "La ENTREGA se valora por el coste de adquisición para el pagador; el 20 % anual es para el USO.", "b": 2, "src": "Kahoot del profesor, repaso 10/09 min 55:33", "prof": true}, {"id": "K45", "q": "Con carácter general, las rentas en especie se valorarán por su valor normal de mercado", "a": true, "e": "Regla general del art. 43 LIRPF.", "b": 2, "src": "Kahoot del profesor, repaso 10/09 min 56:03", "prof": true}, {"id": "K46", "q": "En el cálculo del RNTP los ingresos computan por su importe líquido o neto", "a": false, "e": "Computan por el importe ÍNTEGRO (bruto).", "b": 2, "src": "Kahoot del profesor, repaso 10/09 min 56:15", "prof": true}, {"id": "K47", "q": "Las aportaciones empresariales a planes de pensiones son rentas en especie y llevan ingreso a cuenta", "a": false, "e": "Son renta en especie pero NO llevan ingreso a cuenta.", "b": 3, "src": "Kahoot del profesor, repaso 10/09 min 56:39", "prof": true}, {"id": "K48", "q": "Tributará en EDN todo contribuyente cuyo volumen de facturación en el año anterior supere los 600.000 €", "a": true, "e": "Umbral de 600.000 € de cifra de negocios.", "b": 3, "src": "Kahoot del profesor, repaso 10/09 min 59:18", "prof": true}, {"id": "K49", "q": "En EDN la contabilidad no se lleva según el Código de Comercio y el PGC", "a": false, "e": "En EDN la contabilidad SÍ se lleva conforme al Código de Comercio.", "b": 3, "src": "Kahoot del profesor, repaso 10/09 min 59:42", "prof": true}, {"id": "K50", "q": "En EDS la contabilidad no se lleva obligatoriamente según el Código de Comercio y el PGC", "a": true, "e": "En simplificada bastan los libros registro.", "b": 3, "src": "Kahoot del profesor, repaso 10/09 min 60:06", "prof": true}, {"id": "K51", "q": "Para tributar en EOM la actividad debe estar incluida en la lista de epígrafes del IAE aprobada por Orden del MINHAC", "a": true, "e": "La Orden anual de módulos fija las actividades incluidas.", "b": 3, "src": "Kahoot del profesor, repaso 10/09 min 60:30", "prof": true}, {"id": "K52", "q": "Para tributar en EOM la cifra de negocios no debe ser superior a 150.000 €", "a": true, "e": "Límite legal de 150.000 € (250.000 € en régimen transitorio); en clase se tomó el límite legal.", "b": 3, "src": "Kahoot del profesor, repaso 10/09 min 60:48", "prof": true}, {"id": "K53", "q": "Si tributa en el régimen general del IVA podrá tributar en EOM en el IRPF", "a": false, "e": "La EOM del IRPF va ligada al régimen simplificado del IVA (o recargo de equivalencia / REAGP).", "b": 3, "src": "Kahoot del profesor, repaso 10/09 min 61:09", "prof": true}, {"id": "K54", "q": "Si tributa en el régimen simplificado del IVA tributará en EOM en el IRPF", "a": true, "e": "Ambos regímenes van coordinados.", "b": 3, "src": "Kahoot del profesor, repaso 10/09 min 61:42", "prof": true}, {"id": "K55", "q": "En una Comunidad de Bienes todos sus comuneros no tienen que tributar en el mismo régimen", "a": false, "e": "En las entidades en atribución de rentas el régimen se fija para la entidad y es el mismo para todos.", "b": 3, "src": "Kahoot del profesor, repaso 10/09 min 62:18", "prof": true}, {"id": "K56", "q": "Los activos afectados a la actividad podrán ser objeto de amortización fiscalmente", "a": true, "e": "Los elementos afectos se amortizan como gasto deducible.", "b": 3, "src": "Kahoot del profesor, repaso 10/09 min 62:42", "prof": true}, {"id": "K57", "q": "En EDS las tablas de amortización son las del Impuesto sobre Sociedades", "a": false, "e": "En EDS se usa la tabla simplificada de la Orden de 27/03/1998, no las tablas del IS.", "b": 4, "src": "Kahoot del profesor, repaso 10/09 min 63:03", "prof": true}, {"id": "K58", "q": "El IS es un impuesto directo, personal y periódico", "a": true, "e": "Además de proporcional.", "b": 4, "src": "Kahoot del profesor, repaso 10/09 min 65:09", "prof": true}, {"id": "K59", "q": "El IS grava, entre otras, las operaciones societarias patrimoniales", "a": false, "e": "Las operaciones societarias se gravan en el ITPAJD.", "b": 4, "src": "Kahoot del profesor, repaso 10/09 min 65:27", "prof": true}, {"id": "K60", "q": "Las sociedades se considerarán residentes si están constituidas conforme a las leyes españolas", "a": true, "e": "Uno de los tres criterios del art. 8 LIS.", "b": 4, "src": "Kahoot del profesor, repaso 10/09 min 65:57", "prof": true}, {"id": "K61", "q": "Las entidades que no tienen como objetivo principal de su actividad el ánimo de lucro están totalmente exentas del IS", "a": false, "e": "Están PARCIALMENTE exentas (fundaciones, asociaciones, colegios profesionales…).", "b": 4, "src": "Kahoot del profesor, repaso 10/09 min 66:15", "prof": true}, {"id": "K62", "q": "En el IS el período impositivo coincide siempre con el año natural", "a": false, "e": "Coincide con el ejercicio económico de la entidad (máximo 12 meses).", "b": 4, "src": "Kahoot del profesor, repaso 10/09 min 66:42", "prof": true}, {"id": "K63", "q": "No son fiscalmente deducibles las pérdidas por deterioro de valor de créditos adeudados por entidades de derecho público", "a": true, "e": "Art. 13 LIS: no deducibles salvo procedimiento arbitral o judicial sobre su existencia o cuantía.", "b": 4, "src": "Kahoot del profesor, repaso 10/09 min 67:12", "prof": true}, {"id": "K64", "q": "El Impuesto sobre sociedades es un gasto fiscalmente deducible", "a": false, "e": "El propio IS no es deducible (art. 15 LIS).", "b": 4, "src": "Kahoot del profesor, repaso 10/09 min 68:06", "prof": true}, {"id": "K65", "q": "En el IS el método degresivo porcentaje constante sobre el valor pendiente de amortización es fiscalmente deducible", "a": true, "e": "Es uno de los métodos admitidos (art. 12 LIS), salvo para edificios, mobiliario y enseres.", "b": 4, "src": "Kahoot del profesor, repaso 10/09 min 68:48", "prof": true}, {"id": "K66", "q": "El tipo de gravamen general en el IS es de un 20%", "a": false, "e": "El tipo general es el 25 %.", "b": 4, "src": "Kahoot del profesor, repaso 10/09 min 69:39", "prof": true}, {"id": "K67", "q": "En el IS están exentos los dividendos cuando el porcentaje de participación, directa o indirecta, sea al menos del 5%", "a": true, "e": "Exención del art. 21 LIS (participación ≥ 5 % mantenida un año; exención del 95 %).", "b": 5, "src": "Kahoot del profesor, repaso 10/09 min 70:00", "prof": true}, {"id": "K68", "q": "El IVA grava las entregas de bienes y las prestaciones de servicios", "a": true, "e": "Más las adquisiciones intracomunitarias e importaciones.", "b": 5, "src": "Kahoot del profesor, repaso 10/09 min 72:24", "prof": true}, {"id": "K69", "q": "El IVA grava las exportaciones y las entregas intracomunitarias", "a": false, "e": "Están sujetas pero EXENTAS (exención plena con derecho a deducción).", "b": 5, "src": "Kahoot del profesor, repaso 10/09 min 72:39", "prof": true}, {"id": "K70", "q": "En el IVA el sujeto pasivo es el empresario o profesional", "a": true, "e": "Quien realiza la operación, repercute e ingresa.", "b": 5, "src": "Kahoot del profesor, repaso 10/09 min 73:12", "prof": true}, {"id": "K71", "q": "El IVA utiliza para su cálculo el método de sustracción (soportado - repercutido)", "a": false, "e": "Es repercutido MENOS soportado.", "b": 5, "src": "Kahoot del profesor, repaso 10/09 min 73:39", "prof": true}, {"id": "K72", "q": "En el IVA coincide quien paga y quien soporta el impuesto", "a": false, "e": "Ingresa el empresario (sujeto pasivo); lo soporta el consumidor final.", "b": 5, "src": "Kahoot del profesor, repaso 10/09 min 73:57", "prof": true}, {"id": "K73", "q": "Si la exención se produce en la primera fase el IVA no es neutral", "a": false, "e": "En la primera fase el IVA sigue siendo neutral: la fase siguiente repercute sobre todo el valor.", "b": 5, "src": "Kahoot del profesor, repaso 10/09 min 74:18", "prof": true}, {"id": "K74", "q": "Si la exención se produce en una fase intermedia el IVA no es neutral", "a": true, "e": "El IVA soportado no deducible pasa a coste y se rompe la neutralidad.", "b": 5, "src": "Kahoot del profesor, repaso 10/09 min 74:45", "prof": true}, {"id": "K75", "q": "Si la exención se produce en una fase intermedia se genera ilusión financiera", "a": false, "e": "Lo que se genera es efecto piramidación (impuesto sobre impuesto).", "b": 5, "src": "Kahoot del profesor, repaso 10/09 min 75:12", "prof": true}, {"id": "K76", "q": "Si la exención se produce en una fase intermedia genera efecto piramidación", "a": true, "e": "Impuesto sobre impuesto en las fases posteriores.", "b": 5, "src": "Kahoot del profesor, repaso 10/09 min 75:45", "prof": true}, {"id": "K77", "q": "Si la exención se produce en la última fase se beneficia al consumidor", "a": true, "e": "El consumidor paga menos impuesto (solo el IVA oculto en el precio).", "b": 5, "src": "Kahoot del profesor, repaso 10/09 min 76:09", "prof": true}, {"id": "K78", "q": "En el IVA el tipo de gravamen general es el 21%, el reducido el 10% y el superreducido el 4%", "a": true, "e": "Tipos vigentes.", "b": 5, "src": "Kahoot del profesor, repaso 10/09 min 78:03", "prof": true}, {"id": "K79", "q": "Si sólo existen operaciones sujetas gravadas y exentas con derecho a deducción la prorrata no será del 100%", "a": false, "e": "En ese caso la prorrata ES del 100 % (las exentas plenas dan derecho a deducir).", "b": 5, "src": "Kahoot del profesor, repaso 10/09 min 78:24", "prof": true}, {"id": "K80", "q": "Si existen operaciones sujetas exentas sin derecho a deducción la prorrata no será del 100%", "a": true, "e": "Las exenciones limitadas del art. 20 reducen la prorrata.", "b": 5, "src": "Kahoot del profesor, repaso 10/09 min 79:42", "prof": true}, {"id": "K81", "q": "Si no existen operaciones del artículo 20 de la LIVA la prorrata será siempre del 100%", "a": true, "e": "Sin exenciones limitadas no hay prorrata.", "b": 5, "src": "Kahoot del profesor, repaso 10/09 min 80:09", "prof": true}, {"id": "K82", "q": "Los bienes inmuebles se regularizarán durante los 4 años siguientes a su adquisición", "a": false, "e": "Inmuebles: 9 años; bienes muebles de inversión: 4 años.", "b": 5, "src": "Kahoot del profesor, repaso 10/09 min 80:39", "prof": true}, {"id": "K83", "q": "La regularización de los bienes de inversión solo se realiza cuando existe una diferencia > +/- 10 puntos porcentuales", "a": true, "e": "Entre la prorrata del año de adquisición y la del año en curso.", "b": 5, "src": "Kahoot del profesor, repaso 10/09 min 81:00", "prof": true}, {"id": "K84", "q": "Si durante la regularización se vende el bien y es una operación sujeta gravada el resultado será a ingresar", "a": false, "e": "Se considera prorrata 100 % por los años pendientes: resultado a DEDUCIR.", "b": 5, "src": "Kahoot del profesor, repaso 10/09 min 81:24", "prof": true}, {"id": "K85", "q": "Si durante la regularización se vende el bien y es una operación sujeta exenta con DD el resultado será a deducir", "a": true, "e": "Exenta con derecho a deducción = tratamiento igual que gravada.", "b": 5, "src": "Kahoot del profesor, repaso 10/09 min 81:51", "prof": true}, {"id": "K86", "q": "Si durante la regularización se vende el bien y es una operación sujeta exenta sin DD el resultado será a ingresar", "a": true, "e": "Se considera prorrata 0 % por los años pendientes.", "b": 5, "src": "Kahoot del profesor, repaso 10/09 min 82:45", "prof": true}, {"id": "K87", "q": "Es deber del sujeto pasivo del IVA expedir y entregar facturas de todas sus operaciones", "a": true, "e": "Obligación formal básica (Reglamento de facturación).", "b": 6, "src": "Kahoot del profesor, repaso 10/09 min 83:15", "prof": true}, {"id": "K88", "q": "El convenio para evitar la doble imposición sólo afecta a los impuestos sobre la renta", "a": false, "e": "Afecta a los impuestos sobre la renta Y sobre el patrimonio.", "b": 6, "src": "Kahoot del profesor, repaso 10/09 min 85:18", "prof": true}, {"id": "K89", "q": "Los dividendos y los intereses sí pueden someterse a una imposición limitada en el Estado de la fuente", "a": true, "e": "Retención máxima fijada en el convenio (tributación compartida).", "b": 6, "src": "Kahoot del profesor, repaso 10/09 min 85:48", "prof": true}, {"id": "K90", "q": "El principio de residencia tiene preferencia al principio de territorialidad", "a": false, "e": "Respuesta mostrada: FALSO. En el convenio se reconoce primero la potestad del Estado de la fuente y el de residencia corrige la doble imposición [Inferido].", "b": 6, "src": "Kahoot del profesor, repaso 10/09 min 86:39", "prof": true}, {"id": "K91", "q": "En el convenio para evitar la doble imposición se permite el uso del método de exención con progresividad", "a": true, "e": "Modalidad del método de exención.", "b": 6, "src": "Kahoot del profesor, repaso 10/09 min 87:12", "prof": true}, {"id": "K92", "q": "En el convenio para evitar la doble imposición se permite el uso del método de deducción", "a": false, "e": "Los métodos son exención e imputación; 'deducción' no es un método del convenio.", "b": 6, "src": "Kahoot del profesor, repaso 10/09 min 87:57", "prof": true}, {"id": "K93", "q": "En el convenio para evitar la doble imposición se permite el uso del método de imputación limitada", "a": true, "e": "Crédito fiscal con el límite del impuesto español correspondiente.", "b": 6, "src": "Kahoot del profesor, repaso 10/09 min 88:54", "prof": true}, {"id": "K94", "q": "La exención es un método favorable a la repatriación de beneficios derivados de la inversión", "a": true, "e": "Al eximir la renta exterior, no penaliza traerla al país de residencia.", "b": 6, "src": "Kahoot del profesor, repaso 10/09 min 89:36", "prof": true}, {"id": "K95", "q": "El método de deducción permite aplicar en la cuota una deducción para evitar la doble imposición", "a": false, "e": "Respuesta mostrada: FALSO. El método que opera en cuota es la IMPUTACIÓN; 'método de deducción' no existe como tal.", "b": 6, "src": "Kahoot del profesor, repaso 10/09 min 90:27", "prof": true}, {"id": "K96", "q": "El convenio de la OCDE incluye el intercambio de información entre las autoridades fiscales de los Estados contratantes", "a": true, "e": "Art. 26 del Modelo OCDE.", "b": 6, "src": "Kahoot del profesor, repaso 10/09 min 90:54", "prof": true}, {"id": "K97", "q": "Las rentas de los bienes inmuebles se someten a tributación en el Estado de la Fuente o de situación sin limitación", "a": true, "e": "Art. 6 del Modelo OCDE.", "b": 6, "src": "Kahoot del profesor, repaso 10/09 min 91:21", "prof": true}, {"id": "S1", "q": "Los precios públicos son una de las tres categorías de tributos de la Ley General Tributaria.", "a": false, "e": "Los tributos son impuestos, tasas y contribuciones especiales.", "b": 0, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S2", "q": "Las contribuciones especiales se exigen por el beneficio o aumento de valor de bienes inmuebles derivado de obras o servicios públicos.", "a": true, "e": "Definición de contribución especial (PDF UA1_T01).", "b": 0, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S3", "q": "Una tasa puede exigirse por un servicio que el sector privado también presta en libre competencia.", "a": false, "e": "Requisito: que el sector privado no lo preste.", "b": 0, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S4", "q": "El impuesto se exige sin contraprestación directa y en función de la capacidad de pago.", "a": true, "e": "Característica esencial del impuesto.", "b": 0, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S5", "q": "La suficiencia, la eficiencia y la equidad son principios de un buen sistema tributario.", "a": true, "e": "PDF UA1_T01 §1.4.", "b": 0, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S6", "q": "El sujeto activo de un tributo es el contribuyente obligado al pago.", "a": false, "e": "El sujeto activo es la Administración acreedora.", "b": 0, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S7", "q": "El hecho imponible es el presupuesto fijado por la ley cuya realización origina la obligación tributaria.", "a": true, "e": "Definición legal (art. 20 LGT).", "b": 0, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S8", "q": "Una operación no sujeta forma parte del hecho imponible aunque no tribute.", "a": false, "e": "Lo no sujeto queda fuera del hecho imponible; lo exento está dentro.", "b": 0, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S9", "q": "La base liquidable se obtiene restando a la base imponible las reducciones previstas en la ley.", "a": true, "e": "BL = BI − reducciones.", "b": 0, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S10", "q": "La estimación indirecta es uno de los métodos de determinación de la base imponible.", "a": true, "e": "Directa, objetiva e indirecta.", "b": 0, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S11", "q": "La tarifa por clases evita el error de salto.", "a": false, "e": "La tarifa por clases lo produce; la de escalones lo evita.", "b": 0, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S12", "q": "La cuota íntegra se obtiene restando las deducciones a la cuota líquida.", "a": false, "e": "Es al revés: cuota líquida = cuota íntegra − deducciones.", "b": 0, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S13", "q": "Las retenciones y los pagos fraccionados se restan de la cuota líquida para obtener la cuota diferencial.", "a": true, "e": "Definición de cuota diferencial.", "b": 0, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S14", "q": "El IVA es un impuesto directo porque lo ingresa el empresario.", "a": false, "e": "Es indirecto: la carga se traslada al consumidor.", "b": 1, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S15", "q": "El Impuesto sobre el Patrimonio es un impuesto directo.", "a": true, "e": "Grava la titularidad del patrimonio.", "b": 1, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S16", "q": "Los no residentes que obtienen rentas en España tributan por el IRPF.", "a": false, "e": "Tributan por el IRNR.", "b": 1, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S17", "q": "El IRPF tiene en cuenta las circunstancias personales y familiares del contribuyente, por lo que es un impuesto subjetivo.", "a": true, "e": "Carácter subjetivo del IRPF.", "b": 1, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S18", "q": "El ISD es un impuesto cedido a las CCAA con capacidad normativa.", "a": true, "e": "Cesión del 100 % con competencias normativas.", "b": 1, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S19", "q": "Las CCAA de régimen común participan en el 50 % de la recaudación del IVA.", "a": true, "e": "Cesión del 50 % sin capacidad normativa.", "b": 1, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S20", "q": "La cesión del IRPF a las CCAA es del 33 %.", "a": false, "e": "Es del 50 %.", "b": 1, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S21", "q": "Los impuestos especiales de fabricación están cedidos a las CCAA en un 58 %.", "a": true, "e": "Alcohol, tabaco e hidrocarburos: 58 %.", "b": 1, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S22", "q": "El IBI y el IAE son impuestos de exacción obligatoria por los ayuntamientos.", "a": true, "e": "IBI, IAE e IVTM son obligatorios.", "b": 1, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S23", "q": "La plusvalía municipal (IIVTNU) es un impuesto que todos los ayuntamientos deben exigir.", "a": false, "e": "Es potestativo, como el ICIO.", "b": 1, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S24", "q": "El ICIO es un impuesto local de carácter indirecto.", "a": true, "e": "Única figura local indirecta.", "b": 1, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S25", "q": "El ITPAJD grava las transmisiones lucrativas entre particulares.", "a": false, "e": "Grava las onerosas; las lucrativas van al ISD.", "b": 1, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S26", "q": "Una persona que permanece 200 días en España durante el año natural es residente fiscal en España.", "a": true, "e": "Supera los 183 días.", "b": 2, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S27", "q": "El período impositivo del IRPF puede ser inferior al año natural en caso de fallecimiento del contribuyente.", "a": true, "e": "Única excepción al año natural.", "b": 2, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S28", "q": "El IRPF se devenga el 31 de diciembre.", "a": true, "e": "Último día del período impositivo.", "b": 2, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S29", "q": "La base del ahorro del IRPF tributa por una escala progresiva que empieza en el 19 %.", "a": true, "e": "19 %, 21 %, 23 %, 27 %, 30 %.", "b": 2, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S30", "q": "Los dividendos percibidos por una persona física integran la base imponible general.", "a": false, "e": "Integran la base del ahorro (art. 25.1).", "b": 2, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S31", "q": "Los rendimientos del capital inmobiliario integran la base imponible general.", "a": true, "e": "Alquileres de inmuebles: base general.", "b": 2, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S32", "q": "Un premio de lotería no sujeto al gravamen especial se integra en la base del ahorro.", "a": false, "e": "Ganancias no derivadas de transmisión: base general.", "b": 2, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S33", "q": "La ganancia por la venta de acciones forma parte de la base imponible del ahorro.", "a": true, "e": "Derivada de transmisión.", "b": 2, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S34", "q": "Las imputaciones de renta inmobiliaria de una segunda vivienda no alquilada forman parte de la base general.", "a": true, "e": "Imputaciones de renta: base general.", "b": 2, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S35", "q": "Para calcular el rendimiento neto del trabajo, los ingresos se computan por su importe íntegro.", "a": true, "e": "Bruto, antes de retenciones.", "b": 2, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S36", "q": "Las cotizaciones a la Seguridad Social del trabajador son gasto deducible del rendimiento del trabajo sin límite cuantitativo.", "a": true, "e": "Gasto deducible sin límite.", "b": 2, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S37", "q": "Las cuotas obligatorias a Colegios profesionales son deducibles con el límite de 500 € anuales.", "a": true, "e": "Límite de 500 €.", "b": 2, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S38", "q": "Los gastos de defensa jurídica derivados de litigios con el empleador son deducibles hasta 500 € anuales.", "a": false, "e": "Límite de 300 €.", "b": 2, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S39", "q": "Las primas de seguro de enfermedad satisfechas por la empresa están exentas hasta 1.500 € por persona cuando no hay discapacidad.", "a": false, "e": "500 € (1.500 € solo con discapacidad).", "b": 2, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S40", "q": "Si la empresa cede el uso de un vehículo, la renta en especie se valora cada año en el 20 % del coste de adquisición.", "a": true, "e": "Regla del uso (reducible hasta un 30 % si es eficiente).", "b": 2, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S41", "q": "La entrega de un vehículo al trabajador se valora por el 20 % del valor de mercado.", "a": false, "e": "Se valora por el coste de adquisición para el pagador.", "b": 2, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S42", "q": "La renta en especie por vivienda propiedad del pagador se valora en el 10 % del valor catastral, o el 5 % si está revisado.", "a": true, "e": "Con tope del 10 % de las demás contraprestaciones.", "b": 2, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S43", "q": "Un préstamo de la empresa al 0 % de interés genera renta en especie por la diferencia con el interés legal del dinero.", "a": true, "e": "Regla de préstamos a tipo inferior al legal.", "b": 2, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S44", "q": "Las aportaciones de la empresa a un plan de pensiones del trabajador llevan ingreso a cuenta.", "a": false, "e": "No llevan ingreso a cuenta.", "b": 2, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S45", "q": "Un empresario con 700.000 € de cifra de negocios el año anterior tributa obligatoriamente en estimación directa normal.", "a": true, "e": "Supera los 600.000 €.", "b": 3, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S46", "q": "En estimación directa simplificada es obligatorio llevar contabilidad ajustada al Código de Comercio.", "a": false, "e": "Bastan los libros registro.", "b": 3, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S47", "q": "En estimación directa simplificada se deduce un 5 % del rendimiento neto en concepto de provisiones y gastos de difícil justificación, con el máximo de 2.000 €.", "a": true, "e": "Regla de la EDS.", "b": 3, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S48", "q": "La amortización en EDS se practica con las tablas del Impuesto sobre Sociedades.", "a": false, "e": "Tabla simplificada de la Orden de 27/03/1998.", "b": 3, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S49", "q": "Para aplicar módulos la actividad debe figurar en la Orden ministerial anual que desarrolla el régimen.", "a": true, "e": "Orden anual de módulos.", "b": 3, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S50", "q": "Un empresario en estimación objetiva del IRPF tributa en el régimen general del IVA.", "a": false, "e": "Tributa en el régimen simplificado (o recargo de equivalencia/REAGP).", "b": 3, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S51", "q": "En una comunidad de bienes el método de estimación del rendimiento se determina para la entidad y afecta a todos los comuneros.", "a": true, "e": "Entidades en atribución de rentas.", "b": 3, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S52", "q": "Los bienes afectos a la actividad no pueden amortizarse fiscalmente.", "a": false, "e": "Son amortizables.", "b": 3, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S53", "q": "El IS es un impuesto proporcional porque aplica un tipo fijo sobre la base imponible.", "a": true, "e": "Tipo fijo (25 % general).", "b": 4, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S54", "q": "Una sociedad con domicilio social en España es residente fiscal aunque se haya constituido conforme a leyes extranjeras.", "a": true, "e": "Basta uno de los tres criterios del art. 8 LIS.", "b": 4, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S55", "q": "Las fundaciones están totalmente exentas del IS.", "a": false, "e": "Exención parcial.", "b": 4, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S56", "q": "Una sociedad puede tener un período impositivo que vaya del 1 de julio al 30 de junio.", "a": true, "e": "Coincide con su ejercicio económico.", "b": 4, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S57", "q": "El período impositivo del IS puede superar los doce meses si así lo acuerdan los socios.", "a": false, "e": "Máximo 12 meses.", "b": 4, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S58", "q": "La declaración del IS se presenta en los 25 días naturales siguientes a los seis meses posteriores al cierre del ejercicio.", "a": true, "e": "PDF UA1_T03.", "b": 4, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S59", "q": "La base imponible del IS parte del resultado contable corregido por los ajustes extracontables.", "a": true, "e": "Método de estimación directa.", "b": 4, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S60", "q": "Las multas y sanciones administrativas son gasto deducible en el IS.", "a": false, "e": "Art. 15 LIS: no deducibles.", "b": 4, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S61", "q": "El gasto contabilizado por el propio Impuesto sobre Sociedades no es fiscalmente deducible.", "a": true, "e": "Art. 15 LIS.", "b": 4, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S62", "q": "La pérdida por deterioro de un crédito frente a un ayuntamiento es deducible en el IS.", "a": false, "e": "Créditos de entidades de derecho público: no deducibles.", "b": 4, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S63", "q": "El método de números dígitos es un método de amortización fiscalmente admitido en el IS.", "a": true, "e": "Art. 12 LIS.", "b": 4, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S64", "q": "El método degresivo de porcentaje constante puede aplicarse a edificios.", "a": false, "e": "Excluidos edificios, mobiliario y enseres.", "b": 4, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S65", "q": "El tipo general del IS es el 25 %.", "a": true, "e": "Tipo general.", "b": 4, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S66", "q": "Las entidades de nueva creación tributan al 15 % en el primer período con base positiva y el siguiente.", "a": true, "e": "Tipo reducido de nueva creación.", "b": 4, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S67", "q": "Para aplicar la exención por dividendos del art. 21 LIS basta una participación del 3 %.", "a": false, "e": "Participación mínima del 5 %.", "b": 4, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S68", "q": "La exención sobre dividendos del art. 21 LIS exige mantener la participación al menos un año.", "a": true, "e": "Requisito de mantenimiento.", "b": 4, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S69", "q": "Son entidades de reducida dimensión las que tuvieron una cifra de negocios inferior a 10 millones de euros en el período anterior.", "a": true, "e": "PDF UA1_T03 §7.", "b": 4, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S70", "q": "Las entidades de reducida dimensión pueden aplicar libertad de amortización ligada a la creación de empleo.", "a": true, "e": "Incentivo ERD.", "b": 4, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S71", "q": "Una entidad patrimonial puede aplicar los incentivos de reducida dimensión.", "a": false, "e": "Excluidas expresamente.", "b": 4, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S72", "q": "Las importaciones de bienes están sujetas al IVA.", "a": true, "e": "Hecho imponible: importaciones.", "b": 5, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S73", "q": "Las exportaciones están no sujetas al IVA.", "a": false, "e": "Están sujetas y exentas (exención plena).", "b": 5, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S74", "q": "Una entrega intracomunitaria de bienes a un empresario de otro Estado miembro está exenta de IVA.", "a": true, "e": "Exención plena con derecho a deducción.", "b": 5, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S75", "q": "El consumidor final es el sujeto pasivo del IVA.", "a": false, "e": "Sujeto pasivo: el empresario o profesional; el consumidor es quien soporta.", "b": 5, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S76", "q": "La cuota a ingresar en IVA se obtiene restando el IVA soportado deducible del IVA repercutido.", "a": true, "e": "Repercutido − soportado.", "b": 5, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S77", "q": "Una exención en la fase final de la cadena beneficia al consumidor porque reduce el impuesto que paga.", "a": true, "e": "Aunque parte del IVA queda oculto en el precio.", "b": 5, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S78", "q": "Una exención en una fase intermedia genera efecto piramidación.", "a": true, "e": "Impuesto sobre impuesto.", "b": 5, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S79", "q": "Una exención en la primera fase de producción rompe la neutralidad del IVA.", "a": false, "e": "La fase siguiente repercute sobre todo el valor; sigue siendo neutral.", "b": 5, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S80", "q": "El tipo superreducido del IVA es el 5 %.", "a": false, "e": "Es el 4 %.", "b": 5, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S81", "q": "El tipo reducido del IVA es el 10 %.", "a": true, "e": "Tipos: 21 / 10 / 4.", "b": 5, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S82", "q": "Las operaciones exentas del art. 20 LIVA (sanidad, educación, seguros) dan derecho a deducir el IVA soportado.", "a": false, "e": "Son exenciones limitadas: sin derecho a deducción.", "b": 5, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S83", "q": "Una empresa que solo realiza operaciones gravadas y exportaciones tiene prorrata del 100 %.", "a": true, "e": "Las exportaciones dan derecho a deducir.", "b": 5, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S84", "q": "La prorrata se aplica cuando el sujeto pasivo realiza operaciones con y sin derecho a deducción.", "a": true, "e": "Sectores con exenciones limitadas.", "b": 5, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S85", "q": "Los bienes muebles de inversión se regularizan durante los 4 años siguientes a su adquisición.", "a": true, "e": "4 años muebles, 9 años inmuebles.", "b": 5, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S86", "q": "Un edificio adquirido como bien de inversión se regulariza durante 9 años.", "a": true, "e": "Terrenos y edificaciones: 9 años.", "b": 5, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S87", "q": "La regularización de bienes de inversión procede cuando la prorrata varía más de 5 puntos.", "a": false, "e": "Más de 10 puntos porcentuales.", "b": 5, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S88", "q": "Si un bien de inversión se vende en una operación gravada durante el período de regularización, la regularización da un resultado a favor del sujeto pasivo.", "a": true, "e": "Se considera prorrata 100 % el resto de años.", "b": 5, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S89", "q": "Si el bien de inversión se vende en una operación exenta sin derecho a deducción, el resultado de la regularización es a ingresar.", "a": true, "e": "Se considera prorrata 0 %.", "b": 5, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S90", "q": "Los empresarios no están obligados a expedir factura en las operaciones con consumidores finales.", "a": false, "e": "Deben expedir factura (simplificada en su caso) por todas las operaciones.", "b": 6, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S91", "q": "Los convenios de doble imposición solo regulan los impuestos sobre la renta.", "a": false, "e": "También los impuestos sobre el patrimonio.", "b": 6, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S92", "q": "La doble imposición económica se produce cuando una misma renta tributa en dos personas distintas.", "a": true, "e": "Beneficio en filial y dividendo en matriz.", "b": 6, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S93", "q": "Según el Modelo OCDE, las rentas de inmuebles tributan exclusivamente en el Estado de residencia del propietario.", "a": false, "e": "Tributan en el Estado de situación sin limitación.", "b": 6, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S94", "q": "Los convenios permiten que los dividendos se graven en el Estado de la fuente con una retención limitada.", "a": true, "e": "Tributación compartida con límite.", "b": 6, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S95", "q": "El método de exención con progresividad exime la renta extranjera pero la tiene en cuenta para fijar el tipo aplicable al resto de rentas.", "a": true, "e": "Modalidad del método de exención.", "b": 6, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S96", "q": "En el método de imputación limitada se deduce el impuesto extranjero sin ningún límite.", "a": false, "e": "Límite: el impuesto que correspondería en España.", "b": 6, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S97", "q": "El método de imputación es más neutral respecto a la exportación de capitales que el de exención.", "a": true, "e": "Iguala la carga a la del país de residencia.", "b": 6, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S98", "q": "El método de exención favorece la repatriación de beneficios obtenidos en el extranjero.", "a": true, "e": "No penaliza traer la renta exenta.", "b": 6, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S99", "q": "El Modelo de convenio de la OCDE incluye una cláusula de intercambio de información entre Administraciones.", "a": true, "e": "Art. 26 Modelo OCDE.", "b": 6, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}, {"id": "S100", "q": "Para resolver un conflicto de residencia entre dos Estados, el primer criterio del Modelo OCDE es la nacionalidad.", "a": false, "e": "Primero vivienda permanente; después centro de intereses vitales, morada habitual y por último nacionalidad.", "b": 6, "src": "Simulacro (misma materia, redacción nueva)", "prof": false}]};
const KEY="ffc-m4-stats-v1";
let stats={};
try{ stats=JSON.parse(localStorage.getItem(KEY)||"{}")||{}; }catch(e){ stats={}; }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(stats)); }catch(e){} }
const $=s=>document.querySelector(s);
const app=$("#app");
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const Q=BANK.q, BLOCKS=BANK.blocks;
const st=id=>stats[id]||{ok:0,ko:0};
function blockPct(b){ const qs=Q.filter(q=>q.b===b); let ok=0,n=0; qs.forEach(q=>{const s=st(q.id); ok+=s.ok; n+=s.ok+s.ko;}); return n?Math.round(100*ok/n):null; }
function dotCls(p){ return p==null?"":p<50?"r":p<75?"a":"g"; }
function failed(){ return Q.filter(q=>{const s=st(q.id);return s.ko>s.ok;}); }
function seen(){ return Q.filter(q=>{const s=st(q.id);return s.ok+s.ko>0;}).length; }

function home(){
  const f=failed().length;
  app.innerHTML=`
  <h1>Fiscalidad Financiera Corporativa</h1>
  <p class="sub">Módulo 4. Examen de 100 preguntas verdadero/falso. Acierto +0,10, fallo −0,025, en blanco 0.</p>
  <div class="modes">
    <button class="mode" onclick="start('exam')"><span class="n">100</span><span><span class="mode-t">Simulacro de examen</span><span class="mode-d">100 preguntas al azar de todo el banco, con la misma penalización que el examen y nota sobre 10.</span></span></button>
    <button class="mode" onclick="start('prof')"><span class="n">${Q.filter(q=>q.prof).length}</span><span><span class="mode-t">Preguntas del profesor</span><span class="mode-d">Las que proyectó en el Kahoot del repaso del 10/09, en el orden de la clase.</span></span></button>
    <button class="mode" onclick="start('fail')" ${f?"":"disabled"}><span class="n">${f}</span><span><span class="mode-t">Repasar lo que fallo</span><span class="mode-d">${f?"Preguntas que has fallado más veces de las que has acertado.":"Aún no hay preguntas falladas. Haz un simulacro primero."}</span></span></button>
  </div>
  <p class="sub" style="margin:22px 0 6px">Por bloque</p>
  <div class="blocks">${BLOCKS.map((b,i)=>{const p=blockPct(i);const n=Q.filter(q=>q.b===i).length;return `<button class="blk" onclick="start('block',${i})"><span class="dot ${dotCls(p)}"></span><span class="t">${esc(b)}</span><span class="pct">${p==null?n+" preg.":p+" %"}</span></button>`;}).join("")}</div>
  <div class="stats"><span>Vistas <b>${seen()}</b> de ${Q.length}</span><span>Falladas <b>${f}</b></span></div>
  <button class="link" onclick="if(confirm('¿Borrar todo el progreso guardado?')){stats={};save();home();}">Borrar progreso</button>`;
  window.scrollTo(0,0);
}

let S=null;
function start(mode,b){
  let list;
  if(mode==="exam") list=shuffle(Q).slice(0,100);
  else if(mode==="prof") list=Q.filter(q=>q.prof);
  else if(mode==="fail") list=shuffle(failed());
  else list=shuffle(Q.filter(q=>q.b===b));
  if(!list.length){home();return;}
  S={mode,b,list,i:0,ok:0,ko:0,blank:0,log:[],title:mode==="exam"?"Simulacro":mode==="prof"?"Preguntas del profesor":mode==="fail"?"Repaso de fallos":BLOCKS[b]};
  show();
}
function show(){
  const q=S.list[S.i];
  app.innerHTML=`
  <div class="top"><span>${esc(S.title)}</span><span>${S.i+1} / ${S.list.length}</span></div>
  <div class="bar"><i style="width:${100*S.i/S.list.length}%"></i></div>
  <div class="qcard">
    <div class="qnum">${q.prof?"Pregunta del profesor":"Pregunta de simulacro"} · ${esc(BLOCKS[q.b])}</div>
    <p class="qtext">${esc(q.q)}</p>
    <div class="ans"><button class="bv" onclick="answer(true)">Verdadero</button><button class="bf" onclick="answer(false)">Falso</button></div>
    ${S.mode==="exam"?`<button class="skip" onclick="answer(null)">Dejar en blanco</button>`:""}
    <div id="fb"></div>
  </div>
  <div class="row"><button class="link ghost" onclick="if(confirm('¿Salir? Se guarda lo contestado hasta ahora.')){home();}">Salir al inicio</button></div>`;
  window.scrollTo(0,0);
}
function answer(v){
  const q=S.list[S.i]; const s=st(q.id);
  let cls,head;
  if(v===null){ S.blank++; cls="skip"; head="En blanco. "; }
  else if(v===q.a){ S.ok++; s.ok++; cls="ok"; head="Correcto. "; }
  else { S.ko++; s.ko++; cls="bad"; head="Incorrecto. "; }
  stats[q.id]=s; save();
  S.log.push({q,v,res:cls});
  document.querySelectorAll(".ans button").forEach(b=>{b.disabled=true; if((b.classList.contains("bv")&&v===true)||(b.classList.contains("bf")&&v===false)) b.classList.add("chosen");});
  const sk=$(".skip"); if(sk) sk.disabled=true;
  $("#fb").innerHTML=`<div class="fb ${cls}"><span class="v">${head}La respuesta es ${q.a?"VERDADERO":"FALSO"}.</span> ${esc(q.e)}<span class="ref">${esc(q.src)}</span></div>
  <button class="next" onclick="next()">${S.i+1<S.list.length?"Siguiente":"Ver resultado"}</button>`;
  $(".next").focus();
}
function next(){ S.i++; if(S.i<S.list.length) show(); else result(); }
function result(){
  const n=S.list.length;
  const nota=Math.max(0,0.10*S.ok-0.025*S.ko)*(100/n);
  const perB=BLOCKS.map((b,i)=>{const l=S.log.filter(x=>x.q.b===i);if(!l.length)return"";const ok=l.filter(x=>x.res==="ok").length;return`<tr><td>${esc(b)}</td><td>${ok} / ${l.length}</td></tr>`;}).join("");
  const wrong=S.log.filter(x=>x.res!=="ok");
  app.innerHTML=`
  <div class="top"><span>${esc(S.title)}</span><span>terminado</span></div>
  <div class="qcard">
    <div class="score">${nota.toFixed(2).replace(".",",")}<small> / 10</small></div>
    <p class="res-line">${S.ok} aciertos, ${S.ko} fallos${S.blank?`, ${S.blank} en blanco`:""} de ${n}.${S.mode==="exam"?"":" Nota equivalente a un examen de 100."} ${nota>=5?"Aprobado.":"Por debajo del 5."}</p>
    <table class="tbl">${perB}</table>
    <div class="row"><button class="next" onclick="start(S.mode,S.b)">Repetir este modo</button>${wrong.length?`<button onclick="S={...S,list:shuffle(wrong.map(x=>x.q)),i:0,ok:0,ko:0,blank:0,log:[],title:'Solo las falladas',mode:'fail'};show()">Repetir solo las falladas (${wrong.length})</button>`:""}<button class="link ghost" onclick="home()">Volver al inicio</button></div>
  </div>
  ${wrong.length?`<p class="sub" style="margin-top:20px">Para repasar</p><div class="rev">${wrong.map(x=>`<div class="it ${x.res}"><div class="q">${esc(x.q.q)}</div><div class="e">${x.q.a?"Verdadero":"Falso"}. ${esc(x.q.e)}</div></div>`).join("")}</div>`:""}`;
  window.scrollTo(0,0);
}
home();
</script>
</body>
</html>
