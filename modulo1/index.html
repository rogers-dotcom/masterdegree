esgo SISTEMÁTICO es casi nulo. El Pearson de 0,08 y el R cuadrado de 0,01 confirman que el mercado no explica nada de su comportamiento: epsilon es enorme. Pero cuidado, y aquí está la clave: eso NO significa que el activo sea seguro. La nube de puntos está muy dispersa en vertical, lo que indica alta volatilidad, es decir, alto riesgo TOTAL. Como el riesgo total se descompone en riesgo de mercado más riesgo idiosincrático, y el de mercado es casi cero, todo el riesgo es IDIOSINCRÁTICO. Conclusión: es el perfil típico de un hedge fund, que busca retorno absoluto con estrategias descorrelacionadas de los mercados tradicionales. Excelente diversificador por su beta casi nula, pero de riesgo elevado por motivos propios, no de mercado."}]);
CASOS_CARTERA = CASOS_CARTERA.concat([{"id":"c5","titulo":"Cartera E · Con activo de beta negativa y sin opciones","filas":[["Fondo de renta variable europea","55%","beta 1,40"],["Fondo con estrategia inversa","30%","beta −0,80"],["Liquidez","15%","—"]],"extra":"Correlación entre ambos fondos: −0,65","veredicto":"SÍ","lectura":"El primer fondo, con beta 1,40, supera la unidad: es AGRESIVO y amplifica los movimientos del mercado. El segundo tiene beta −0,80, NEGATIVA: mantiene relación inversa con el índice, de modo que cuando el mercado sube él baja y viceversa. La correlación entre ambos es −0,65, negativa, lo que significa que se compensan entre sí: es un diversificador excelente, mejor incluso que una simple ausencia de correlación. Aquí está lo interesante de esta cartera: NO hay ninguna opción, y sin embargo está cubierta. El fondo de beta negativa actúa como COBERTURA NATURAL del fondo agresivo, y lo hace sin pagar prima alguna. Es la primera de las tres formas de mitigar el riesgo que enumeró el profesor: la diversificación mediante activos poco o negativamente correlacionados, antes de recurrir al hedge o a los derivados. El peso de la cobertura natural (30%) es inferior al del activo agresivo (55%), así que la cartera mantiene exposición neta al mercado en lugar de anularla. Y el 15% de liquidez aporta margen de maniobra. Recomendación: sí. Cartera bien construida, con riesgo de mercado moderado y una cobertura eficiente en coste. Apta para un perfil moderado."},{"id":"c6","titulo":"Cartera F · Con cobertura total","filas":[["Telefónica","60%","beta 1,12"],["Bonos del Estado a 5 años","25%","—"],["PUT comprada sobre Telefónica","60% del nominal","strike 4,00 € / spot 4,05 €"]],"extra":"Correlación Telefónica–bonos: 0,12","veredicto":"NO","lectura":"Telefónica, con beta 1,12, está ligeramente por encima de 1: es algo AGRESIVA, amplifica los movimientos del mercado sin exageración. Los bonos del Estado no tienen beta frente al IBEX porque no son renta variable, y su correlación con Telefónica es de solo 0,12: muy por debajo de 0,60, luego ausencia de correlación y buena diversificación. Hasta aquí la cartera es correcta. El problema está en el dimensionamiento de la cobertura. La PUT cubre el 60% del nominal sobre un activo que pesa el 60%: es una COBERTURA PERFECTA, exactamente lo que el profesor dijo que no hay que hacer. Sus palabras fueron: no hagáis coberturas perfectas nunca, trabajad con coberturas parciales. El motivo es doble. Primero, una cobertura total anula la exposición al activo: si está completamente protegido a la baja pero se ha pagado la prima, el resultado neto es peor que no haber invertido. Segundo, la prima de una cobertura del 60% es muy elevada y consume la rentabilidad esperada de la posición. Además el strike de 4,00 € está por debajo del spot de 4,05 €, así que la protección solo arranca tras una caída previa. Recomendación: no. La composición de activos es razonable, pero la cobertura está sobredimensionada y mal situada. Habría que reducirla a un 15 o 20% del nominal y subir el strike."},{"id":"c7","titulo":"Cartera G · Cubierta con un futuro en vez de una opción","filas":[["Repsol","55%","beta 1,21"],["Naturgy","30%","beta 0,68"],["FUTURO vendedor sobre Repsol","20% del nominal","vencimiento a 3 meses"]],"extra":"Correlación Repsol–Naturgy: 0,57","veredicto":"SÍ, con una advertencia importante","lectura":"Repsol, con beta 1,21, supera la unidad: es AGRESIVA. Naturgy, con 0,68, está entre 0 y 1: es CONSERVADORA y amortigua. El activo que domina el riesgo es Repsol, tanto por peso como por beta. La correlación de 0,57 está por debajo de 0,60: ausencia de correlación, buena diversificación entre las dos posiciones pese a ser ambas del sector energético. La cobertura es un FUTURO VENDEDOR sobre Repsol, es decir, la posición contraria a la posición larga, y cubre el 20% frente a un peso del 55%: es parcial y está bien dirigida al activo más agresivo. Pero aquí hay que advertir de la diferencia esencial entre cubrir con un futuro y cubrir con una opción. Un futuro OBLIGA a ambas partes a intercambiarse lo pactado al vencimiento, mientras que una opción da un DERECHO que se puede no ejercer. Y sobre todo: las pérdidas de un futuro son ILIMITADAS, mientras que en una opción comprada la pérdida máxima es la prima. Si Repsol sube con fuerza, el futuro vendedor generará pérdidas crecientes sin techo, que compensarán la subida de la posición larga pero eliminarán todo el potencial al alza. El futuro, en cambio, no exige pagar prima y sí exige un desembolso inicial como garantía ante la cámara. Recomendación: sí, la estructura es técnicamente correcta y la cartera está bien diversificada, pero hay que explicar al CEO que esta cobertura elimina el potencial de subida y expone a pérdidas ilimitadas en el derivado, algo que una PUT comprada no haría."},{"id":"c8","titulo":"Cartera H · Tres activos del mismo sector","filas":[["Banco Santander","35%","beta 1,63"],["BBVA","30%","beta 1,55"],["CaixaBank","20%","beta 1,48"],["PUT comprada sobre CaixaBank","10% del nominal","strike 3,90 € / spot 4,10 €"]],"extra":"Correlaciones: Santander–BBVA 0,93 · Santander–CaixaBank 0,89 · BBVA–CaixaBank 0,91","veredicto":"NO","lectura":"Las tres betas superan la unidad: 1,63, 1,55 y 1,48. Las tres son AGRESIVAS, así que no hay ningún activo que amortigüe y la cartera amplifica los movimientos del mercado en su totalidad. Por la normativa MiFID II no sería recomendable para un cliente sin conocimientos financieros. El problema de fondo es la concentración. Las tres correlaciones están por encima de 0,80 (0,93, 0,89 y 0,91), todas FUERTES: los tres activos son bancos españoles con enorme peso en el IBEX y se mueven casi igual. La cartera aparenta estar diversificada porque tiene tres posiciones, pero en realidad tiene el riesgo de una sola apuesta sectorial. Si el sector bancario cae, caen los tres a la vez. Y la cobertura agrava el diagnóstico por dos motivos. Primero, está dirigida a CaixaBank, que es el activo MENOS agresivo de los tres (beta 1,48) y el de menor peso (20%): se está protegiendo justo lo que menos riesgo aporta, mientras Santander, con la beta más alta y el mayor peso, queda totalmente expuesto. Segundo, el strike de 3,90 € está por debajo del spot de 4,10 €, luego la protección solo actúa tras una caída de casi el 5%. Recomendación: no. La cartera concentra todo el riesgo en un único sector, no diversifica nada y la cobertura está mal dirigida y mal situada. Habría que reducir la exposición bancaria, introducir activos de sectores descorrelacionados y redirigir la cobertura al activo de mayor beta y mayor peso."}]);
var CASOS_BONO = [{"id":"n1","titulo":"Bono soberano de cupón fijo","datos":[["Emisor","Reino de España"],["Valor nominal","1.000 €"],["Cupón","3,20% anual"],["Frecuencia de pago","Anual"],["Fecha de vencimiento","A 10 años"],["Precio de cotización","96,50% del nominal"],["Rating","A"]],"veredicto":"Cotiza bajo par","lectura":"Es un bono soberano de cupón fijo: el 3,20% del nominal se conoce de antemano y no varía durante la vida del bono, así que el inversor sabe qué flujos recibirá. Paga 32 € al año por cada título de 1.000 € y devuelve el nominal al vencimiento; en el último periodo el flujo es el cupón MÁS el nominal. El dato interesante es el precio: cotiza al 96,50%, es decir POR DEBAJO DEL PAR. Eso significa que los tipos de interés de mercado han subido por encima del cupón desde que se emitió. La lógica es la del descuento: el precio es la suma de los flujos futuros descontados, y si la tasa de descuento sube, el denominador crece y el precio cae. Por tanto, quien compre hoy a 96,50 obtendrá una rentabilidad superior al 3,20%, porque además del cupón cobrará la diferencia hasta el nominal al vencimiento. Dos precisiones para el examen: si se mantiene hasta vencimiento, la rentabilidad está garantizada siempre que el emisor cumpla; si se vende antes, dependerá del precio de mercado, que no está garantizado. Y aunque se llame renta fija, tiene riesgo: de crédito (el rating A indica calidad buena pero no máxima) y de mercado (por variaciones de tipos)."},{"id":"n2","titulo":"Bono perpetuo","datos":[["Emisor","Entidad financiera"],["Valor nominal","1.000 €"],["Cupón","5,00% anual"],["Fecha de vencimiento","No tiene"],["Precio de cotización","92,00% del nominal"],["Carácter","Subordinado"]],"veredicto":"Producto complejo","lectura":"Es un bono PERPETUO: no tiene fecha de vencimiento, paga cupón indefinidamente pero NUNCA devuelve el nominal. Esa ausencia de devolución cambia por completo la valoración: como los periodos son infinitos, la suma de los flujos descontados converge a la fórmula de la renta perpetua, es decir el cupón anual dividido entre la tasa de descuento requerida por el mercado. Es un caso especial y elegante del descuento de flujos, no un método distinto. Hay dos advertencias importantes que conviene dar al cliente. La primera es que, al no haber devolución del nominal, la única vía de recuperar el capital invertido es VENDER el bono en el mercado secundario, al precio que haya en ese momento, que no está garantizado. La segunda es su carácter SUBORDINADO: en caso de insolvencia del emisor, estos tenedores cobran después de los acreedores ordinarios, lo que eleva notablemente el riesgo de crédito. Y un punto normativo relevante: la deuda subordinada es un producto MiFID COMPLEJO, igual que las participaciones preferentes. Eso impide aplicar el principio de solo ejecución, así que haría falta un test de conveniencia previo aunque el cliente lo solicitara por iniciativa propia."},{"id":"n3","titulo":"Bono corporativo de cupón variable","datos":[["Emisor","Compañía industrial"],["Valor nominal","1.000 €"],["Cupón","EURÍBOR 3 meses + 1,50%"],["Frecuencia de pago","Trimestral"],["Fecha de vencimiento","A 5 años"],["Precio de cotización","99,80% del nominal"],["Rating","BBB−"]],"veredicto":"Riesgo de crédito relevante","lectura":"Es un bono corporativo de CUPÓN VARIABLE, lo que en inglés se denomina floating rate note. El cupón no está fijado: se referencia al EURÍBOR a 3 meses más un diferencial de 1,50 puntos, y se recalcula en cada fecha de pago trimestral. Eso tiene una consecuencia clave que conviene explicar: como el cupón se ajusta a los tipos de mercado, el precio del bono es mucho MENOS sensible a las variaciones de tipos que el de un bono de cupón fijo. Por eso cotiza al 99,80%, prácticamente a la par. Donde sí hay riesgo es en el crédito: el rating BBB− está en el último escalón del grado de inversión, justo por encima del grado especulativo, así que el diferencial de 1,50 puntos es la compensación que exige el mercado por ese riesgo de impago. El emisor es además una compañía industrial, no un Estado. Un matiz que el profesor comentó en clase: se mostró en desacuerdo con que los reguladores clasifiquen los bonos de cupón variable como productos sencillos de entender para un cliente minorista, porque el inversor no sabe de antemano cuánto va a cobrar. Es un buen ejemplo de que la protección normativa puede ser más formal que real, y conecta con el caso del litigio del BBVA por no explicar correctamente el funcionamiento de un producto."}];
var CASOS_OPCION = [{"id":"o1","titulo":"CALL europea sobre el EuroStoxx 50","datos":[["Tipo de opción","CALL (compra)"],["Posición","Comprada"],["Subyacente","EuroStoxx 50"],["Precio strike","3.420 puntos"],["Precio spot","3.133 puntos"],["Opcionalidad","Europea"],["Mercado","Eurex (Frankfurt)"]],"veredicto":"No se ejercería hoy","lectura":"Es una CALL comprada, es decir un derecho, no una obligación, de COMPRAR el subyacente al precio strike de 3.420 puntos. Se contrata esperando que el índice SUBA, porque su valor aumenta cuando el precio supera el strike. La lectura de los dos precios es la clave de la respuesta: el strike está en 3.420 y el spot en 3.133, luego el strike está POR ENCIMA del precio de mercado. Si hoy fuera el vencimiento, no tendría ningún sentido ejercer el derecho: nadie compra a 3.420 algo que en el mercado vale 3.133. La opción no se ejercería y se perdería la prima pagada. Ahí está la ventaja del producto: la pérdida máxima del comprador de una opción se LIMITA A LA PRIMA, a diferencia de un futuro o un forward, donde las pérdidas son ilimitadas. Al ser EUROPEA, ese derecho solo puede ejercerse en la fecha de vencimiento, así que aún queda margen para que el índice remonte los 287 puntos que faltan. Si fuera americana podría ejercerse en cualquier momento de la vida del producto y su prima sería más cara. Se negocia en Eurex, un mercado organizado, así que hay cámara de contrapartida y no existe riesgo de contraparte. Conclusión: la posición está fuera de dinero, y su valor depende enteramente de que el índice suba con fuerza antes del vencimiento."},{"id":"o2","titulo":"PUT americana para cubrir una posición larga","datos":[["Tipo de opción","PUT (venta)"],["Posición","Comprada"],["Subyacente","Acción cotizada"],["Posición que cubre","Larga, 40% de la cartera"],["Nominal de la opción","12% del nominal"],["Precio strike","12,50 €"],["Precio spot","12,10 €"],["Opcionalidad","Americana"]],"veredicto":"Cobertura correcta","lectura":"Es una PUT comprada: un derecho, no una obligación, de VENDER el subyacente al precio strike de 12,50 €. Cubre una posición LARGA, y eso es exactamente lo correcto, porque para cubrir hay que tomar SIEMPRE la posición contraria: quien está largo pierde con las caídas, y una PUT gana valor cuando el precio cae. Si el activo se desploma, el derecho de venta a 12,50 € compensa la pérdida; si sube, no se ejerce y solo se pierde la prima. El strike de 12,50 € está POR ENCIMA del spot de 12,10 €, así que la protección ya está activa y no exige una caída previa para empezar a funcionar. El dimensionamiento también es correcto: cubre el 12% frente a una posición del 40%, es decir una cobertura PARCIAL, tal como recomendó el profesor cuando dijo que no hay que hacer coberturas perfectas nunca. Al ser AMERICANA, el derecho puede ejercerse en cualquier momento de la vida del producto y no solo al vencimiento, lo que da flexibilidad a cambio de una prima más alta. En la práctica esa flexibilidad no es literal: suelen abrirse ventanas de cancelación mensuales con un preaviso de cinco días hábiles. Conclusión: cobertura bien planteada en dirección, en tamaño y en precio de ejercicio."},{"id":"o3","titulo":"CALL para cubrir una posición corta","datos":[["Tipo de opción","CALL (compra)"],["Posición","Comprada"],["Subyacente","Banco cotizado"],["Posición que cubre","Corta, 25% del nominal"],["Nominal de la opción","10% del nominal"],["Precio strike","5,10 €"],["Precio spot","4,90 €"],["Opcionalidad","No especificada"]],"veredicto":"Cobertura correcta","lectura":"Este es el caso que más se falla, así que conviene razonarlo despacio. Hay una posición CORTA sobre un banco, es decir una apuesta a que su precio va a caer. Quien está corto pierde dinero si el precio SUBE. Por tanto, para cubrir esa posición hay que protegerse de las subidas, y el instrumento que gana valor cuando el precio sube es la opción de COMPRA, la CALL. Es la aplicación de la regla de la posición contraria: la posición principal es corta, luego la cobertura va en sentido inverso, que aquí significa comprar una CALL. Es exactamente el ejemplo que puso el profesor en clase. Nota importante: la CALL NO cubre caídas. Si alguien dice que una CALL protege ante bajadas, está describiendo una PUT. El dimensionamiento es correcto: cubre el 10% frente a una posición corta del 25%, cobertura PARCIAL. El strike de 5,10 € está por encima del spot de 4,90 €, así que la protección se activa si el banco sube más del 4%: razonable para una cobertura, que no pretende cubrir cualquier oscilación menor. Como la opcionalidad NO está especificada, hay que explicar los dos casos: si fuera europea solo podría ejercerse al vencimiento; si fuera americana, en cualquier momento de la vida del producto, con una prima más cara. Conclusión: la estructura es técnicamente correcta y la pérdida máxima está limitada a la prima."}];

function resumenCaso(c){
  if(!c) return '';
  var t = '\nCASO: ' + c.titulo + '\n';
  if(c.datos) c.datos.forEach(function(r){ t += '- '+r[0]+': '+r[1]+'\n'; });
  if(c.filas) c.filas.forEach(function(r){ t += '- '+r.join(' | ')+'\n'; });
  if(c.extra) t += '- '+c.extra+'\n';
  if(c.veredicto) t += 'Veredicto correcto de este caso: '+c.veredicto+'\n';
  return t;
}

    '\nRUBRICA (un criterio por linea):\n'+rub+

  var parsed;

  var nota = 0;
  parsed.criterios.forEach(function(cr){

    if(r && cr.cumple) nota += r.v;
  });

/* ── Persistencia ── */
var KEY = 'm1-stats';
async function load(){
  var raw = null;
  // 1) almacenamiento del entorno Claude
  try{
    var r = await window.storage.get(KEY);
    if(r && r.value) raw = r.value;
  }catch(e){}
  // 2) almacenamiento del navegador (necesario al instalarla en el móvil)
  if(raw === null){
    try{ raw = window.localStorage.getItem(KEY); }catch(e){}
  }
  try{ stats = raw ? JSON.parse(raw) : {}; }catch(e){ stats = {}; }
  if(!stats.q) stats.q = {};
}
async function save(){
  var payload = JSON.stringify(stats), guardado = false;
  try{ await window.storage.set(KEY, payload); guardado = true; }catch(e){}
  try{ window.localStorage.setItem(KEY, payload); guardado = true; }catch(e){}
  memOnly = !guardado;
}

/* ── Utilidades ── */
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }
function idxOf(q){ return BANCO.indexOf(q); }
function rec(q){ return stats.q[idxOf(q)] || {ok:0,ko:0}; }
function falladas(){ return BANCO.filter(function(q){ var r=rec(q); return r.ko>0 && r.ko>=r.ok; }); }
function aciertoBloque(b){
  var qs = BANCO.filter(function(q){return q.b===b;});
  var t=0,o=0;
  qs.forEach(function(q){ var r=rec(q); t+=r.ok+r.ko; o+=r.ok; });
  return t?Math.round(o/t*100):null;
}
function global(){
  var t=0,o=0;
  Object.keys(stats.q).forEach(function(k){ t+=stats.q[k].ok+stats.q[k].ko; o+=stats.q[k].ok; });
  return {t:t,o:o,pct:t?Math.round(o/t*100):null};
}
function cls(p){ return p===null?'':(p<50?'low':(p<75?'mid':'hi')); }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

function eligeTest(soloConf){
  if(soloConf){
    // solo lo que el profesor confirmo que entra
    return shuffle(BANCO.filter(function(q){ return q.f==='prof'; })).slice(0,8);
  }
  // reparto por bloque que imita el peso real, sin priorizar lo confirmado:
  // asi este examen si refleja que el temario entero puede caer
  var porBloque = {1:1, 2:1, 3:2, 4:4};
  var out = [];
  Object.keys(porBloque).forEach(function(b){
    var pool = shuffle(BANCO.filter(function(q){ return q.b===parseInt(b,10) && q.f!=='amp'; }));
    out = out.concat(pool.slice(0, porBloque[b]));
  });
  return shuffle(out).slice(0,8);
}

/* ── Preguntas de desarrollo ── */
function casosDe(d){
  if(d.casos === 'beta') return CASOS_BETA;
  if(d.casos === 'cartera') return CASOS_CARTERA;
  if(d.casos === 'bono') return CASOS_BONO;
  if(d.casos === 'opcion') return CASOS_OPCION;
  if(d.casos === 'repaso') return CASOS_REPASO;
  if(d.casos === 'betacart') return CASOS_BETACART;
  return null;
}
function abrirDev(i){

  pintarDev();
}

/* ── Sesión ── */
function empezar(modo){
  var pool;
  if(modo==='sim') pool = shuffle(BANCO).slice(0,8);
  else if(modo==='conf') pool = shuffle(BANCO.filter(function(q){ return q.f==='prof'; })).slice(0,8);
  else if(modo==='confall') pool = shuffle(BANCO.filter(function(q){ return q.f==='prof'; }));
  else if(modo==='rep') pool = shuffle(falladas()).slice(0,12);
  else pool = shuffle(BANCO.filter(function(q){return q.b===parseInt(modo.slice(1),10);}));
  if(!pool.length){ inicio(); return; }
  sesion = {pool:pool, i:0, res:[], modo:modo};
  pregunta();
}

function pregunta(){
  var s = sesion, q = s.pool[s.i];
  // barajar opciones para que la posición de la correcta no sea predecible
  var pares = q.o.map(function(txt,i){ return {txt:txt, ok:i===q.c}; });
  s.orden = shuffle(pares);

  var h = '<div class="qtop"><button class="back" onclick="salir()">← Salir</button>';
  h += '<span class="counter">'+(s.i+1)+' / '+s.pool.length+'</span></div>';
  h += '<div class="prog"><i style="width:'+(s.i/s.pool.length*100)+'%"></i></div>';
  var og = ORIGEN[q.f] || ORIGEN.temario;
  h += '<div class="tags"><span class="tag">'+BLOQUES[q.b].n+'</span>';
  h += '<span class="orig '+(q.f||'temario')+'">'+og.n+'</span></div>';
  h += '<p class="q">'+esc(q.q)+'</p>';
  if(q.svg) h += '<div class="chart">'+q.svg+'</div>';
  h += '<div class="opts" id="opts">';
  s.orden.forEach(function(p,i){
    h += '<button class="opt" onclick="responder('+i+')"><span class="k">'+'ABCD'[i]+'</span><span>'+esc(p.txt)+'</span></button>';
  });
  h += '</div><div id="fb"></div>';
  document.getElementById('app').innerHTML = h;
  window.scrollTo(0,0);
}

function responder(sel){
  var s = sesion, q = s.pool[s.i], acierto = s.orden[sel].ok;
  var btns = document.querySelectorAll('#opts .opt');
  btns.forEach(function(b,i){
    b.disabled = true;
    if(s.orden[i].ok) b.classList.add('correct');
    else if(i===sel) b.classList.add('wrong');
    else b.classList.add('dim');
  });

  var k = idxOf(q);
  if(!stats.q[k]) stats.q[k] = {ok:0,ko:0};
  stats.q[k][acierto?'ok':'ko']++;
  save();
  s.res.push({q:q, acierto:acierto, eligio:s.orden[sel].txt});

  var f = document.getElementById('fb');
  f.innerHTML = '<div class="fb '+(acierto?'ok':'no')+'">'+
    '<b>'+(acierto?'Correcto':'Incorrecto')+'</b>'+esc(q.e)+
    '<span class="ref">Guía, apartado '+esc(q.r)+'</span>'+
    '<div class="origfb"><b>'+(ORIGEN[q.f]||ORIGEN.temario).n+'.</b> '+(ORIGEN[q.f]||ORIGEN.temario).d+'</div></div>'+
    '<button class="next" onclick="siguiente()">'+(s.i+1<s.pool.length?'Siguiente pregunta':'Ver resultado')+'</button>';
  f.querySelector('.next').scrollIntoView({block:'nearest',behavior:'smooth'});
}

function siguiente(){
  sesion.i++;
  if(sesion.i < sesion.pool.length) pregunta(); else resultado();
}
function salir(){ sesion=null; dev=null; ex=null; inicio(); }

/* ── Resultado ── */
function resultado(){
  var s = sesion, ok = s.res.filter(function(r){return r.acierto;}).length, n = s.res.length;
  var pct = Math.round(ok/n*100), nota = (ok/n*10);
  var aprueba = nota >= 4.5;

  var h = '<div class="qtop"><button class="back" onclick="salir()">← Inicio</button></div>';
  h += '<div class="res"><div class="barlabel">'+ok+' de '+n+' correctas</div>';
  h += '<div class="score" style="color:'+(aprueba?'var(--ok)':'var(--no)')+'">'+nota.toFixed(1)+'</div>';
  h += '<div class="barlabel">sobre 10</div>';
  h += '<div class="verdict '+(aprueba?'pass':'fail')+'">';
  if(pct===100) h += 'Pleno. Este bloque lo tienes.';
  else if(nota>=7) h += 'Buen nivel. Repasa solo lo que fallaste.';
  else if(aprueba) h += 'Superas el 4,5 mínimo, pero con poco margen.';
  else h += 'Por debajo del 4,5 que exige Francisco para promediar.';
  h += '</div></div>';

  var fallos = s.res.filter(function(r){return !r.acierto;});
  if(fallos.length){
    h += '<h2 class="sec">Lo que has fallado</h2>';
    fallos.forEach(function(r){
      h += '<div class="review"><div class="rq">'+esc(r.q.q)+'</div>';
      h += '<div class="ra"><i>Tu respuesta:</i> '+esc(r.eligio)+'</div>';
      h += '<div class="ra"><i>Correcta:</i> <b>'+esc(r.q.o[r.q.c])+'</b></div>';
      h += '<div class="re">'+esc(r.q.e)+' · Guía, apartado '+esc(r.q.r)+' · '+(ORIGEN[r.q.f]||ORIGEN.temario).n+'</div></div>';
    });
  } else {
    h += '<div class="empty">Sin fallos en esta ronda.</div>';
  }
  h += '<button class="next" onclick="empezar(\''+s.modo+'\')">Repetir esta ronda</button>';
  h += '<div class="foot"><a class="reset" href="#" onclick="salir();return false;">Volver al inicio</a></div>';
  document.getElementById('app').innerHTML = h;
  window.scrollTo(0,0);
}

async function borrar(ev){
  ev.preventDefault();
  stats = {q:{},dev:{},txt:{},ex:[]};
  await save();
  inicio();
}

/* ── Arranque ── */
(async function(){ await load(); inicio(); })();
</script>
