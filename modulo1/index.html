<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF0F3; --surface:#FFFFFF; --ink:#16202B; --ink-soft:#5A6875;
  --line:#D3DAE1; --azul:#1F4E79; --azul-soft:#E6EDF4;
  --ok:#1E6B52; --ok-bg:#E4F0EA; --no:#A3312C; --no-bg:#F7E7E6;
  --amber:#B8791F; --amber-bg:#FBF0DE;
  --r:10px; --shadow:0 1px 2px rgba(22,32,43,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:'IBM Plex Sans',system-ui,sans-serif;
  font-size:16px; line-height:1.5;
  padding-top:calc(env(safe-area-inset-top) + 4px);
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 40px}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:2.5px solid var(--azul);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ── Cabecera ── */
header{padding:22px 0 14px}
.brand{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.brand h1{font-family:'Source Serif 4',Georgia,serif;font-size:25px;font-weight:600;margin:0;letter-spacing:-.01em}
.brand span{font-size:13px;color:var(--ink-soft)}

/* ── Panel de progreso general ── */
.stats{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:22px}
.stats-top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px}
.big{font-family:'Source Serif 4',serif;font-size:38px;font-weight:600;line-height:1}
.big small{font-size:16px;color:var(--ink-soft);font-weight:400}
.stats-note{font-size:13px;color:var(--ink-soft);text-align:right;max-width:190px}
.bars{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.barrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;font-size:13.5px}
.barlabel{color:var(--ink-soft)}
.track{grid-column:1/-1;height:6px;background:var(--paper);border-radius:3px;overflow:hidden}
.fill{height:100%;background:var(--azul);border-radius:3px;transition:width .45s ease}
.fill.low{background:var(--no)} .fill.mid{background:var(--amber)} .fill.hi{background:var(--ok)}

/* ── Modos ── */
h2.sec{font-size:13px;font-weight:600;color:var(--ink-soft);margin:0 0 10px;letter-spacing:.01em}
.modes{display:flex;flex-direction:column;gap:9px;margin-bottom:22px}
.mode{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;box-shadow:var(--shadow);transition:border-color .15s,transform .08s}
.mode:hover{border-color:var(--azul)}
.mode:active{transform:scale(.993)}
.mode-t{display:block;font-weight:600;font-size:15.5px;line-height:1.3}
.mode-d{display:block;font-size:13.5px;color:var(--ink-soft);margin-top:3px;line-height:1.35}
.mode-n{margin-left:auto;font-size:13px;color:var(--ink-soft);white-space:nowrap;padding-left:8px}
.mode.primary{background:var(--azul);border-color:var(--azul);color:#fff}
.mode.primary .mode-d,.mode.primary .mode-n{color:#C3D6E6}
.mode[disabled]{opacity:.45;cursor:default}
.mode[disabled]:hover{border-color:var(--line)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}

/* ── Pantalla de pregunta ── */
.qtop{display:flex;align-items:center;gap:12px;padding:18px 0 12px}
.back{font-size:14px;color:var(--ink-soft);padding:6px 2px}
.counter{margin-left:auto;font-size:14px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.prog{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:20px}
.prog i{display:block;height:100%;background:var(--azul);transition:width .3s ease}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.tag{display:inline-block;font-size:12.5px;color:var(--azul);background:var(--azul-soft);padding:3px 9px;border-radius:20px}
.orig{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:3px 9px;border-radius:20px;border:1px solid}
.orig.prof{color:#7A4A00;background:var(--amber-bg);border-color:#E0BE84}
.orig.clase{color:var(--ok);background:var(--ok-bg);border-color:#A8CFBF}
.orig.temario{color:var(--ink-soft);background:var(--paper);border-color:var(--line)}
.orig.amp{color:var(--ink-soft);background:var(--paper);border-color:var(--line)}
.origfb{font-size:13px;color:var(--ink-soft);margin-top:9px;padding-top:9px;border-top:1px solid rgba(22,32,43,.12);line-height:1.5}
.legend{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;box-shadow:var(--shadow);margin-bottom:22px;font-size:13.5px;line-height:1.55;color:var(--ink-soft)}
.legend b{color:var(--ink)}
.legend .row{display:flex;gap:9px;align-items:flex-start;margin-top:9px}
.q{font-family:'Source Serif 4',Georgia,serif;font-size:20.5px;line-height:1.4;font-weight:600;margin:0 0 20px;letter-spacing:-.005em}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:14px;font-size:15.5px;line-height:1.45;transition:border-color .15s,background .15s}
.opt:hover:not([disabled]){border-color:var(--azul)}
.opt .k{flex:none;width:25px;height:25px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--ink-soft)}
.opt[disabled]{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.correct .k{border-color:var(--ok);background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--no);background:var(--no-bg)}
.opt.wrong .k{border-color:var(--no);background:var(--no);color:#fff}
.opt.dim{opacity:.5}


/* ── Gráfico en pregunta ── */
.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 6px;margin:0 0 18px;box-shadow:var(--shadow)}

/* ── Casos de desarrollo ── */
.caso{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-top:12px}
.caso h5{font-size:14px;font-weight:600;margin:0 0 10px;color:var(--azul)}
.dtab{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:10px}
.dtab td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.dtab tr:last-child td{border-bottom:none}
.dtab td:first-child{color:var(--ink-soft)}
.dtab td:last-child{text-align:right;font-weight:600;white-space:nowrap}
.dtab.c td:last-child{text-align:left;font-weight:400;white-space:normal}
.dtab.c td:nth-child(2){text-align:right;font-weight:600;white-space:nowrap}
.extra{font-size:13.5px;margin-top:11px;padding-top:10px;border-top:1px solid var(--line);color:var(--ink)}
.swap{width:100%;background:var(--surface);border:1.5px solid var(--azul);color:var(--azul);border-radius:var(--r);padding:12px;font-weight:600;font-size:14.5px;margin-top:10px}
.verd{display:inline-block;font-size:13px;font-weight:600;padding:4px 11px;border-radius:20px;margin-bottom:9px}
.lect{background:var(--ok-bg);border-left:4px solid var(--ok);border-radius:var(--r);padding:14px;font-size:14.5px;line-height:1.6;margin-top:12px}
.lect b{display:block;margin-bottom:6px}

/* ── Desarrollo ── */
.dev-enun{font-family:'Source Serif 4',Georgia,serif;font-size:18.5px;line-height:1.5;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--azul);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);white-space:pre-line}
.src{font-size:12.5px;color:var(--azul);background:var(--azul-soft);padding:3px 9px;border-radius:20px;display:inline-block;margin-bottom:11px}
.warn{background:var(--amber-bg);border-left:4px solid var(--amber);border-radius:var(--r);padding:13px 14px;font-size:14px;line-height:1.5;margin-top:14px}
.model{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px 16px 14px;margin-top:12px;box-shadow:var(--shadow)}
.model h4{font-size:13.5px;color:var(--azul);margin:15px 0 5px;font-weight:600}
.model p{margin:0;font-size:14.5px;line-height:1.55}
.rub{display:flex;gap:11px;align-items:flex-start;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:13px;margin-bottom:8px;width:100%;text-align:left;font-size:14.5px;line-height:1.45;transition:border-color .15s,background .15s}
.rub .box{flex:none;width:22px;height:22px;border-radius:5px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;color:transparent;margin-top:1px}
.rub.on{border-color:var(--ok);background:var(--ok-bg)}
.rub.on .box{background:var(--ok);border-color:var(--ok);color:#fff}
.rub .pts{margin-left:auto;font-size:12.5px;color:var(--ink-soft);white-space:nowrap;padding-left:6px}
.devscore{position:sticky;bottom:0;background:var(--paper);padding:12px 0 6px;margin-top:6px}



/* ── Modo examen ── */
.exhead{display:flex;align-items:center;gap:10px;padding:18px 0 10px}
.exhead .cn{margin-left:auto;font-size:13.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:12px;background:var(--azul);color:#fff;padding:3px 10px;border-radius:20px;font-weight:600}
.onote{background:var(--amber-bg);border-left:4px solid var(--amber);border-radius:var(--r);padding:13px 14px;font-size:14px;line-height:1.5;margin-bottom:16px}
.exgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.exc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:center;box-shadow:var(--shadow)}
.exc .v{font-family:'Source Serif 4',serif;font-size:27px;font-weight:600;line-height:1.1}
.exc .l{font-size:12.5px;color:var(--ink-soft);margin-top:4px}
.hist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);font-size:14px}
.hist .hn{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.minirev{font-size:13.5px;line-height:1.5;padding:10px 0;border-bottom:1px solid var(--line)}
.minirev:last-child{border-bottom:none}
.minirev .mk{font-weight:700;margin-right:6px}

/* ── Redacción de respuestas ── */
.wbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-top:12px}
.wbox label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:8px}
textarea{width:100%;min-height:190px;font-family:'Source Serif 4',Georgia,serif;font-size:15.5px;line-height:1.55;color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:12px;resize:vertical;background:#fff;-webkit-appearance:none}
textarea:focus{outline:none;border-color:var(--azul)}
.wmeta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-soft);margin-top:7px}
.btnrow{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.btn2{flex:1;min-width:140px;background:var(--surface);border:1.5px solid var(--azul);color:var(--azul);border-radius:var(--r);padding:12px;font-weight:600;font-size:14.5px;text-align:center}
.btn2.solid{background:var(--azul);color:#fff}
.btn2[disabled]{opacity:.5}
.corr{margin-top:14px}
.crit{display:flex;gap:10px;align-items:flex-start;border-radius:var(--r);padding:12px;margin-bottom:8px;font-size:14px;line-height:1.5;border-left:4px solid}
.crit.si{background:var(--ok-bg);border-color:var(--ok)}
.crit.no{background:var(--no-bg);border-color:var(--no)}
.crit .mark{flex:none;font-weight:700;font-size:15px}
.crit .ct{font-weight:600;display:block;margin-bottom:3px}
.crit .cc{color:var(--ink-soft);font-size:13.5px}
.resumen{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;font-size:14.5px;line-height:1.55;margin-top:10px;box-shadow:var(--shadow)}
.spin{text-align:center;color:var(--ink-soft);font-size:14px;padding:20px}
.hint{font-size:12.5px;color:var(--ink-soft);margin-top:9px;line-height:1.5}

/* ── Feedback ── */
.fb{margin-top:18px;border-radius:var(--r);padding:15px;border-left:4px solid;font-size:14.5px;line-height:1.55}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)}
.fb.no{background:var(--no-bg);border-color:var(--no)}
.fb b{display:block;margin-bottom:5px;font-size:15px}
.fb .ref{display:block;margin-top:11px;font-size:13px;color:var(--ink-soft)}
.next{width:100%;background:var(--azul);color:#fff;border-radius:var(--r);padding:15px;font-weight:600;font-size:16px;margin-top:16px;transition:opacity .15s}
.next:active{opacity:.85}

/* ── Resultado ── */
.res{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px 20px;text-align:center;box-shadow:var(--shadow);margin:14px 0 20px}
.score{font-family:'Source Serif 4',serif;font-size:60px;font-weight:600;line-height:1;margin:6px 0}
.verdict{font-size:15.5px;margin-top:10px;line-height:1.5}
.verdict.pass{color:var(--ok)} .verdict.fail{color:var(--no)}
.review{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:11px;box-shadow:var(--shadow)}
.review .rq{font-family:'Source Serif 4',serif;font-size:16px;font-weight:600;line-height:1.35;margin-bottom:9px}
.review .ra{font-size:14px;margin-bottom:4px}
.review .ra i{font-style:normal;color:var(--ink-soft)}
.review .re{font-size:13.5px;color:var(--ink-soft);margin-top:8px;line-height:1.5;padding-top:9px;border-top:1px solid var(--line)}
.empty{text-align:center;color:var(--ink-soft);padding:38px 20px;font-size:15px;line-height:1.6}
.foot{text-align:center;font-size:12.5px;color:var(--ink-soft);margin-top:26px;line-height:1.6}
.reset{font-size:13px;color:var(--ink-soft);text-decoration:underline;margin-top:10px;display:inline-block}
</style>
</head>

<script>
var BANCO = [
// ─────────── BLOQUE 1: FUNDAMENTOS (Unidad 1) ───────────
{f:"clase",b:1,q:"¿Cuál es la función principal de los mercados financieros?",o:["La especulación","La financiación","El arbitraje","La cobertura de riesgos"],c:1,e:"Los mercados no fueron diseñados para especular. Las empresas los usan para financiarse o para rentabilizar su excedente de caja. Decir que sirven para especular es un error que el profesor penaliza.",r:"B.1.3"},
{f:"clase",b:1,q:"Las tres características de los activos financieros son:",o:["Liquidez, rentabilidad-riesgo e intangibilidad","Liquidez, solvencia y transparencia","Rentabilidad, plazo y garantía","Amplitud, profundidad y flexibilidad"],c:0,e:"La intangibilidad es la que se conecta con las crisis: al no poder observar el activo, el inversor depende de modelos y ratings. Es el mecanismo de las titulizaciones subprime.",r:"B.1.2"},
{f:"temario",b:1,q:"La variable de un mercado que mide el número de órdenes de compra y venta existentes es:",o:["Amplitud","Transparencia","Profundidad","Flexibilidad"],c:2,e:"Profundidad = número de órdenes, y forma la horquilla del mercado. Amplitud mide el VOLUMEN de activos negociados. Es la confusión más fácil de las cinco variables.",r:"B.1.4"},
{f:"temario",b:1,q:"Se considera oficialmente que hay recesión cuando:",o:["El PIB cae más de un 10%","La tasa de variación del PIB es negativa durante dos trimestres consecutivos","El desempleo supera el 20%","Hay tasas negativas de PIB durante más de tres años"],c:1,e:"Dos trimestres consecutivos de variación negativa del PIB. La caída de más del 10% o las tasas negativas durante más de tres años corresponden a la DEPRESIÓN.",r:"B.2.7"},
{f:"temario",b:1,q:"¿Qué indicador debe usarse para medir el crecimiento real de una economía?",o:["El PIB nominal, porque incorpora los precios corrientes","El PIB real, calculado a precios de un año base","El deflactor del PIB","La demanda nacional"],c:1,e:"El PIB real usa precios constantes de un año base, así que las diferencias entre periodos se deben solo a las CANTIDADES. El nominal incluye la inflación y no refleja el crecimiento real.",r:"B.2.3"},
{f:"clase",b:1,q:"El agregado monetario más líquido es:",o:["M1","M2","M3","El deflactor del PIB"],c:0,e:"M1 incluye billetes, monedas en circulación y depósitos a la vista. Ojo: la más ESTABLE es M3, que el Eurosistema usa como aproximación del dinero en circulación.",r:"B.2.5"},
{f:"temario",b:1,q:"La población en edad de trabajar comprende, según el temario, a las personas entre:",o:["16 y 65 años","18 y 67 años","16 y 67 años","18 y 65 años"],c:2,e:"16 a 67 años. Es un dato fácil de confundir con 16-65, y por eso mismo aparece en tipo test.",r:"B.2.2"},
{f:"temario",b:1,q:"El riesgo de mantener una política FISCAL expansiva de forma prolongada es:",o:["Hiperinflación","Déficit público e incremento de la deuda","Reducción de la masa monetaria","Subida de los tipos de interés del BCE"],c:1,e:"La fiscal expansiva (más gasto público, menos impuestos) genera déficit y deuda. La hiperinflación es el riesgo de la política MONETARIA expansiva prolongada.",r:"B.2.6"},
{f:"temario",b:1,q:"Basilea III se centró principalmente en:",o:["El nivel de reservas para pérdidas bancarias","El riesgo de bank run o pánico bancario","El riesgo operacional","La introducción de los tres pilares"],c:1,e:"Basilea I y II se centraron en el nivel de reservas. Basilea III, tras la crisis de 2008, se centró en el riesgo de pánico bancario. Y no sustituye a las anteriores: las complementa.",r:"B.3.4"},
{f:"temario",b:1,q:"El LCR (Liquidity Coverage Ratio) cubre las salidas de capital durante:",o:["7 días","30 días","90 días","1 año"],c:1,e:"LCR = corto plazo, 30 días. El NSFR es medio y largo plazo, con horizonte de 1 año. Ambos deben mantenerse por encima de 1.",r:"B.1.7"},
{f:"temario",b:1,q:"Los tres pilares de Basilea fueron introducidos por:",o:["Basilea I","Basilea II","Basilea III","El Comité de Basilea en 1975"],c:1,e:"Basilea II (2004) introduce el marco de los tres pilares: requisitos mínimos de capital, refuerzo de la supervisión y transparencia informativa.",r:"B.1.7"},
{f:"temario",b:1,q:"¿Quién supervisa en España los mercados de deuda pública?",o:["La CNMV","El Banco de España","AIAF","BME"],c:1,e:"El Banco de España supervisa la deuda pública (bonos, obligaciones y letras del Tesoro). La CNMV supervisa deuda corporativa, bolsas y el mercado de opciones y futuros.",r:"B.1.6"},
{f:"temario",b:1,q:"El Comité de Basilea:",o:["Puede imponer sus propuestas a los bancos centrales","No tiene autoridad para imponer sus propuestas","Depende directamente del BCE","Solo tiene competencia sobre países del G10"],c:1,e:"El Comité NO tiene autoridad para imponer nada. Sus recomendaciones deben ser implementadas por los bancos centrales de las economías que decidan hacerlo.",r:"B.1.7"},
{f:"prof",b:1,q:"La medida correcta del tamaño de un banco es:",o:["El número de clientes","Los activos totales","La capitalización bursátil","El volumen de depósitos"],c:2,e:"Capitalización bursátil. Francisco dijo literalmente que le gusta preguntarlo. Los seis bancos más grandes del mundo por este criterio son chinos.",r:"B.5.1"},
{f:"temario",b:1,q:"¿Por qué la recuperación tras el COVID-19 fue más rápida que la de 2008?",o:["Porque la perturbación fue endógena al sistema financiero","Porque la perturbación fue exógena, poco relacionada con los mercados","Porque los bancos tenían más reservas","Porque no hubo intervención de los bancos centrales"],c:1,e:"El BCE señala la naturaleza EXÓGENA de la perturbación como primera causa. La crisis de 2008 fue endógena al sistema financiero, y por eso su recuperación fue mucho más lenta.",r:"B.4.1"},

// ─────────── BLOQUE 2: MERCADOS Y PRODUCTOS (Unidad 2) ───────────
{f:"prof",b:2,q:"En la clasificación académica, ¿qué productos pertenecen al mercado monetario?",o:["Renta fija, renta variable y derivados","Depósitos y repos, FRAs y forex","Acciones y bonos corporativos","Fondos de inversión y ETFs"],c:1,e:"Mercado monetario: depósitos y repos, FRAs, forex. Mercado de capitales: renta fija, renta variable, derivados. Es la base de la pregunta de desarrollo confirmada.",r:"B.1.5"},
{f:"temario",b:2,q:"¿Por qué las materias primas se consideran activos refugio?",o:["Porque tienen flujos de efectivo estables","Porque no tienen flujos de efectivo que descontar, así que su precio depende solo de oferta y demanda","Porque están garantizadas por los bancos centrales","Porque cotizan en mercados regulados"],c:1,e:"Al no tener flujos que descontar, su precio es pura oferta y demanda. Eso hace que su covarianza con los mercados financieros sea muy pequeña, de ahí su papel de refugio.",r:"D.1"},
{f:"temario",b:2,q:"La forma MÁS HABITUAL de invertir en materias primas es:",o:["La compra física al contado","A futuro, mediante derivados sobre la materia prima","Comprando acciones de empresas del sector","A través de fondos indexados"],c:1,e:"La compra física tiene el inconveniente de la logística de entrega y el almacenaje. Por eso lo habitual son los derivados sobre la propia materia prima.",r:"D.1"},
{f:"temario",b:2,q:"En un REPO:",o:["Se adquiere la plena disponibilidad de los valores","No se transmite la tenencia: funciona como un alquiler","Se transmiten todos los derechos del título de forma definitiva","Solo pueden participar entidades de crédito"],c:1,e:"El repo es un alquiler del rendimiento: el nuevo tenedor se beneficia del rendimiento pero NUNCA llega a ser propietario. En la operación simultánea sí se adquiere la plena disponibilidad.",r:"D.2.3"},
{f:"temario",b:2,q:"El límite de plazo del mercado monetario de renta fija según el temario es:",o:["12 meses","18 meses","24 meses","6 meses"],c:1,e:"Hasta 18 meses. Es fácil de confundir con 12 meses, y por eso se pregunta.",r:"D.2.2"},
{f:"temario",b:2,q:"El mercado financiero más grande del mundo por volumen negociado es:",o:["La bolsa de Nueva York","El mercado de renta fija","El mercado de divisas (FOREX)","El mercado de derivados de Chicago"],c:2,e:"El FOREX, que además es un mercado OTC (no organizado) y abre 24 horas al día de domingo a viernes. El dólar interviene en el 87% de las negociaciones mundiales.",r:"D.3"},
{f:"temario",b:2,q:"El IBEX 35 pondera sus valores según:",o:["El volumen de negociación diario","La capitalización bursátil","El beneficio neto de cada empresa","El número de accionistas"],c:1,e:"Se compone de los 35 valores del mercado continuo con mayor liquidez durante el periodo de control, ponderados por capitalización bursátil.",r:"D.4.2"},
{f:"clase",b:2,q:"En una cámara de contrapartida, las partes de una operación:",o:["Se obligan entre ellas directamente","Se obligan con la cámara, que elimina el riesgo de contraparte","Se obligan con el regulador","No contraen obligación hasta el vencimiento"],c:1,e:"La Entidad de Contrapartida Central actúa de comprador para los vendedores y de vendedor para los compradores. Por eso en un mercado organizado no hay riesgo de contraparte, y en el OTC sí.",r:"D.5.1"},
{f:"temario",b:2,q:"¿Cómo se calcula el valor liquidativo de un fondo de inversión?",o:["Patrimonio neto diario dividido entre el número de participaciones","Precio de mercado por número de acciones","Suma de los activos menos las comisiones de gestión","Media de las cotizaciones del periodo"],c:0,e:"Patrimonio neto valorado diariamente entre el número de participaciones. Punto que se olvida: ese número CAMBIA con el tiempo, porque el fondo emite y recompra participaciones.",r:"D.6.4"},
{f:"temario",b:2,q:"El inversor de un Fondo de Inversión se denomina:",o:["Accionista","Partícipe","Socio","Bonista"],c:1,e:"Partícipe en los fondos; accionista en las Sociedades de Inversión. Los fondos no tienen personalidad jurídica propia: son un patrimonio común.",r:"D.6.4"},
{f:"temario",b:2,q:"Las SICAV tributan en el Impuesto de Sociedades al:",o:["0%","1%","15%","25%"],c:1,e:"Al 1%, frente al tipo general del 25%. Eso les permite reinvertir lo no pagado en impuestos, aunque los accionistas tributarán al vender.",r:"D.6.3"},
{f:"temario",b:2,q:"El traspaso entre fondos de inversión:",o:["Genera obligación fiscal inmediata","No genera obligación fiscal, salvo en ETFs","Tributa al 1%","Solo tributa si hay ganancia superior a 6.000 €"],c:1,e:"Hay diferimiento: solo se tributa al vender sin traspasar. La excepción son los ETFs o fondos cotizados, que no disfrutan de este beneficio.",r:"D.6.3"},
{f:"temario",b:2,q:"El alto riesgo de un hedge fund se explica principalmente por:",o:["Su riesgo de mercado o sistemático","Su riesgo idiosincrático","Su beta elevada frente al índice","Su falta de liquidez"],c:1,e:"Sus inversiones tienen poca correlación con los mercados tradicionales, luego beta baja, luego el riesgo no viene del mercado sino de lo idiosincrático. Riesgo total = mercado + idiosincrático.",r:"D.7.2"},
{f:"temario",b:2,q:"La aportación mínima habitual a un hedge fund es:",o:["Más de 50.000 USD","Más de 100.000 USD","Más de 250.000 USD","Más de 1.000.000 USD"],c:2,e:"Más de 250.000 USD. No están destinados al público general sino a inversores cualificados.",r:"D.7.1"},
{f:"temario",b:2,q:"¿Cuál de estos NO es un tipo de Private Equity?",o:["Venture Capital","Leveraged Buyout","Distressed Debt","Matched Principal Trading"],c:3,e:"El matched principal trading es una operativa de mercado regulada por MiFID II, no una modalidad de Private Equity. Venture Capital = empresas nuevas; LBO = compra apalancada; Distressed Debt = empresas en dificultad.",r:"D.8.3"},
{f:"temario",b:2,q:"En España, más del 99% de las empresas son PYMES. El mercado creado para ellas es:",o:["El SIBE","El MaB (Mercado Alternativo Bursátil)","AIAF","MEFF"],c:1,e:"El MaB les permite financiarse, ganar visibilidad y dar liquidez a sus accionistas. En él cotizan SICAVs, SOCIMIs, entidades de capital riesgo y hedge funds.",r:"D.4.4"},
{f:"temario",b:2,q:"La sociedad rectora del mercado español de derivados es:",o:["BME Clearing","MEFF Exchange","AIAF","La CNMV"],c:1,e:"MEFF Exchange es la sociedad rectora; BME Clearing es la cámara de contrapartida. Ambas pertenecen a BME. La CNMV es el supervisor, no la rectora.",r:"D.5.1"},

// ─────────── BLOQUE 3: MiFID (Unidades 3, 4 y 5) ───────────
{f:"prof",b:3,q:"Una acción muy volátil que cotiza en un mercado regulado es:",o:["Compleja y de alto riesgo","No compleja y de alto riesgo","Compleja y de bajo riesgo","No compleja y de bajo riesgo"],c:1,e:"Complejidad = dificultad de comprensión. Riesgo = volatilidad o beta. Son conceptos distintos: una acción es entendible (luego no compleja) pero puede ser muy volátil (luego de alto riesgo).",r:"H.2"},
{f:"prof",b:3,q:"El principio de solo ejecución requiere:",o:["Que el producto sea no complejo, únicamente","Que sea por iniciativa del cliente, únicamente","Iniciativa del cliente Y producto no complejo","Test de conveniencia previo con resultado positivo"],c:2,e:"Son dos condiciones acumulativas. Si falta cualquiera de las dos, hay que hacer el test de conveniencia previo.",r:"I.3"},
{f:"prof",b:3,q:"Si el test de CONVENIENCIA da resultado negativo y el cliente insiste:",o:["No se puede ejecutar la operación","Se advierte al cliente y, si insiste, se ejecuta","Hay que hacer además el test de idoneidad","Se ejecuta solo si el cliente es profesional"],c:1,e:"En conveniencia el cliente puede insistir y se ejecuta. En IDONEIDAD un resultado negativo bloquea: no se presta el servicio. Es la diferencia decisiva entre ambos.",r:"I.3"},
{f:"prof",b:3,q:"El test de IDONEIDAD requiere, además de conocimientos y experiencia:",o:["Solo la situación financiera","Solo los objetivos de inversión","Situación financiera y objetivos de inversión","Únicamente el perfil de riesgo asignado"],c:2,e:"Idoneidad = conveniencia + situación financiera + objetivos. Si en una pregunta aparece patrimonio, ingresos, duración prevista o finalidad, la respuesta es idoneidad.",r:"I.2"},
{f:"prof",b:3,q:"Las PYMES, según la clasificación de clientes de MiFID II, son:",o:["Clientes profesionales","Clientes minoristas","Contrapartes elegibles","Clientes no MiFID"],c:1,e:"Son minoristas, junto con los particulares. Es contraintuitivo porque son empresas, pero tienen la mayor protección normativa.",r:"G.2"},
{f:"prof",b:3,q:"La contraparte elegible es:",o:["Una categoría independiente con protección intermedia","Un subgrupo de los clientes profesionales, con la menor protección","Un subgrupo de los minoristas","Sinónimo de cliente no MiFID"],c:1,e:"Es un SUBGRUPO dentro de los profesionales: entidades de crédito, aseguradoras, gestoras y empresas de inversión. Tienen la menor protección.",r:"G.2"},
{f:"prof",b:3,q:"Cambiar de categoría de cliente es:",o:["Igual de sencillo en ambos sentidos","Más sencillo hacia mayor protección que hacia menor","Más sencillo hacia menor protección","Imposible una vez asignada"],c:1,e:"El sistema está diseñado para proteger, así que renunciar a protección exige más requisitos que solicitarla.",r:"G.2"},
{f:"prof",b:3,q:"¿Cuál de estos productos MiFID es COMPLEJO?",o:["Las acciones","Los pagarés","La deuda subordinada","La deuda pública en general"],c:2,e:"Complejos: deuda subordinada, participaciones preferentes, derivados y fondos NO armonizados. No complejos: acciones, pagarés, deuda pública y fondos armonizados.",r:"H.2"},
{f:"prof",b:3,q:"Los planes de pensiones y los seguros NO son productos MiFID porque:",o:["No buscan proteger al cliente","Están regulados por normativa específica: Directiva de Mediación de Seguros y DGSFP","Son productos de bajo riesgo","No se comercializan en entidades financieras"],c:1,e:"Sí se busca protección, pero por otra vía normativa. A nivel europeo la Directiva de Mediación de Seguros y en España la DGSFP.",r:"H.1"},
{f:"temario",b:3,q:"Los SOC (Sistemas Organizados de Contratación) fueron creados por:",o:["MiFID I, y negocian acciones","MiFID II, y negocian acciones y bonos","MiFID II, y NO negocian acciones","MiFIR, y solo negocian derivados"],c:2,e:"Figura nueva de MiFID II. Negocian bonos y obligaciones, titulizaciones, derechos de emisión y derivados. Los SMN los creó MiFID I. La ausencia de acciones es la diferencia material.",r:"F.1"},
{f:"temario",b:3,q:"Un Internalizador Sistemático es:",o:["Una plataforma de negociación creada por MiFID II","Una empresa que ejecuta órdenes de clientes con su capital propio","La cámara de compensación de un mercado regulado","Un creador de mercado autorizado"],c:1,e:"NO es una plataforma de negociación. Negocia por cuenta propia de forma organizada, frecuente, sistemática y sustancial, al ejecutar órdenes al margen de RM, SMN o SOC.",r:"F.3"},
{f:"temario",b:3,q:"MiFID II es una directiva y MiFIR un reglamento. Esto significa que:",o:["Ambos requieren transposición nacional","La directiva requiere transposición; el reglamento es de aplicación directa","El reglamento requiere transposición; la directiva no","Ninguno de los dos requiere transposición"],c:1,e:"Ambos se aprobaron el 16 de abril de 2014 y son aplicables desde el 3 de enero de 2018, pero la directiva necesita transposición a la normativa nacional.",r:"E.6"},
{f:"temario",b:3,q:"MiFID II entró en vigor el:",o:["16 de abril de 2014","1 de enero de 2007","3 de enero de 2018","16 de diciembre de 2010"],c:2,e:"Aprobada el 16 de abril de 2014, en vigor el 3 de enero de 2018. MiFID I fue aprobada en 2004 y entró en vigor en 2007.",r:"E.2"},
{f:"temario",b:3,q:"¿En cuál de estos supuestos se PROHÍBE cobrar incentivos?",o:["Comercialización de productos de terceros con valor añadido","Asesoramiento no independiente con valor añadido justificado","Asesoramiento independiente","Cualquier operación con clientes profesionales"],c:2,e:"Se prohíben en asesoramiento INDEPENDIENTE (arquitectura abierta) y en gestión discrecional de carteras. Es contraintuitivo: independiente significa que no puede estar retribuido por el emisor.",r:"J.2"},
{f:"temario",b:3,q:"El plazo mínimo de conservación de registros de conversaciones con clientes es:",o:["3 años, ampliable a 5","5 años, ampliable a 7","7 años, ampliable a 10","1 año desde la operación"],c:1,e:"Mínimo 5 años, ampliable a 7 por la autoridad competente. Y se registran incluso las conversaciones que NO acaban en operación.",r:"J.3"},
{f:"temario",b:3,q:"En una venta cruzada, el producto principal se denomina:",o:["Primario","Matriz","Base","Subyacente"],c:0,e:"El principal es el PRIMARIO y los que lo complementan son SECUNDARIOS. MiFID II obliga a informar de la posibilidad de contratarlos por separado y de sus costes.",r:"J.1"},
{f:"temario",b:3,q:"El transaction reporting exige comunicar las transacciones:",o:["En tiempo real","Como muy tarde un día después del cierre","Semanalmente","Al final de cada mes"],c:1,e:"Un día después del cierre como máximo. Lo planteó MiFID I y MiFID II lo mantiene y amplía, exigiendo datos completos y exactos.",r:"F.8"},
{f:"prof",b:3,q:"La Orden que obliga a clasificar los productos según su riesgo es:",o:["ECC/2316/2015, de 4 de noviembre","La Directiva 2004/39/CE","El Reglamento MiFIR","La Ley del Mercado de Valores"],c:0,e:"Orden ECC/2316/2015. Establece un indicador de riesgo y, en su caso, alertas por liquidez y complejidad, representados gráficamente.",r:"H.3"},
{f:"temario",b:3,q:"El PASF (Plan de Acción de Servicios Financieros) se basa en:",o:["27 propuestas","35 propuestas","47 propuestas","50 propuestas"],c:2,e:"47 propuestas. Se propuso en el Consejo Europeo de Viena de 1998 y se implementó en 1999. Su medida más relevante fue la Directiva 2004/39/CE, es decir MiFID.",r:"E.1"},
{f:"temario",b:3,q:"¿Quién puede realizar matched principal trading?",o:["Los mercados regulados","Los SMN","Los SOC, con consentimiento previo del cliente","Los internalizadores sistemáticos, sin restricciones"],c:2,e:"Los SOC sí pueden, con consentimiento previo. Los organismos rectores de mercados regulados y los administradores de SMN no pueden.",r:"F.4"},
{f:"temario",b:3,q:"El gobierno de los productos exige que la aprobación previa se base en:",o:["El volumen previsto de ventas","La especificación de clientes finales destinatarios y la coherencia con los riesgos","La rentabilidad esperada del producto","El informe de la agencia de rating"],c:1,e:"Target market y coherencia entre distribución prevista y riesgos del producto. Además, revisiones periódicas para comprobar que sigue siendo apto.",r:"J.6"},

// ─────────── BLOQUE 4: BLOQUE DE CLASE / CUANTITATIVO ───────────
{f:"prof",b:4,q:"En una regresión para calcular la beta, la variable exógena (X) es:",o:["El tiempo","La rentabilidad del activo o cartera","La rentabilidad del índice bursátil de referencia","La tasa libre de riesgo"],c:2,e:"X es siempre el índice de mercado; Y es siempre la rentabilidad del activo. La X NUNCA es el tiempo: es la trampa que el profesor advirtió expresamente para el examen.",r:"Q.1"},
{f:"prof",b:4,q:"En el gráfico de dispersión de una regresión, cada punto representa:",o:["Una empresa del índice","Una observación diaria: rentabilidad del activo frente al índice ese día","Un mes de cotización","La media de rentabilidad del periodo"],c:1,e:"Una observación diaria, es decir un par de valores (X, Y) de un día concreto. El profesor enunció esta pregunta literalmente como pregunta tipo examen.",r:"Q.4"},
{f:"clase",b:4,q:"Una beta de 1,63 significa que el activo es:",o:["Conservador o defensivo","Neutral","Agresivo","De relación inversa con el mercado"],c:2,e:"Beta > 1 es agresiva: más riesgo que el mercado. Se lee así: por un incremento de 1 punto porcentual del índice, el activo crecerá 1,63 veces, asumiendo un 0,63% más de volatilidad.",r:"Q.2"},
{f:"prof",b:4,q:"Beta 0 (el término independiente) representa:",o:["La pendiente de la recta de regresión","El valor de Y cuando X vale 0","El error del modelo","La correlación entre activo y mercado"],c:1,e:"Es el valor de la endógena cuando la exógena es 0: el rendimiento del gestor cuando el mercado no abre. Se conoce como Alfa de Jensen y su referencia es la tasa libre de riesgo.",r:"Q.3"},
{f:"prof",b:4,q:"El término epsilon en Y = β0 + β1X + ε recoge:",o:["El riesgo de mercado","La rentabilidad mínima exigida","Todo lo que el modelo no ha podido explicar","La prima de riesgo del emisor"],c:2,e:"Son los residuos o término de error: lo no explicado por el modelo. Debe ser lo más pequeño posible.",r:"Q.1"},
{f:"clase",b:4,q:"La tasa libre de riesgo de referencia en Europa es:",o:["El bono alemán a 5 años","El bono alemán a 10 años (Bund)","El EURIBOR a 12 meses","El tipo de intervención del BCE"],c:1,e:"El Bund a 10 años, que el profesor destacó como el único bono del planeta que no ha perdido la triple A. Estados Unidos la perdió.",r:"T.4"},
{f:"prof",b:4,q:"Según el criterio fijado en clase, hay correlación FUERTE cuando Pearson es:",o:["Mayor o igual a 0,60","Mayor o igual a 0,70","Mayor o igual a 0,80","Igual a 1"],c:2,e:"Fuerte ≥ 0,80; débil entre 0,60 y 0,79; ausencia por debajo de 0,60. Correlación fuerte significa que los activos NO diversifican bien la cartera.",r:"Q.5"},
{f:"clase",b:4,q:"En la matriz de correlaciones, la diagonal principal:",o:["Vale siempre 0","Vale siempre 1","Depende de la volatilidad de cada activo","Es la media de las correlaciones"],c:1,e:"Siempre 1, porque un activo está perfectamente correlacionado consigo mismo. Además es una matriz simétrica o espejo.",r:"Q.5"},
{f:"clase",b:4,q:"Una curtosis leptocúrtica (coeficiente ≈ 3) indica:",o:["Riesgo alto y datos dispersos","Riesgo bajo y datos concentrados en la media","Riesgo medio","Ausencia de riesgo"],c:1,e:"Leptocúrtica = campana, datos cerca de la media, riesgo BAJO. Es el objetivo deseable. Platicúrtica (cercana a 0 o negativa) es dispersa y de riesgo ALTO.",r:"P.3"},
{f:"clase",b:4,q:"Una asimetría POSITIVA en las rentabilidades de una cartera es:",o:["Buena para el inversor","Mala para el inversor","Indiferente","Señal de distribución simétrica"],c:1,e:"Contraintuitivo: la asimetría positiva es MALA, porque significa que la media ha estado por debajo de lo esperado. La NEGATIVA es la buena.",r:"P.2"},
{f:"clase",b:4,q:"El número mínimo de días para que un análisis estadístico de acciones sea representativo es:",o:["30 días","90 días","250 días","365 días"],c:2,e:"250 días, que es un año bursátil (días hábiles, excluidos festivos y fines de semana). El profesor lo dijo corrigiendo a un alumno que usó solo 30 días.",r:"P.4"},
{f:"prof",b:4,q:"El método de valoración de un bono es:",o:["La capitalización compuesta","El descuento de flujos de caja mediante el VAN","La comparación con bonos similares del mercado","El modelo de Black-Scholes"],c:1,e:"Descuento de flujos. El precio es la suma de los flujos futuros descontados, y en el último periodo el flujo es el cupón MÁS el nominal.",r:"M.5"},
{f:"clase",b:4,q:"Un bono perpetuo se valora como:",o:["Cupón anual dividido entre la tasa de descuento","Suma de los cupones más el nominal descontado","Nominal por (1 + r) elevado a n","No es posible valorarlo"],c:0,e:"P = Cupón anual / r. Como paga cupón indefinidamente pero nunca devuelve el nominal, la suma infinita converge a la fórmula de la renta perpetua.",r:"N.2"},
{f:"clase",b:4,q:"Si suben los tipos de interés, el precio de un bono:",o:["Sube, porque paga más cupón","Baja, porque aumenta el denominador del descuento","No varía si se mantiene a vencimiento","Depende del rating del emisor"],c:1,e:"Relación inversa: al subir r, crece el denominador y el valor actual cae. Los inversores venden renta fija y se pasan a renta variable.",r:"B.4.2"},
{f:"clase",b:4,q:"En el mercado OTC se negocian únicamente:",o:["Futuros, forwards y opciones","Forwards, opciones y swaps","Futuros y opciones","Swaps y futuros"],c:1,e:"Solo tres: forwards, opciones y swaps. Los FUTUROS quedan fuera porque son productos estandarizados de mercados organizados. Esa es la diferencia esencial futuro/forward.",r:"S.1"},
{f:"clase",b:4,q:"¿Cuál de estas afirmaciones sobre el FORWARD es correcta?",o:["Exige desembolso inicial y no tiene riesgo de impago","No exige desembolso, tiene riesgo de impago y es más caro que el futuro","Sus pérdidas se limitan a la prima pagada","Se negocia en mercados organizados con cámara"],c:1,e:"A medida + sin desembolso + con riesgo de impago = comisión más alta. Las pérdidas de un forward o futuro son ILIMITADAS; solo la opción comprada limita la pérdida a la prima.",r:"T.1"},
{f:"clase",b:4,q:"En un futuro, la contraparte de la operación es:",o:["La otra parte del contrato","La cámara de compensación","El regulador del mercado","El creador de mercado"],c:1,e:"En el futuro la contraparte es la cámara, que garantiza el pago. En el forward la contraparte es quien crea el derivado, es decir la posición vendedora.",r:"T.1"},
{f:"clase",b:4,q:"Un non-delivery forward es aquel en que:",o:["Ninguna parte cumple la obligación","No hay entrega física porque el subyacente no la tiene, como los tipos de interés","No se paga comisión","El vencimiento es indefinido"],c:1,e:"Un tipo de interés no tiene forma física. El delivery forward sí implica entrega física (petróleo, por ejemplo) y por eso resulta más caro, por logística y almacenaje.",r:"T.2"},
{f:"clase",b:4,q:"Usted tiene una posición larga en acciones y teme una caída. Debe contratar:",o:["Una opción CALL","Una opción PUT","Un futuro comprador","Más acciones para promediar"],c:1,e:"Para cubrir se toma SIEMPRE la posición contraria. Larga + temor a caída = PUT. Si estuviera en corto y temiera una subida, sería una CALL.",r:"T.5.2"},
{f:"clase",b:4,q:"Una opción europea puede ejercerse:",o:["En cualquier momento hasta el vencimiento","Únicamente en la fecha de vencimiento","Solo durante el primer mes","Solo si el subyacente cotiza en Europa"],c:1,e:"Europea: solo a vencimiento. Americana: durante toda la vida del producto, y es más cara. Si el examen no lo especifica, hay que explicar ambos casos.",r:"T.5.4"},
{f:"clase",b:4,q:"¿Qué opcionalidad es más cara?",o:["La europea","La americana","Cuestan lo mismo","Depende del subyacente"],c:1,e:"La americana, por su mayor flexibilidad. El profesor recomendó usarla en subyacentes de mayor riesgo y volatilidad: no arriesgarse por ahorrar un poco de prima.",r:"T.5.4"},
{f:"clase",b:4,q:"Al cubrir una posición con una opción, el profesor recomienda que el nominal de la opción sea:",o:["Igual al de la posición cubierta","Mayor al de la posición cubierta","Menor al de la posición cubierta","Indiferente"],c:2,e:"Coberturas PARCIALES, nunca perfectas. La proporción refleja el grado de convicción en el activo, igual que en el hedge.",r:"T.5.3"},
{f:"clase",b:4,q:"El principio de suma cero en el mercado de opciones establece que:",o:["El comprador y el vendedor ganan lo mismo","La posición compradora de una CALL es inversamente proporcional a la posición vendedora que la creó","La prima siempre iguala al strike","No puede haber pérdidas netas en el mercado"],c:1,e:"El profesor insistió en VERIFICARLO: el banco puede haber calculado mal el spot, el strike o haberlo apuntado mal. Hay que contrastar que se cumpla.",r:"T.5.5"},
{f:"clase",b:4,q:"En renta variable, el beneficio ordinario de una acción procede de:",o:["Comprar barato y vender caro","Los dividendos","El derecho de voto en junta","La revalorización diaria de la cotización"],c:1,e:"El profesor fue tajante: decir que se gana comprando barato y vendiendo caro es lo que venden los influencers. El beneficio ordinario es el dividendo, normalmente anual.",r:"O.1"},
{f:"clase",b:4,q:"La diferencia entre una OPS y una OPV es que:",o:["En la OPS se venden acciones existentes","En la OPS se emiten acciones nuevas y hay dilución","En la OPV se emiten acciones nuevas","No hay diferencia práctica"],c:1,e:"OPS o ampliación de capital: se CREAN acciones nuevas, hay dilución del porcentaje de los antiguos accionistas. OPV: se VENDEN acciones ya existentes, sin dilución.",r:"O.2"},
{f:"clase",b:4,q:"Las tres formas de mitigar el riesgo según el profesor son:",o:["Diversificación, hedge y cobertura con derivados","Diversificación, apalancamiento y arbitraje","Hedge, especulación y arbitraje","Seguros, avales y garantías"],c:0,e:"Diversificación (activos poco correlacionados), hedge (posición inversa en menor proporción) y cobertura con derivados (futuros, forwards, opciones y swaps).",r:"R.4"},
{f:"clase",b:4,q:"Una posición corta (short):",o:["Entra en el balance y exige desembolso","No entra en el balance ni exige desembolso de capital","Solo pueden tomarla las entidades de crédito","Equivale a comprar el activo a plazo"],c:1,e:"Que no entre en balance es la clave contable y la razón de su eficiencia como herramienta. La posición larga sí entra en balance y sí desembolsa capital.",r:"R.3"},
{f:"clase",b:4,q:"El eje X de la curva de tipos (ETTI) representa:",o:["La rentabilidad","El tiempo o plazo de vencimiento","El volumen negociado","El rating del emisor"],c:1,e:"X = tiempo, Y = rentabilidad. Y son tipos INTERBANCARIOS: los que se intercambian las entidades entre sí, no el tipo aplicado al cliente final.",r:"N.1"},
{f:"clase",b:4,q:"Quién fija realmente el precio de cotización de un valor:",o:["Los clientes minoristas por volumen","Los clientes institucionales: bancos, aseguradoras y fondos","El regulador del mercado","La sociedad rectora"],c:1,e:"Los institucionales mueven millones y son quienes fijan el precio. Un minorista con 10.000 euros no afecta al precio de Tesla.",r:"R.2"},
{f:"clase",b:4,q:"Las ponderaciones de los componentes de un índice bursátil se asignan mediante:",o:["Una media aritmética simple","El método de las ponderaciones basado en la curva de Lorenz","El modelo CAPM","La beta de cada componente"],c:1,e:"Curva de Lorenz, el mismo procedimiento estadístico que se usa para el Índice de Gini de desigualdad de renta. Las empresas se eligen por capitalización bursátil.",r:"R.5"}

o porcentual del IBEX, el activo crecerá 0,38 veces, asumiendo un 62% menos de volatilidad que el mercado. Es apta para cualquier tipo de cliente, incluido el minorista sin conocimientos. Beta 0 es +0,12%, positivo y mayor que en el caso anterior: buena aportación del gestor al margen del mercado. El Pearson de 0,61 cae en el tramo de correlación DÉBIL, entre 0,60 y 0,79, así que el activo sí aporta cierta diversificación. El R cuadrado de 0,37 significa que el mercado solo explica el 37% del comportamiento: epsilon es grande y la mayor parte de lo que le ocurre a este activo se debe a factores propios, es decir, riesgo idiosincrático. Conclusión: activo defensivo, buen diversificador, adecuado para un perfil conservador."},{"id":"b3","titulo":"Caso 3 · Activo con relación inversa al índice","svg":"<svg viewBox=\"0 0 340 232\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" style=\"max-width:340px;display:block;margin:0 auto\">\n<defs><clipPath id=\"c303\"><rect x=\"40\" y=\"16\" width=\"288\" height=\"184\"/></clipPath></defs>\n<rect x=\"40\" y=\"16\" width=\"288\" height=\"184\" fill=\"#fff\" stroke=\"#D3DAE1\"/>\n<line x1=\"40\" y1=\"112\" x2=\"328\" y2=\"112\" stroke=\"#D3DAE1\" stroke-dasharray=\"3 3\"/>\n<line x1=\"184\" y1=\"16\" x2=\"184\" y2=\"200\" stroke=\"#D3DAE1\" stroke-dasharray=\"3 3\"/>\n<circle cx=\"203.7\" cy=\"134.9\" r=\"2.5\" fill=\"#1F4E79\" fill-opacity=\".6\"/><circle cx=\"142.7\" cy=\"94.7\" r=\"2.5\" fill=\"#1F4E79\" fill-opacity=\".6\"/><circle cx=\"174.5\" cy=\"112.4\" r=\"2.5\" fill=\"#1F4E79\" fill-opacity=\".6\"/><circle cx=\"168.2\" cy=\"100.3\" r=\"2.5\" fill=\"#1F4E79\" fill-opacity=\".6\"/><circle cx=\"142.6\" cy=\"91.4\" r=\"2.5\" fill=\"#1F4E79\" fill-opacity=\".6\"/><circle cx=\"195.2\" cy=\"130.5\" r=\"2.5\" fill=\"#1F4E79\" fill-opacity=\".6\"/><circle cx=\"188.4\" cy=\"127.8\" r=\"2.5\" fill=\"#1F4E79\" fill-opacity=\".6\"/><circle cx=\"175.3\" cy=\"112.2\" r=\"2.5\" fill=\"#1F4E79\" fill-opacity=\".6\"/><circle cx=\"185 ont-family=\"IBM Plex Sans,sans-serif\">250 sesiones</text>\n</svg>","datos":[["Activo","Fondo con estrategia inversa"],["Índice de referencia","IBEX 35"],["Beta 1 (pendiente)","−0,85"],["Beta 0 (constante)","−0,04%"],["Pearson","−0,72"],["R cuadrado","0,52"],["Observaciones","250 sesiones"]],"lectura":"Beta 1 vale −0,85, es NEGATIVA: existe relación inversa con el mercado. Por un incremento de 1 punto porcentual del IBEX, el activo CAE 0,85 veces; y si el índice cae, el activo sube. Beta 0 es −0,04%, ligeramente negativo: el gestor destruyó algo de valor en las sesiones en que el mercado no operaba. El Pearson de −0,72 indica correlación negativa débil en magnitud, pero lo relevante es el signo: al ser negativa, este activo es un DIVERSIFICADOR EXCELENTE, porque compensa las caídas del resto de la cartera. Conclusión: no es un activo para mantener aislado buscando rentabilidad, sino una herramienta de cobertura. Encaja como contrapeso de una cartera con betas agresivas, y su lógica es la misma que la de tomar la posición contraria para cubrir."},{"id":"b4","titulo":"Caso 4 · Activo con beta neutral y mucha dispersión","svg":"<svg viewBox=\"0 0 340 232\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" style=\"max-width:340px;display:block;margin:0 auto\">\n<defs><clipPath id=\"c404\"><rect x=\"40\" y=\"16\" width=\"288\" height=\"184\"/></clipPath></defs>\n<rect x=\"40\" y=\"16\" width=\"288\" height=\"184\" fill=\"#fff\" stroke=\"#D3DAE1\"/>\n<line x1=\"40\" y1=\"112\" x2=\"328\" y2=\"112\" stroke=\"#D3DAE1\" stroke-dasharray=\"3 3\"/>\n<line x1=\"184\" y1=\"16\" x2=\"184\" y2=\"200\" stroke=\"#D3DAE1\" stroke-dasharray=\"3 3\"/>\n<circle cx=\"200.4\" cy=\"114.0\" r=\"2.5\" fill=\"#1F4E79\" fill-opacity=\".6\"/><circle cx=\"166.4\" cy=\"134.9\" r=\"2.5\" fill=\"#1F4E79\" fill-opacity=\".6\"/><circle cx=\"204.7\" cy=\"77.7\" r=\"2.5\" fill=\"#1F4E79\" fill-opacity=\".6\"/><circle cx=\"148.9\" cy=\"108.4\" r=\"2.5\" fill=\"#1F4E79\" fill-opacity=\".6\"/><circle c "#1F4E79\" fill-opacity=\".6\"/><circle cx=\"132.2\" cy=\"123.3\" r=\"2.5\" fill=\"#1F4E79\" fill-opacity=\".6\"/><circle cx=\"201.8\" cy=\"105.5\" r=\"2.5\" fill=\"#1F4E79\" fill-opacity=\".6\"/><circle cx=\"216.7\" cy=\"103.2\" r=\"2.5\" fill=\"#1F4E79\" fill-opacity=\".6\"/><circle cx=\"222.9\" cy=\"106.8\" r=\"2.5\" fill=\"#1F4E79\" fill-opacity=\".6\"/><circle cx=\"195.3\" cy=\"70.9\" r=\"2.5\" fill=\"#1F4E79\" fill-opacity=\".6\"/><circle cx=\"188.1\" cy=\"119.6\" r=\"2.5\" fill=\"#1F4E79\" fill-opacity=\".6\"/><circle cx=\"219.1\" cy=\"85.9\" r=\"2.5\" fill=\"#1F4E79\" fill-opacity=\".6\"/><circle cx=\"187.2\" cy=\"132.9\" r=\"2.5\" fill=\"#1F4E79\" fill-opacity=\".6\"/><circle cx=\"163.7\" cy=\"96.9\" r=\"2.5\" fill=\"#1F4E79\" fill-opacity=\".6\"/><circle cx=\"198.8\" cy=\"133.6\" r=\"2.5\" fill=\"#1F4E79\" fill-opacity=\".6\"/><circle cx=\"173.0\" cy=\"96.2\" r=\"2.5\" fill=\"#1F4E79\" fill-opacity=\".6\"/><circle cx=\"185.0\" cy=\"127.5\" r=\"2.5\" fill=\"#1F4E79\" fill-opacity=\".6\"/><circle cx=\"183.3\" cy=\"88.9\" r=\"2.5\" fill=\"#1F4E79\" fill-opacity=\".6\"/><circle cx=\"204.3\" cy=\"136.4\" r=\"2.5\" fill=\"#1F4E79\" fill-opacity=\".6\"/><circle cx=\"198.1\" cy=\"123.7\" r=\"2.5\" fill=\"#1F4E79\" fill-opacity=\".6\"/><circle cx=\"226.5\" cy=\"67.9\" r=\"2.5\" fill=\"#1F4E79\" fill-opacity=\".6\"/><circle cx=\"209.7\" cy=\"115.5\" r=\"2.5\" fill=\"#1F4E79\" fill-opacity=\".6\"/><circle cx=\"202.5\" cy=\"89.5\" r=\"2.5\" fill=\"#1F4E79\" fill-opacity=\".6\"/><circle cx=\"218.3\" cy=\"89.5\" r=\"2.5\" fill=\"#1F4E79\" fill-opacity=\".6\"/>\n<g clip-path=\"url(#c404)\"><line x1=\"44.4\" y1=\"197.9\" x2=\"323.6\" y2=\"26.1\" stroke=\"#A3312C\" stroke-width=\"2.1\"/></g>\n<line x1=\"40\" y1=\"200\" x2=\"328\" y2=\"200\" stroke=\"#16202B\" stroke-width=\"1.2\"/>\n<line x1=\"40\" y1=\"16\" x2=\"40\" y2=\"200\" stroke=\"#16202B\" stroke-width=\"1.2\"/>\n<text x=\"184\" y=\"224\" font-size=\"10.5\" fill=\"#5A6875\" text-anchor=\"middle\" font-family=\"IBM Plex Sans,sans-serif\">Rentabilidad diaria del IBEX 35 (%)</text>\n<text x=\"12\" y=\"108\" font-size=\"10.5\" fill=\"#5A6875\" text-anchor=\"middle\" font-family=\"IBM Plex Sans,sans-serif\" transform=\"rotate(-90 12 108)\">Rentabilidad del activo (%)</text>\n<text x=\"46\" y=\"194\" font-size=\"10\" fill=\"#5A6875\" font-family=\"IBM Plex Sans,sans-serif\">250 sesiones</text>\n</svg>","datos":[["Activo","Compañía de mediana capitalización"],["Índice de referencia","IBEX 35"],["Beta 1 (pendiente)","1,05"],["Beta 0 (constante)","0,00%"],["Pearson","0,41"],["R cuadrado","0,17"],["Observaciones","250 sesiones"]],"lectura":"Beta 1 vale 1,05, prácticamente 1, luego es una beta NEUTRAL: el activo asume el mismo riesgo de mercado que el índice. Beta 0 vale 0,00%: el gestor no aporta ni destruye valor cuando el mercado no se mueve. Pero aquí lo interesante está en el resto. El Pearson de 0,41 está por debajo de 0,60, luego hay AUSENCIA de correlación, y el R cuadrado de 0,17 confirma que el mercado solo explica el 17% del comportamiento del activo. Eso significa que epsilon, el término de error, es MUY GRANDE: el 83% de lo que le pasa a este activo no lo explica el mercado. Conclusión: la beta de 1,05 es engañosa si se lee sola. Aunque su riesgo sistemático sea equivalente al del índice, su riesgo total está dominado por el componente idiosincrático. Es el mismo razonamiento que explica el riesgo de un hedge fund: poca correlación con el mercado, luego el riesgo no viene del mercado."}];
var CASOS_CARTERA = [{"id":"c1","titulo":"Cartera A · Mixta con PUT de cobertura","filas":[["Iberdrola","45%","beta 0,72"],["Banco Santander","40%","beta 1,63"],["PUT sobre Santander","15% del nominal","strike 4,20 € / spot 4,05 €"]],"extra":"Correlación Iberdrola–Santander: 0,58","veredicto":"SÍ, con matices","lectura":"Iberdrola, con beta 0,72, está entre 0 y 1: es CONSERVADORA y amortigua los movimientos del mercado. Santander, con 1,63, supera 1: es AGRESIVA y amplifica tanto las subidas como las caídas, asumiendo un 63% más de volatilidad que el índice. Al estar los pesos repartidos casi a partes iguales entre un activo defensivo y uno agresivo, el riesgo de mercado del conjunto queda próximo a la neutralidad, y el activo que domina ese riesgo es Santander. Eso importa porque es justo el que está cubierto con la PUT. La correlación de 0,58 está por debajo de 0,60, luego hay AUSENCIA de correlación entre los dos activos: diversifican bien entre sí. La PUT está comprada sobre Santander, que es el activo más agresivo, lo cual es lo razonable: se cubre lo que más riesgo aporta. Y cubre el 15%, no el 40%: es una cobertura PARCIAL, tal como el profesor recomienda. El strike de 4,20 € está por encima del spot de 4,05 €, así que hoy la opción tendría valor intrínseco si se ejerciera. Recomendación: cartera equilibrada y bien construida, apta para un perfil moderado. Como advertencia al CEO: la PUT comprada no reduce el capital invertido y se describe aparte, así que los pesos de la renta variable suman 85% y el 15% restante es nominal cubierto, no capital adicional."},{"id":"c2","titulo":"Cartera B · Concentrada en banca con cobertura excesiva","filas":[["Banco Santander","45%","beta 1,63"],["BBVA","45%","beta 1,55"],["PUT sobre Santander","60% del nominal","strike 3,80 € / spot 4,05 €"]],"extra":"Correlación Santander–BBVA: 0,93","veredicto":"NO","lectura":"Los dos activos superan la unidad: Santander 1,63 y BBVA 1,55. Ambos son AGRESIVOS, así que la cartera entera amplifica los movimientos del mercado y no hay ningún activo que amortigüe. En caídas amplifica exactamente igual que en subidas. Por MiFID II no sería recomendable para un cliente sin conocimientos financieros. El problema mayor es la correlación de 0,93, muy por encima de 0,80: correlación FUERTE. Los dos activos son bancos españoles con enorme peso en el IBEX, así que se mueven casi igual y NO diversifican nada. La cartera tiene dos posiciones pero el riesgo de una sola. Sobre la cobertura hay dos errores: primero, cubre el 60% del nominal, lo que contradice el principio de cobertura PARCIAL; segundo, el strike de 3,80 € está por debajo del spot de 4,05 €, luego la protección solo empieza tras una caída de más del 6%, y además solo cubre Santander, dejando BBVA totalmente expuesto pese a moverse igual. Recomendación: NO. La cartera concentra riesgo sectorial, tiene beta agresiva, no diversifica y la cobertura está mal dimensionada y mal situada. Habría que introducir un activo descorrelacionado y redimensionar la PUT."},{"id":"c3","titulo":"Cartera C · Con PUT vendida","filas":[["Inditex","50%","beta 1,08"],["Repsol","35%","beta 1,21"],["PUT VENDIDA sobre Inditex","15% del nominal","strike 42 € / spot 44 €"]],"extra":"Correlación Inditex–Repsol: 0,44","veredicto":"NO","lectura":"Inditex con 1,08 y Repsol con 1,21 están ambas ligeramente por encima de 1: el riesgo de mercado es algo superior al del índice, pero sin grandes desequilibrios entre las dos posiciones. La correlación de 0,44 está muy por debajo de 0,60: ausencia de correlación y por tanto buena diversificación entre un textil y una petrolera. Hasta aquí la cartera es correcta. El problema está en la opción, y es un problema grave. La PUT está VENDIDA, no comprada. Eso cambia todo por tres razones. Primera: vender una PUT no cubre nada; es una apuesta a que el precio no caerá, y si cae, el vendedor está obligado a comprar al strike. Segunda: la pérdida potencial no está limitada a la prima, como en la opción comprada, sino que se comporta como una posición que puede generar pérdidas muy superiores a la prima cobrada. Tercera, y es la trampa que el profesor señaló: una PUT vendida genera un peso NEGATIVO en la cartera, lo que hace que las asignaciones sumen por encima del 100%. Recomendación: NO. La cartera de renta variable está bien construida, pero la opción vendida introduce riesgo en la misma dirección que la posición larga en lugar de cubrirla. Para cubrir hay que tomar la posición contraria, lo que exige comprar una PUT, no venderla."},{"id":"c4","titulo":"Cartera D · Defensiva con CALL sobre una posición corta","filas":[["Enagás","40%","beta 0,55"],["Red Eléctrica","35%","beta 0,61"],["Posición corta sobre un banco","25% del nominal","—"],["CALL sobre ese banco","10% del nominal","strike 5,10 € / spot 4,90 €"]],"extra":"Correlación Enagás–Red Eléctrica: 0,81","veredicto":"SÍ, con una reserva","lectura":"Enagás con 0,55 y Red Eléctrica con 0,61 están claramente entre 0 y 1: ambas son CONSERVADORAS, así que la parte larga de la cartera amortigua con fuerza los movimientos del mercado. Apta para cualquier perfil, incluido el minorista sin conocimientos. La CALL está bien planteada, y esta es la parte que hay que saber explicar: existe una posición CORTA sobre un banco, es decir, una apuesta a que su precio caerá. Si ese banco subiera, la posición corta generaría pérdidas. Para cubrirla hay que tomar la posición contraria a la corta, lo que significa comprar una opción de COMPRA, una CALL. Es exactamente el ejemplo que dio el profesor. Además cubre el 10% frente a un 25% de posición corta: cobertura PARCIAL, correcta. La reserva está en la correlación: 0,81 supera el umbral de 0,80, luego Enagás y Red Eléctrica tienen correlación FUERTE. Son dos reguladas del mismo tipo de negocio y no diversifican entre sí. Recomendación: SÍ, la estructura de cobertura es técnicamente correcta y el perfil de riesgo es bajo, pero conviene advertir de que la parte larga está concentrada en un mismo perfil de negocio regulado y convendría introducir un tercer activo de otro sector."}];

  ["Mercado monetario","Negocia activos a corto y medio plazo, hasta 18 meses. Son muy líquidos y de bajo riesgo, porque sus emisores suelen tener alta calidad crediticia. Productos: depósitos y repos (el repo es un pacto de recompra que funciona como un alquiler del rendimiento, sin transmitir la propiedad; sirven para gestionar liquidez a corto plazo), FRAs (acuerdos sobre tipos futuros, sirven para cubrirse de variaciones de tipos) y forex o divisas (el mercado más grande del mundo, OTC, sirve para fijar tipos de cambio y cubrir riesgo de divisa)."],

 t:"El bono: los cinco puntos",

 aviso:"En el punto 3 el profesor pidió literalmente explicarlo «como si se lo explicarais a mi madre». Ahí los tecnicismos restan.",

  ["1. Qué es","Un bono es un instrumento de renta fija emitido por un gobierno o una empresa, mediante el cual el inversor presta dinero al emisor a cambio de recibir periódicamente un porcentaje del nominal, el cupón, y la devolución del nominal al vencimiento. En esencia es un contrato de préstamo."],
  ["2. Elementos","Emisor, código ISIN, valor nominal o par, cupón, fecha de emisión, fecha de vencimiento y frecuencia de pago del cupón (trimestral, semestral o anual)."],
  ["3. Cómo funciona","Yo te presto dinero. Durante un periodo de tiempo, en unas fechas de pago concretas, voy recibiendo un porcentaje del bono. Y al final, en la última fecha de pago, recibo el valor nominal."],
  ["4. Mercados","En el primario se compra directamente al emisor: al gobierno en la subasta del Tesoro si es soberano, o vía entidades financieras si es corporativo. En el secundario, a otros inversores a través de casas de valores, en bolsa o en plataformas OTC. En España el organismo rector de la deuda pública es el Banco de España y el de la privada, AIAF."],

 rub:[
  {v:0.5,p:"Defino la regresión como medida de sensibilidad entre dos variables y escribo Y = β0 + β1·X + ε"},
  {v:0.5,p:"Y es SIEMPRE la rentabilidad del activo, cartera o fondo (endógena)"},
  {v:0.5,p:"X es SIEMPRE el índice bursátil de referencia, nunca el tiempo (exógena)"},
  {v:0.5,p:"β1 es la pendiente o beta de Sharpe: sensibilidad al mercado, calculada por MCO"},
  {v:0.5,p:"β0 es el valor de Y cuando X vale 0 (Alfa de Jensen), con la tasa libre de riesgo como referencia"},
  {v:0.5,p:"ε son los residuos, lo no explicado por el modelo, y debe ser mínimo. Interpreto el valor concreto con la fórmula de lectura"}
 ],
 modelo:[
  ["Qué es una regresión","Un modelo que mide la sensibilidad o relación lineal entre dos variables: una dependiente y una independiente. Su expresión es Y = β0 + β1·X + ε."],
  ["Y (endógena)","Es siempre la rentabilidad del activo, de la cartera, del portfolio o del fondo de inversión. Es lo que queremos explicar."],
  ["X (exógena)","Es siempre el índice bursátil de referencia, es decir el mercado. Nunca es el tiempo."],
  ["β1 (beta de Sharpe)","La pendiente de la recta: mide cuánto cambia Y por cada unidad de cambio en X. Se calcula por Mínimos Cuadrados Ordinarios y mide el riesgo de mercado o sistemático."],
  ["β0 (Alfa de Jensen)","El valor de la endógena cuando la exógena vale cero: el rendimiento del gestor cuando el mercado no abre. Su referencia mínima exigible es la tasa libre de riesgo, el bono alemán a 10 años."],
  ["ε (residuos)","Recoge todo lo que el modelo no ha podido explicar. Debe ser lo más pequeño posible."],
  ["Cómo interpretar el valor","«Por un incremento de 1 punto porcentual del índice, el activo crecerá β1 veces, asumiendo un (β1−1)% más o menos de volatilidad que el mercado.» Si β>1 es agresiva; entre 0 y 1, conservadora; negativa, relación inversa."]
 ]
},
{
 id:"d4",
 reglas:"La cartera contiene VARIOS productos (bonos, acciones y una opcion). Hay que definir y explicar CADA UNO, no solo la opcion: si el alumno ignora el bono o la accion, el criterio de definicion no se cumple. Del bono bastan cuatro o cinco caracteristicas. De la opcion, el minimo exigible que pidio el profesor es americana/europea, put/call y el strike. El examen es PURAMENTE TEORICO y la beta de la cartera viene YA CALCULADA: no penalices nunca la ausencia de calculos, valora que clasifique e interprete.",
 casos:"cartera",
 t:"Analizar y recomendar una cartera",
 fuente:"Confirmada · Sesión 7, min 02:11-02:15",
 enun:"Usted, futuro director financiero, analice, explique y recomiende SÍ o NO la cartera que se detalla a continuación. Se lo va a explicar al CEO de la empresa, de formación abogado.",
 aviso:"Define los TRES productos (bono, acción y opción), no solo la opción. El examen es PURAMENTE TEÓRICO: no hay que calcular nada, y la beta de la cartera vendrá dada. Comprueba si la opción está COMPRADA o VENDIDA y si cubre una posición larga o corta, y explica europea Y americana si no se especifica. El CEO es abogado: claridad, no jerga.",
 rub:[
  {v:0.6,p:"DEFINICIÓN: defino CADA producto de la cartera, no solo la opción. El bono (contrato de préstamo con cupón), la acción (parte del capital, da dividendo) y la opción (derecho, no obligación, al strike a cambio de una prima)"},
  {v:0.6,p:"FUNCIONAMIENTO: compruebo si la opción está COMPRADA o VENDIDA y si la posición es LARGA o CORTA. Para cubrir se toma siempre la contraria: larga con PUT, corta con CALL"},
  {v:0.6,p:"ELEMENTOS de cada producto: del bono cuatro o cinco características; de la opción como mínimo americana/europea, put/call y el strike, explicando ambos casos si no se especifica"},
  {v:0.6,p:"MERCADO: opciones en mercado organizado (MEFF, con BME Clearing) y en OTC, donde solo hay forwards, opciones y swaps"},
  {v:0.6,p:"INTERPRETACIÓN: CLASIFICO las betas (agresiva, neutral o conservadora), valoro la diversificación con los umbrales de correlación, compruebo que la cobertura es parcial y doy una recomendación explícita. Sin calcular nada"}
 ],
 modelo:[
  ["1. Definición","Una cartera es un conjunto de activos con pesos definidos. Hay que definir CADA producto que aparezca en ella. El BONO es un instrumento de renta fija: un contrato de préstamo por el que el inversor recibe un cupón periódico y el nominal al vencimiento. La ACCIÓN es renta variable: representa una parte del capital de la empresa y da derecho a dividendo y a voto en la junta. La OPCIÓN PUT es un contrato en el que solo una de las partes tiene el derecho, no la obligación, de vender el subyacente al precio strike en una fecha determinada, a cambio de pagar una prima."],
  ["2. Funcionamiento","La PUT cubre la posición larga en Santander tomando la posición contraria: si la acción cae por debajo de 4,20 €, el derecho de venta al strike compensa la pérdida. Si sube, no se ejerce y solo se pierde la prima. En derivados, para cubrir se toma SIEMPRE la posición contraria."],
  ["3. Elementos","De cada producto. Del BONO, cuatro o cinco características bastan: emisor, nominal, cupón, vencimiento y frecuencia de pago. De la ACCIÓN: la empresa emisora, el peso en la cartera y su beta. De la OPCIÓN: strike, spot, prima, vencimiento y tipo de opcionalidad; como el enunciado no lo especifica, si es europea solo podría ejercerse a vencimiento y si es americana en cualquier momento de la vida del producto, con prima más cara."],
  ["4. Mercado de contratación","Las opciones se negocian en mercado organizado, donde la cámara de contrapartida elimina el riesgo de contraparte (en España MEFF, con BME Clearing), y también en OTC, donde solo se negocian tres productos: forwards, opciones y swaps."],
  ["5. Interpretación y recomendación","Iberdrola con β=0,72 es conservadora: amortigua los movimientos del mercado. Santander con β=1,63 es agresiva: por cada punto que sube el IBEX crece 1,63 veces, asumiendo un 0,63% más de volatilidad. La correlación de 0,58 está por debajo de 0,60, luego hay ausencia de correlación y los dos activos diversifican bien. La PUT está comprada sobre el activo más agresivo, que es lo razonable, y cubre solo el 15%: es una cobertura PARCIAL, tal como debe ser. Recomendación: cartera equilibrada y bien construida, apta para un perfil moderado. Conviene advertir de que la PUT no reduce el capital invertido y se describe aparte, y de que el strike está por encima del spot, así que hoy la opción tendría valor si se ejerciera."]
 ]
}
